name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" timm==1.0.30 matplotlib huggingface_hub yacs==0.1.8
      - name: Run the CPU test suite (GPU and dataset tests are server-only)
        run: pytest -m "not gpu and not data"
