[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-routing"
version = "0.1.0"
description = "Selective temporal routing of echocardiography video: semantic view changes vs nuisance discontinuities (Harvard capstone)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "pillow>=10.0",
  "pyarrow>=14.0",
  "rich>=13.0",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "av>=12.0", "opencv-python-headless>=4.9", "hmmlearn>=0.3", "matplotlib>=3.8", "huggingface_hub>=0.23"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["echo_routing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not gpu and not data'"
markers = [
  "gpu: requires a CUDA GPU (server only)",
  "data: requires the EV9V dataset on disk (server only)",
]

[tool.coverage.run]
source = ["echo_routing"]
omit = ["echo_routing/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
