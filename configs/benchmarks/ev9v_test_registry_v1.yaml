# Model registry for the frozen EV9V test benchmark (benchmark id ev9v-test-ladder-v1). One entry per frozen system.
# A new frozen model is added as a new entry (new name) and evaluated as a new run version; finished entries and their
# results are never edited. Fields:
#   adapter     how outputs on the benchmark's 10 Hz axis are produced (scripts/benchmark_adapters.py)
#   weights     every weight file the system reads, with sha256 (checked before every run)
#   decoder     the decoder and its saved numeric setting (never re-chosen on the benchmark)
#   seed        the training seed of a seeded system; external single models have none
#   provenance  training data, pretraining and historical test use (audited in the round's provenance table)
registry: ev9v-test-registry-v1
benchmark: ev9v-test-ladder-v1
systems:
  A14_P_s0: &a14
    adapter: a14_router
    seed: 0
    weights:
      a08: {path: models_frozen/video_within_view_v1/all_s0/final.pt, sha256: 9b144925f32fac7d725d13231a132abeb6635fa44b6fe0dbcec7f5b59d035bbc}
      a13_head: {path: runs/video_frozen_switch_v1/train/H_s0/final.pt, sha256: 19cb9310951c4c95ef2c0b15559959758fe2222cbc3786fe8650a9e4c0a1293f}
