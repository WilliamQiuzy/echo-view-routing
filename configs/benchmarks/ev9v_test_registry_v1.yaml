    decoder: {base: "A08 choices all_s0 (B3 numeric setting)", alternative: "A13 choices H_s0 threshold", router: "A14 choices P_s0 threshold (0.8)"}
    provenance: {training: "EV9V train split (A07/A10/A11 manifests; A14 training pool)", pretraining: "EchoPrime MViTv2-S video encoder (via V01 Ordered)", test_history: "never evaluated on test; lineage partly chosen after H01-H09 test use"}
