# Label ontology for EV9V. Raw codes are preserved verbatim in every manifest;
# mappings are versioned so anatomical claims can be traced to a mapping version.
# Source of the conflict: the HF dataset card and the STFM README give different English
# expansions for PMASA / PMPALA / PMVLSA / PPMLSA. We do NOT resolve this silently.
mapping_version: family5_v1
raw_codes: [PLHLA, PASA, PMPALA, PMVLSA, PPMLSA, PMASA, A4C, A5C, SC4C]

# Primary task: coarse 5-family routing (proposal §4.2). PMPALA excluded until its expansion is resolved.
family5:
  PLHLA: PLAX
  PASA: PSAX
  PMVLSA: PSAX
  PPMLSA: PSAX
  PMASA: PSAX
  A4C: A4C
  A5C: A5C
  SC4C: SC4C
  PMPALA: null          # excluded from primary task (unresolved code expansion)
family5_classes: [PLAX, PSAX, A4C, A5C, SC4C]

# Sensitivity endpoint: original 9-code benchmark, order as in STFM's INDEXOFLABEL for comparability.
raw9_classes: [PLHLA, PMASA, PMVLSA, PASA, A4C, A5C, PMPALA, PPMLSA, SC4C]

# English expansions as PUBLISHED, both sources kept. Clinical check pending.
expansions:
  dataset_card:
    PLHLA: Parasternal Long Axis View
    PASA: Parasternal Short Axis View
    PMPALA: Pulmonary Main Pulmonary Artery Long Axis View
    PMVLSA: Parasternal Short Axis View at Mitral Valve Level
    PPMLSA: Parasternal Short Axis View at Papillary Muscle Level
    PMASA: Parasternal Short Axis View at Apical Level
    A4C: Apical 4-Chamber View
    A5C: Apical 5-Chamber View
    SC4C: Subcostal 4-Chamber View
  stfm_readme:
    PLHLA: Parasternal Long Axis
    PMASA: Parasternal Short Axis (Mitral Valve)
    PMVLSA: Parasternal Short Axis (Papillary Muscle)
    PASA: Parasternal Short Axis (Aortic Valve)
    A4C: Apical 4-Chamber
    A5C: Apical 5-Chamber
    PMPALA: Parasternal Long Axis (Apical)
    PPMLSA: Parasternal Short Axis (LV)
    SC4C: Subcostal 4-Chamber
