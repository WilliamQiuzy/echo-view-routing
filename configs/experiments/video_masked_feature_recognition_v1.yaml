# A40 (video_masked_feature_recognition_v1), 2026-10-27 UTC: masked-region HOG prediction as an auxiliary target in
# full-encoder classification continuation of A08, against the identical continuation without it. One matched comparison.
# Committed before any HOG statistic, lambda, model forward or training. Task sheet:
# claude_prompts/2026-10-26-masked-feature-a5c-training.md (sha256 8eab5e0b3cc7f9f14110a6f1b2f1dac06cc03978c3692f401bd0f109684ead03).
# Question: in the same full-encoder classification continuation, does adding a label-free target -- the histogram of
# oriented gradients of masked regions, computed from the raw pixels -- give a transferable A5C correction while keeping
# correct A4C / A5C and the complete segmentation? Borrowed from MaskFeat (Wei et al., CVPR 2022, arXiv 2112.09133) as a
# short joint adaptation: not a reproduction of that paper and not a new algorithm. HOG is a local distribution of edge
# orientations, not LVOT, an anatomical label or expert judgement; ultrasound texture and label ambiguity can limit any gain.
# Not a first self-supervision (D04 trained temporal InfoNCE / tilt), not a first full-encoder training, not a first use of
# patches (V02). No development / check / test / Pediatric reading; source seed 2 only by the rule below.
experiment: video_masked_feature_recognition_v1

masked_feature:
  id: A40
  type: matched_training_comparison
  predecessors: "D04 (docs/results/2026-10-04_geometry_pretraining: E1 self-supervised temporal InfoNCE / tilt regression; closed), A09 (docs/results/2026-10-18_video_discriminative: supervised contrast; closed), V02 (docs/results/2026-10-11_target_patch_readout: patch readout replaced end to end; closed), A31 (docs/results/2026-10-24_session_correction: last-block adaptation fits better without a held-out session net gain; error emphasis mostly moves the A4C / A5C boundary), A34 (docs/results/2026-10-25_native_bag_evidence), A36-A39 (docs/results/2026-10-26_native_spatial_detail, _wider_temporal_evidence, _predicted_run_context, _local_token_a5c_evidence: aggregation / frozen descriptors; A39 S1 0 / 103 for both heads, 323fe07 / 0628af9 / 171b295 / d058597, closed at source 0)"
  changed_condition: "the source of the training target and a dense gradient path: a HOG target from the raw pixels of masked regions trains the video encoder's non-CLS outputs, compared with the same full-encoder continuation, the same inputs and the same classification CE without the auxiliary term. Not another frozen-feature pooling, clip-code weighting, error sampling or teacher vote"
  data:
    pools: "A31 fold pools runs/video_session_correction_v1/pool_{0,1}.npy (sha256 96d1fb683e1a261d5be9a3cc7ec393637577bbf83b56140cec41f544c4f3b486 / 08255192dae3a90644ea062880bf6b2b298181ed12e9890d56ca04630f5adef4); split.json e03100941d77e1fe64a825e4f2a4f7ef038a5725bcf943a55db15a983ef29d6d (sessions / recordings / window identities shared 0); all re-verified"
    requests: "A31's pool_W order: stride-5 centres c of the complete sequences, S = window_frames(c, N, 16, 16) (A08's 16 samples, 10 Hz, about 1.5 s), marker = marker_slot(S, c), 224 centre crop / gamma, nearest-centre output map; unchanged for training and readout (no long window, density, field of view or run truncation)"
    base_outputs: "A31 outputs_s{s}_f{f}.npz (q, e224): s0 5884435770e8b65959b22ff77f74b0c2053cadf7fd2a5a28c842104df2f1a512 / 0a99be35b0cd78d650f5014c8ddc783173e6fb849ee556d6fa2a52c73f33d360; s2 5e8042a75e7c38d2f8345c3c3bbf357039efeed530f8758a1a7c7838fe5507fb / 2b1f1e13dce2a769f4091745e531bb998bc122b58cd5f3c09d2c364d904f4a33"
    base_runs: "A31 data/runs_s{s}_f{f}.npz (P runs, base_labels): s0 7b28ac6c224f594ef7bf49d6307186807d91bd8577dbc192e8cece07bea7452c / 98ce5c572aa29576a098685c1d28220684e755cbea537b6739020c0387ddc026; s2 91d04d4f255b7e892343b102c736f1b69c8126a69f2e0df1f5c23f1c60d8860f / ef76e587a0db2c7b18dcbdaee5631497963ad8eb9988a929e4526d5949259ef9"
    a08: "models_frozen/video_within_view_v1/all_s0/final.pt 9b144925f32fac7d725d13231a132abeb6635fa44b6fe0dbcec7f5b59d035bbc; all_s2 f95fed7ba78cc0b5e2474c71a156356507b4588a4b324957fd5b53fe66ee8472 only if the rule triggers. The frozen A08 + B3 keeps producing Base and its runs"
    pixels: "A08 frame rule: numerically ordered JPEG, RGB, gamma LUT rounded to 6 decimals, short side 256 then centre crop 224 (uint8); A08 normalisation and marker planes; 16 slots"
    fit_only: "fit fold f reads only pool f for training, lambda and fit monitoring; held-out pool 1 - f is read once, by the frozen models' readout"
    not_read: "development / check / test / EchoNet-Pediatric; the A26 runner; S1 / harm sets for any training exposure"
  arms:
    R: "loss = CE + 0 x L_HOG (the masked forward and its backward run, coefficient 0)"
    H: "loss = CE + lambda x L_HOG"
    identical: "per source seed s and fit fold f both arms copy A08 all_s{s}; same batches, pixels, masks, auxiliary initialisation, model RNG start, optimiser, schedule, train mode, dropout / stochastic depth; the only difference is the coefficient"
    trained: "everything, explicitly unfrozen from update 0: the encoder (MViTv2-S trunk and its 768 -> 512 projection encoder.head), marker_stem, classifier and the auxiliary decoder (training only). No encoder-freezing warm-up"
  batch:
    windows: "8 per update: 4 adjacent request centres of one native sequence, then 4 adjacent request centres of one constructed stream whose 4 centre labels contain a change (A07's group_indices / eligible_starts; a native sequence with fewer than 4 centres repeats its last centre); from the fit pool only, on its pool_W centres"
    draw: "rng = numpy default_rng([20261026, 40, s, f, update, 1]); in this order: native sequence uniformly, its start uniformly, eligible constructed stream uniformly, its eligible start uniformly. No eligible group: engineering stop, no fallback"
    labels: "the clip-code label of each of the 8 centres; CE = equal-weight mean over the 8 windows. Not A31's 32-run pooled CE: H - R isolates the auxiliary target; a difference from A31 cannot be attributed to it"
    excluded: "no KL, relation / smoothness term, extra augmentation, class balancing, error priority, pseudo labels or external data"
  auxiliary:
    order: "per update: clean CE forward and backward first; then the masked forward and coefficient x L_HOG backward; gradients accumulate; one clip and one optimiser step. The clean graph is freed before the masked forward"
    target: "from the same uint8 crop / gamma frames as the clean CE input, before any masking, detached; marker not included. gray = mean of R, G, B as float32 / 255; gx[y, x] = gray[y, x + 1] - gray[y, x - 1], gy[y, x] = gray[y + 1, x] - gray[y - 1, x] (replicate edges, no division by 2); magnitude sqrt(gx^2 + gy^2); unsigned orientation atan2(gy, gx) mod pi in [0, pi). 9 bins of width pi / 9 centred at (k + 0.5) pi / 9; b = theta / (pi / 9) - 0.5, lo = floor(b) mod 9, hi = (lo + 1) mod 9, weight to hi = b - floor(b), to lo = 1 - that; votes weighted by magnitude. Each 8 x 8 cell sums its votes and is normalised alone, h / sqrt(sum(h^2) + 1e-6). A 32 x 32 block holds 4 x 4 cells; its 144-d target is cell row, cell column, bin in row-major order. Computed on demand; no whole-pool target cache"
    mask: "the 224 x 224 frame is 7 x 7 blocks of 32 x 32 (block index by * 7 + bx). Per window w in 0..7 of the update, numpy default_rng([20261026, 40, s, f, update, w]).choice(49, 25, replace=False) picks 25 blocks; the same tube mask on all 16 slots; all three channels of the normalised RGB set to 0 there; marker planes unchanged. Not chosen by class, error or teacher. Note: the draw stream and window 1's mask stream share their key as the task sheet fixes them; both are label-free and fixed before training"
    tokens: "the masked forward's encoder.norm output U [B, 393, 768], captured by a training hook that keeps autograd (no detach / clone), returns None (does not change the output) and is removed in finally (A39's detached clone is not reused). U[:, 1:] is reshaped time-major, y, x to [B, 8, 7, 7, 768] (torchvision MViT: conv_proj output flatten(2) over T, H, W). Token time t takes the HOG of input slot 2t; token (y, x) takes block (y, x). A fixed alignment, not a claim that a final token's receptive field is that block"
    decoder: "Linear(768, 144) with bias; weight N(0, 0.02^2) from its own torch.Generator seeded 20261026 + 40 + 10 s + f (s0: 20261066 / 20261067), bias 0; bit-identical and nonzero in both arms; it does not touch the model RNG. Used in training only"
    loss: "L_HOG = mean squared error over the 25 masked blocks x 8 times x 144 dims of every window (unmasked positions and clean-forward tokens are not used)"
    lambda: "once per source seed and fit fold, before formal training, on that fold's first 4 fixed training batches (updates 0-3, their masks), train mode, model RNG started as in training: per batch the L2 norms of the CE and the L_HOG gradients over the shared trunk (all encoder parameters except encoder.head.*, plus marker_stem.weight; a None gradient counts as 0); lambda = 0.25 x median(||g_CE|| / ||g_HOG||) over the 4 batches (median of 4 = mean of the middle two). No optimiser step, no parameter change; CPU / CUDA RNG restored afterwards. Every value nonzero and finite, otherwise engineering stop. Recorded for both arms (R's coefficient stays 0) and committed with the explicit code commit before formal training; never tuned, clipped or swept on fit / held-out results"
  optimisation:
    updates: 900
    optimizer: "AdamW betas (0.9, 0.999), eps 1e-8, weight decay 1e-4; groups: encoder (incl. the 512 projection) lr 1e-5; marker_stem, classifier, auxiliary decoder lr 1e-4"
    schedule: "linear warm-up over 90 updates, then cosine to update 900 (echo_routing.temporal.dev_train.lr_factor); the encoder is trainable throughout"
    clip: "global gradient norm 1.0 over all trained parameters"
    mode: "train mode in both arms (A08's dropout 0.5 in encoder.head and stochastic depth 0.2 schedule); final weights after update 900, no epoch selection"
    model_rng: "torch.manual_seed(2026102640 + 10 s + f) (CPU and CUDA) immediately before update 0 in both arms"
    numerics: "FP32; TF32 off; cudnn deterministic, benchmark False; use_deterministic_algorithms(warn_only=True). MViT's MaxPool3d backward is not deterministic on CUDA: no bitwise training equality is promised; warnings are kept"
    repeat_resume_limits: "fixed before the checks: 6-update repeat and 3 + 3 resume against 6, loss max abs <= 1e-4 and parameter max abs <= 1e-5; a failure is investigated, never relaxed"
    resume: "one active resume file per running model (model, decoder, optimiser, CPU / CUDA RNG, update), overwritten every 150 updates and deleted after the final weights are verified"
  models: "per source seed: R_f0, H_f0, R_f1, H_f1; the four full-state sha256 (and the decoders') and lambda record committed, the git objects verified, before that seed's single opposite-fold readout (fit f -> read 1 - f)"
  deployment: "the original Base P runs (frozen A08 + B3 cuts); each run takes the argmax of the multiplicity-weighted mean of the new model's softmax over its windows; equal neighbours merge (RLE); complete sequences scored with the original evaluator. The new recognition branch is a second encoder forward per window besides Base's; its cost is measured"
  checks: "independent numpy loop HOG (orientation, interpolation, normalisation, block layout) against the vectorised target; constant / zero-magnitude images give 0, single-orientation images vote only their bins; mask covers exactly the drawn blocks on all slots / channels and nothing else; marker untouched; target from clean pixels with no autograd path; unmasked positions do not change L_HOG or receive gradient; token axis (explicit loop index t * 49 + y * 7 + x) and the conv_proj flatten order; the training hook keeps autograd, leaves clean q unchanged, returns None and is removed after an exception; Init (the A08 copy, eval) equals A31's cached q within 1e-4 and Init = Base on every P run, sequence and A32 Base row; both arms' batches / pixels / masks / initial states identical; forced lambda 0 replay of H equals R within the repeat limits; accumulated CE then coefficient x L_HOG backward equals the joint backward, and a 4 + 4 microbatch split equals the full batch (eval, float tolerance); explicit unfreeze, optimiser binding, real step count; aux-only finite nonzero gradient reaching marker_stem, conv_proj, block 0 and block 15, with the zero-gradient tensor list recorded (A30's structural four included as observed); 6-update repeat and 3 + 3 resume (decoder, optimiser, all RNG) within the fixed limits; fold isolation; loaded modules match the committed code; throughput / peak memory on fit-fold training data before launch. Checks never read a candidate's held-out output"
  readouts: "per held-out fold and OOF for Base / R / H: fixed / broken / net runs and both A4C / A5C directions; recall and confusion of all true-A5C / A4C runs; A32 S1 recovered; Base-correct A5C and A4C kept; S1-fixed true-class (A5C-coded) source recordings, sessions and concentration with the S1 denominators (a run counts only its sources inside that run whose clip code is A5C); complete multi segment F1@50, native macro-F1, boundary P / R, FP / short FP, FN / missed short true, Base boundaries deleted by the merge; H - R, H - Base, R - Base; fit-only training monitors (CE, L_HOG, gradient ratio, parameter drift); measured cost. Session intervals are descriptive, not patient- or stream-independent"
  seed2_rule:
    target: "S1 recovered (H) - S1 recovered (R) >= +1 in each held-out fold and >= +5 over both folds"
    signal: "H recovers >= ceil(0.10 x S1 runs over both folds) (source 0: 11 of 103), from >= 3 distinct A5C-coded source recordings over both folds and >= 1 in each held-out fold"
    retain: "H keeps >= ceil(0.98 x Base-correct A5C runs) correct A5C (source 0: 1,127 of 1,150) and >= R's kept - 3; H keeps >= ceil(0.98 x Base-correct A4C runs) correct A4C (source 0: 1,385 of 1,413) and >= R's kept - 3 (over both folds)"
    net: "in each fold: H - Base net fixed >= 0 and H - R net fixed >= 0"
    system: "in each fold: segment F1 (H - Base) >= 0, segment F1 (H - R) >= 0, native macro-F1 (H - Base) >= -0.003, boundary recall (H - Base) >= -0.005; missed short true over both folds <= Base + 3"
    action: "all met at source 0: source 2 with the same recipe and budget, its own A08 / Base / S1 denominators (not 103 / 1,150), lambda, four models, freeze and one readout, reported for whether the rule repeats; otherwise this configuration closes at source 0. Even if met: no full fit, development / check / test / Pediatric evaluation or third seed; no mask / target / lambda / schedule / layer / input variant. A08 trained on these recordings: the folds hold out only this continuation's sessions"
  scope: "a result covers only this masked-HOG auxiliary in a 900-update full-encoder continuation of A08 with this batch / CE; not passing is not equivalence and does not disprove self-supervised, spatial or video-model routes"
  reuse: "A31 loaders / pool_W / runs / outputs / opt_of / sched / seq_rows / run_table (scripts/train_session_correction.py), A32 fold data / masks / change table / id guard (scripts/diagnose_a5c_evidence.py), A36 tables / staged / publish (scripts/train_native_spatial_detail.py), A37 chunk_frames / coverage (scripts/train_wider_temporal_evidence.py), A38 loaded_code / freeze / boundaries (scripts/train_predicted_run_context.py), A39 readout layout and a5c_extras (scripts/train_patch_evidence.py), A07 group rules (scripts/prepare_video_sequence_objective.py); read only"
  budget:
    gpu_hours_max: 6.0
    cpu_hours_max: 3.0
    new_disk_gb_max: 3.0
    min_free_disk_gb: 10
    launch_gate: "before formal training: spent + all pending source-0 work (4 x 900 updates at the measured rate, lambda, the readout at the measured forward rate) + 0.6 GPU h evaluation / closing reserve <= 6.0; re-projected before source 2. An overrun is an engineering stop; 900 updates, the batch and the scientific conditions are never cut to fit"
    accounting: "CPU includes the active agent / worker wall clock (waiting excluded); GPU loader time is not counted again as CPU; every failure is booked in this round's ledger; older ledgers are read only; the closing active span is appended"
    storage: "no pixel / prefix / target cache; final weights and small logs only; at most one active optimiser resume; only this round's regenerable intermediates may be deleted, after the finals are verified"
    ledger: runs/video_masked_feature_recognition_v1/ledger.jsonl
  outputs:
    root: runs/video_masked_feature_recognition_v1
    results_dir: docs/results/2026-10-27_masked_feature_recognition
    coordination: runs/video_masked_feature_recognition_v1/coordination.json
