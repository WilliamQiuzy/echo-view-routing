# A09-R1, full-schedule continuation of A09's plain arm C (2026-10-18 UTC). This is the lead's dated follow-up decision after
# reading A09's pilot result. It is not A09's promotion and not a preregistered success. A09's configuration, its stop_both
# record, its pilot states and its ledger stay unchanged and are read only.
# Question: at the pilot point the learning rate was still 0.84 of its peak. With the design unchanged, does completing the
# original decaying schedule keep the native gain and remove the extra short false segments? Training length, data exposure
# and learning-rate progress change together, so no result can be credited to the learning rate alone.
# Written before any R1 training or evaluation output existed. Exploratory feedback on the two reused development halves only.
experiment: video_discriminative_r1

video_discriminative_r1:
  decision: docs/superpowers/plans/2026-10-18-a09-r1-full-schedule.md
  parent:                        # every pin is checked before use; the parent identity is recomputed with the parent's code
