# End-to-end short-sequence objectives on the V01 Ordered video model (A07;
# docs/superpowers/plans/2026-10-15-end-to-end-sequence-objective.md). Fixed before any training group is counted, any code of
# this round exists or any model is trained. Three paired continuations of each seed's V01 Ordered final state read the same
# groups of four neighbouring request centres (one native group and one boundary-containing constructed-stream group per
# update, eight ordinary 16-frame windows) and differ only in the differentiable objective: F (target CE), B (run-balanced
# CE) and O (B plus A05's no-blank transcript-forward term). Gradients reach the RGB encoder after the inherited warm-up.
# No parameter, readout, temporal head or decoder is added. Labels serve the losses and the evaluation only. The test split
# and EchoNet-Pediatric are not read. This is a bounded objective comparison on an existing backbone; no novelty is claimed.
#
# Inherits model_development_v2.yaml only for the protocol keys (10 Hz, the 0.5 s boundary tolerance), the two development
# halves and the decoding grid (decode_grids.b3, checked against evaluation.b3 below).
extends: model_development_v2.yaml
run_name: video_sequence_objective_v1
experiment: video_sequence_objective_v1

