        1: {path: runs/raw_video_context_v1/evaluation/calibration/ordered_s1.npz, sha256: 37fb569093916aaf00d455fe92d8efe2397a6f1913c57d55d798c59acd2915ac}
        2: {path: runs/raw_video_context_v1/evaluation/calibration/ordered_s2.npz, sha256: 306f1abf7bfda0edad8dd21aa5980f89efa246aaa38c718db374df68de89315f}
    helpers:                     # reused helper sources; byte-identical through the round
      echo_routing/temporal/video_sequence_features.py: 91e239f50bf96da7a691b4ab3a3cfd5da55c4bf71fe2310959ecf163de211440
