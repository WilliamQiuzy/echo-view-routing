    V02_A02_A03: "continued CLS, replacement readouts and time-token supervision without qualifying segment gains; this round keeps the CLS readout and adds no token supervision"
    V03: "denser requests at inference; closed; this round keeps stride 5"
    A01_A06R1: "temporal heads and official FACT on frozen video features did not beat the strong reference; this round adds neither"
    A04: "corrected mixed-window labels often sit inside already-matched segments; recovered and lost segments and FP/FN are judged, not local accuracy"
    A05: "F/B/O on 2,565-parameter linear heads over frozen video features; no qualifying gain; not an exact repetition here: the representation, sequence length, sampling and optimisation differ, so there is no causal frozen-versus-unfrozen comparison"
    change: "the same three objectives on short raw-video target sequences, with gradients into the encoder, from the same seed's V01 Ordered state; only the matched arms isolate their objectives"
