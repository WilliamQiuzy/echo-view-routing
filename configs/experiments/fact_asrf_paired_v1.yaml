# DRAFT for the next stage (docs/results/2026-10-08_fact_integration/README.md): the official FACT and the official ASRF
# trained on the same frozen E1 512-d features under one recipe, three seeds each, then compared with B3 and the
# historical strongest configuration. Nothing here has been run. The lead decides the open items before any training.
#
# FACT is prior work (Lu and Elhamifar, CVPR 2024) and ASRF is prior work (Ishikawa et al., WACV 2021); integrating
# them is not a contribution of this project. The question is the lead's: does learning the frame-to-segment
# correspondence during training improve the trade-off between keeping short segments, judging the view and avoiding
# false cuts? Training reads the EV9V training split only. The test split and EchoNet-Pediatric are not read.
extends: model_development_v2.yaml
run_name: fact_asrf_paired_v1
experiment: fact_asrf_paired_v1
status: "draft, awaiting the lead's decision on the open items; no training, no development-set metric"

fact_asrf_paired:
  inputs:                        # as in fact_integration_v1.yaml; every sha256 is checked before use
    protocol: {path: runs/20261002-051140-model_development_protocol-fa45e7f4-s0/protocol.json,
               sha256: a897483b776e8cff1ba8b92774c6a82537758bcba6abd362f2d8603f37997593}
    e1_feature_manifest: {path: models_frozen/e1_echoviewclip_probe/v1/feature_manifest.json,
                          sha256: 56f59166ba3f1b428867e4ec9a7e6dfd800cb5bccd79db8191d3c916421f17c3}
    e1_cache_key: 16efc85be645
    input: "224 x 224 (short side 256, centre crop 224), 10 Hz samples in numeric frame order; no encoder fine-tuning"
  arms:
    FACT:
      code: "echo_routing.temporal.fact_head.FACTHead on third_party/fact at 7bd81bda2b84618a3e23876a2637a82f24881122"
      config: "configs/default.py + breakfast.yaml; trans false; one-to-one matching; ntoken 12 (int(1.5 x 8), the training bank's longest transcript); average transcript 2.654; no background class; no class weights; official null-class weight"
      decoding: "the official Block._eval: each frame takes the class of the non-null token it attends most (a2f), mixed with the frame branch at mwt 0.1; a dummy label sequence is passed"
    ASRF:
      code: "echo_routing.temporal.dev_heads.ASRFHead on third_party/asrf at 9623f1e8d9a1171333a4eeb65d190997b6c44a95"
      model: {in_channel: 512, n_classes: 5, n_features: 64, n_layers: 10, n_stages: 4, n_stages_asb: 4, n_stages_brb: 4}
      loss: "official CE with median-frequency class weights + Gaussian-similarity TMSE at weight 1 (gstmse_weight is passed as True, as the official train.py does; the 0.15 belongs to the plain TMSE, which is off) + 0.1 x boundary regression with pos_weight, the weights from the seed's epoch-0 batch labels"
      decoding: "official refinement_with_boundary at boundary_th 0.5"
  seeds: [0, 1, 2]
  training:                      # the shared recipe of the earlier rounds, identical for both arms
    batches: "TrainData.epoch_batches(seed, epoch): 4 bank streams + 4 native windows (at most 256 samples) per update; one plan per seed, shared by both arms and checked update by update"
    epochs: 50
    updates_per_epoch: 375       # 18,750 updates per run
    optimizer: {name: AdamW, lr: 3.0e-4, weight_decay: 1.0e-4, grad_clip: 1.0}
    schedule: "2 warm-up epochs, linear per update, then cosine to 0 (echo_routing.temporal.dev_train.lr_factor)"
    precision: "fp32, TF32 off, cuDNN deterministic"
    init: "one saved initial state per arm and seed (seed_everything(seed), then build)"
    rng: "seeded right before the first update and restored on resume"
    resume: "after every epoch: weights, optimiser, scheduler, RNG, epoch records"
    smoke: "before the queue: same-state reproducibility, resume (3 + 3 updates against 6), padding without effect, finite gradients except FACT's documented structural zeros, the plan, timing and memory"
    queue: "seed 0: FACT, ASRF; seed 1: FACT, ASRF; seed 2: FACT, ASRF; one GPU job at a time"
  checkpoint_rule: "the final weights after 50 epochs; no early stopping and no development-set reading during training"
  evaluation:                    # once, after all six runs and their final weights are fixed
    halves: [selection, calibration]
    units: "native clips, pair streams and multi streams of the protocol"
    systems: ["FACT (3 seeds)", "ASRF (3 seeds)", "E1 + B3 (archived settings, reproduced)", "E0 + B3 (historical strongest, archived settings, reproduced)", "E1 + ASRF (historical, seeds 0-2, reproduced)"]
    primary: "FACT - ASRF, multi-stream segment F1@50, per seed and half"
    secondary: ["FACT - (E1 + B3)", "FACT - (E0 + B3)"]
    bootstrap: {draws: 2000, seed: 20261002}   # native clips by session, streams by stream (approximate)
    consistent: "all three seeds' 95% intervals exclude zero on the same side; each half judged on its own; otherwise no consistent difference is detected, which is not equality"
    mechanism:                   # the lead's question; reported for every system, never part of the decision
      short_segments: "recall of multi-stream reference segments of at most 16 samples (the training bank's lower quartile of segment length) and of the middle runs of X->Y->X reference patterns, A4C/A5C patterns separately"
      class_judgment: "native macro-F1, per-class recall, A4C read as A5C and A5C read as A4C (clips, recordings, sessions)"
      false_cuts: "native internal cuts per clip, cuts at same-view joins of multi streams, boundary precision"
      changes: "FACT against ASRF: clips fixed and new, reference segments matched by one only, true view changes found by one only, with distinct recordings and sessions"
      diagnostic: "FACT's frame-branch argmax beside its full decoding, and the number of non-null tokens against the reference segment count"
  constraints:                   # unchanged
    boundary_recall_min: 0.95
    native_macro_f1_min: {selection: 0.973, calibration: 0.980}
    rule: "every seed and half; a failure is reported with its values and is never repaired by another epoch or decoding setting"
  goal:                          # unchanged
    selection_min: 0.944409687184662
    calibration_min: 0.9821421709894332
    calibration_sensitivity: "0.9738935784747763 + 0.01, reported beside the goal"
  decision:                      # draft, for the lead to confirm
    - {observation: "FACT - ASRF not consistent positive in both halves", action: "the comparison ends; each half reported as positive, negative or uncertain"}
    - {observation: "consistent positive in both halves, but not better than E1 + B3 in both halves", action: "FACT helps against ASRF only; no new-model claim"}
    - {observation: "better than ASRF and E1 + B3 in both halves, but a constraint fails", action: "a comparative gain that is not usable; the failed constraint is named"}
    - {observation: "comparisons and constraints met, goal not met", action: "a local success; the lead decides the next step"}
    - {observation: "comparisons, constraints and goal met", action: "the goal is reached under the development protocol; independent validation is still needed; opening test is decided separately"}
  open_items:                    # for the lead
    - "optimiser: the shared recipe above, or FACT's official Breakfast settings (Adam 1e-4, no weight decay, clip 10, x0.1 at epoch 80 of 150, 4 videos per batch) for the FACT arm only"
    - "checkpoint rule: final weights (above), or the calibration-half feasibility rule of the L1 + ASRF round for both arms"
    - "base config: breakfast.yaml (118.6 M parameters, four blocks iuUU, MS-TCN++ frame branches with 512 maps, above) or gtea.yaml, the small-dataset option named in the help of utils/gen_config.py (10.2 M parameters, three blocks iuU, MS-TCN with 128 maps, dropout 0.2, channel masking 0.5, stronger temporal masking)"
    - "budget: about 13 h of training for the six runs on the L40S with the shared recipe and the Breakfast base (measured per update: FACT 0.724 s, about 3.8 h a run; ASRF 0.090 s, about 0.5 h a run), plus smoke checks and one evaluation; the optimiser and base-config items would change this figure"
  never: "no development-set reading during training; no threshold, decoding or epoch search; no encoder fine-tuning; no module of our own; no test split; no EchoNet-Pediatric"
