# FACT and ASRF trained on the same frozen E1 512-d features, three seeds each, then evaluated once against B3 and the
# archived references (docs/superpowers/plans/2026-10-08-fact-asrf-training.md, the lead's four decisions). Fixed before
# any preparation, smoke check or training; the earlier draft of this file is kept in git (a0f4fe1).
#
# FACT is prior work (Lu and Elhamifar, CVPR 2024) and ASRF is prior work (Ishikawa et al., WACV 2021); training them is
# not a contribution of this project. The comparison is between two complete trained systems with their own optimisers;
# a difference cannot be attributed to cross-attention or to the matching loss alone. Training reads the EV9V training
# split only. The development halves are built by the report entry alone, after all six runs have their final weights.
# The test split and EchoNet-Pediatric are not read.
extends: model_development_v2.yaml
run_name: fact_asrf_paired_v1
experiment: fact_asrf_paired_v1

fact_asrf_paired:
  inputs:                        # as in fact_integration_v1.yaml; every sha256 is checked before use
    protocol: {path: runs/20261002-051140-model_development_protocol-fa45e7f4-s0/protocol.json,
               sha256: a897483b776e8cff1ba8b92774c6a82537758bcba6abd362f2d8603f37997593}
    e1_feature_manifest: {path: models_frozen/e1_echoviewclip_probe/v1/feature_manifest.json,
                          sha256: 56f59166ba3f1b428867e4ec9a7e6dfd800cb5bccd79db8191d3c916421f17c3}
    e1_cache_key: 16efc85be645
    frame_order: numeric-2026-09-30
    feature_dim: 512
    variants: [orig, gamma090]
    input: "short side 256, centre crop 224; 10 Hz samples in numeric frame order; no encoder fine-tuning"
    integration_alignment:       # reused when every input and the bank digest are unchanged
      data_checks: {path: docs/results/2026-10-08_fact_integration/data_checks.json,
                    sha256: 554348aef2272a2506eb19163cf764b0b1cf473ab31b287c563b8c171e569e83}
      monitor_set: runs/fact_integration_v1/data_details.json   # the 16 fixed training sequences (server only)
  seeds: [0, 1, 2]
  queue: [FACT_s0, ASRF_s0, FACT_s1, ASRF_s1, FACT_s2, ASRF_s2]   # one GPU job at a time
  data:                          # the shared batch plan (TrainData.epoch_batches), one per seed, identical for both arms
    streams_per_batch: 4
    natives_per_batch: 4
    native_window: 256
    native_per_epoch: 1500
    epochs: 50
    updates_per_epoch: 375
    total_updates: 18750
  arms:
    FACT:
      repo: third_party/fact
      commit: 7bd81bda2b84618a3e23876a2637a82f24881122
      base_config: gtea.yaml     # configs/default.py + gtea.yaml; official channel masking, temporal masking and dropout kept
      dataset_overrides:         # only the fields fixed by the integration stage
        n_classes: 5
        bg_class: []
        trans: false
        match: o2o
        token_ratio: 1.5
        expected_ntoken: 12      # int(1.5 x the longest training transcript, 8)
        expected_average_transcript: 2.654333333333333   # one epoch's training sequences
        null_weight: "utils/train_tools.compute_null_weight (official)"
      optimizer: {name: Adam, lr: 1.0e-4, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.0, grad_clip: 10.0}
      schedule: {name: step, decay_at_completed_updates: 11719, factor: 0.1}   # ceil(18750 x 250 / 400); no warm-up
      determinism: "fp32, TF32 off, cuDNN deterministic, torch.use_deterministic_algorithms(True)"
      decoding: "official Block._eval of the last block (mwt from gtea.yaml), with a dummy label sequence; no search"
    ASRF:
      repo: third_party/asrf
      commit: 9623f1e8d9a1171333a4eeb65d190997b6c44a95
      model: {in_channel: 512, n_classes: 5, n_features: 64, n_layers: 10, n_stages: 4, n_stages_asb: 4, n_stages_brb: 4}
      loss: "official CE with median-frequency class weights + Gaussian-similarity TMSE at weight 1 (the official train.py passes gstmse_weight=True; plain TMSE is off) + lambda_b x boundary regression with pos_weight"
      lambda_b: 0.1
      boundary_th: 0.5
      weights: "median-frequency class weights and pos_weight from the seed's epoch-0 batch labels (official rules), stored in the seed's plan"
      optimizer: {name: AdamW, lr: 3.0e-4, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 1.0e-4, grad_clip: 1.0}
      schedule: {name: warmup_cosine, warmup_updates: 750}   # echo_routing.temporal.dev_train.lr_factor
      determinism: "fp32, TF32 off, cuDNN deterministic; torch.use_deterministic_algorithms is unavailable for its CE (nll_loss2d)"
      decoding: "official refinement_with_boundary at boundary_th 0.5; no search"
  init: "one initial state per arm and seed (seed_everything(seed), then build); arms share the seed number and the plan, never weights; no overfit weight is loaded"
  rng: "seed_everything(seed) right before the first update; Python, NumPy, torch CPU and CUDA states saved and restored on resume"
  checkpoint: "the weights after update 18,750; no development-set reading during training, no epoch choice, no extra training after any curve"
  monitor: "the 16 fixed training sequences of the integration stage, decoded after every epoch: frame accuracy, segment F1@50, exact transcripts; a fit diagnostic only"
  smoke:
    seed: 0
    tolerance: 1.0e-6            # reproducibility, resume and padding (the project's smoke tolerance)
    reproducibility_updates: 6
    resume: "3 + 3 updates against 6"
    padding: "labels outside the valid mask changed, shapes and valid samples kept: the loss must not change; FACT also compares the unpadded inputs"
    timing: {warmup_updates: 5, timed_updates: 100, plan: "seed 0, epoch 0"}
    fact_overfit:
      updates: 1000
      batches: "the 16 fixed sequences in two fixed batches of 8, alternating"
      lr: 1.0e-4                 # constant; Adam with the arm's betas, eps, weight decay and clip
      requirements: "every sequence's predicted transcript equals the reference, segment F1@50 is 1 for all 16, and the matching is one-to-one with every matched token predicting its segment's view; the total loss need not approach zero"
    fact_isolation: "the integration stage's check on the GTEA initial and overfit models: five label sequences, the 16 fixed sequences and the first 200 bank streams; identical predictions and logits"
    fact_gradients: "each loss term alone at initialisation; zero-gradient parameters of the official total at initialisation and after the overfit, with their largest gradients"
  budget:
    formal_training_gpu_hours_max: 13
    covers: "the six formal runs (updates, per-epoch monitor and saves); checks and evaluation are recorded separately"
    rule: "the queue starts a run only when the hours spent plus the projected hours of the remaining runs stay within the cap; otherwise it stops with progress saved and reports; no backbone change and no shortened arm"
  evaluation:                    # once, after all six runs completed 18,750 updates and their final weights are frozen
    halves: [selection, calibration]
    units: "native clips, pair streams and multi streams of the protocol"
    systems: ["FACT (3 seeds)", "ASRF (3 seeds)"]
    references:                  # reproduced with their stored settings, never re-tuned; never used to pick a model of this round
      - "E1 + B3 (archived settings)"
      - "E0 + B3 (historical strongest on selection)"
      - "B7 + B3"
      - "E1 + ASRF (historical, seeds 0-2)"
      - "G1 + ASRF (geometry round; calibration three-seed mean 0.9738935784747763, docs/results/2026-10-04_geometry_pretraining/report.json goals/G1 ASRF/calibration)"
    primary: "FACT - ASRF, multi-stream segment F1@50, paired by seed, per half"
    secondary: ["FACT - (E1 + B3)", "FACT - (E0 + B3)", "FACT - (B7 + B3)"]
    bootstrap: {draws: 2000, seed: 20261002}   # native clips by session, streams by stream; reused recordings not modelled
    consistent: "all three seeds' 95% intervals exclude zero strictly on the same side within one half; otherwise no consistent difference is detected, which is not equality"
    mechanism:                   # reported, never a gate
      totals: "segment F1@50, boundary precision and recall, native macro-F1 against ASRF and B3"
      short_segments: "recall of multi-stream reference segments of at most 16 samples and of X->Y->X middles; A4C/A5C separately; misses split into wrong view and no matching segment; distinct source recordings and sessions"
      false_cuts: "native internal label switches per clip and cuts at same-view joins; native labels are clip-level labels"
      a4c_a5c: "A5C read as A4C and A4C read as A5C, fixed and new, deduplicated to recordings and sessions"
      readouts: "FACT's frame-branch argmax beside its official output (a readout of the trained system, not an ablation)"
      tokens: "non-null tokens against the reference segment count; outputs where one token covers separate intervals"
  constraints:
    boundary_recall_min: 0.95
    native_macro_f1_min: {selection: 0.973, calibration: 0.980}
    rule: "every seed and half of FACT; a failure is reported with its values and never repaired by another epoch or decoding setting"
  goal:
    selection_min: 0.944409687184662
    calibration_min: 0.9821421709894332
    calibration_sensitivity: 0.9838935784747763   # 0.9738935784747763 + 0.01, reported beside the goal
  decision:
    - {observation: "FACT - ASRF is not consistent positive in both halves", action: "the comparison of this GTEA configuration ends; each half is reported as positive, negative or uncertain; segment-token methods in general are not rejected and Breakfast is not run automatically"}
    - {observation: "consistent positive against ASRF in both halves, but not consistent positive against E1 + B3 in both halves", action: "the gain over ASRF is reported; the goal is not met"}
    - {observation: "both comparisons hold, but a constraint fails", action: "the gains and their costs are reported; no other epoch or decoding setting repairs it"}
    - {observation: "comparisons and constraints hold, but the final goal is not met", action: "local progress is reported; any further study is decided separately"}
    - {observation: "comparisons, constraints and the final goal are met", action: "only the development-protocol goal is claimed, with the sensitivity target beside it; test is not opened"}
  outputs:
    results_dir: docs/results/2026-10-08_fact_asrf_training   # counts and digests only
    server_dir: runs/fact_asrf_paired_v1                       # plans, initial states, run manifests, predictions
  never: "no development-set reading during training; no threshold, decoding or epoch search; no encoder fine-tuning; no module of our own; no test split; no EchoNet-Pediatric"
