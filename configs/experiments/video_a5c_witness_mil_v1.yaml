# A43 (video_a5c_witness_mil_v1), 2026-10-28 UTC: a binary A5C witness specialist trained end to end from A08's final
# local tokens under native-recording supervision, deployed only as a one-way correction of original Base-A4C runs.
# M (existential multiple-instance positive) against D (dense positive windows); everything else is identical.
# Committed before any bag, plan, pixel, loss or model computation (only Codex's metadata-only feasibility ran, outside
# this ledger). Task sheet: claude_prompts/2026-10-27-a5c-witness-mil-training.md
# (sha256 95f103d3eb8bd20c735ed7ec4132e684a4b5790f1d4401aef3373caeb2abab93).
# Question: can a separately trained visual A5C witness specialist repair Base's A4C predictions without sacrificing its
# existing A5C labels, and does existential bag supervision outperform forcing every window of an A5C recording positive?
# An A5C-coded bag containing a usable witness is a hypothesis, not an expert annotation; an A4C code does not certify
# LVOT absence; attention is not anatomical ground truth. Clip codes are weak reference labels. No development / check /
# test / Pediatric reading; source seed 2 only by the rule below.
experiment: video_a5c_witness_mil_v1

a5c_witness_mil:
  id: A43
  type: matched_training_comparison
  predecessors: "A42 (docs/results/2026-10-27_session_matched_discrimination: same-session vs rewired margin ranking in a full A08 continuation; S fixed 4 / 103 S1 vs C 3, both broke 56 correct runs incl. 45 A5C; the pair term was nearly satisfied from update 0; closed, coefficient / pair rule not scanned here), A31 (docs/results/2026-10-24_session_correction: error emphasis / last-block changes mainly moved the A4C / A5C boundary; source of the two session folds), A40 (docs/results/2026-10-27_masked_feature_recognition: masked HOG auxiliary in full A08 continuation; closed), A41 (docs/results/2026-10-27_echojepa_recognition: new pretrained representation; closed), A34 (docs/results/2026-10-25_native_bag_evidence: whole-native bags with mean / power means, but a copied five-class linear head on frozen global A08 embeddings relabelling every Base class; closed; A43 is not the first MIL experiment), R07 (docs/results/2026-10-04_local_readout: learned spatial / temporal attention on frozen E1 tokens; closed), A39 (docs/results/2026-10-26_local_token_a5c_evidence: fixed mean / max of frozen A08 non-CLS descriptors; closed), V02 (docs/results/2026-10-11_target_patch_readout: patch readouts trained end to end; closed). Attention, patches and encoder unfreezing are not individually new here"
  changed_condition: "the task becomes binary A5C witness learning; a gated-attention readout of the 49 marker-time final tokens and the whole A08 trunk are trained end to end under native-recording supervision; the specialist acts only on original Base-A4C runs (one way). M vs D isolates existential vs dense positive supervision with the same architecture, images, negative supervision and deployment. Common gains vs Base belong to the package (specialist + one-way rule), not automatically to MIL or local anatomy"
  references: "motivation / method only, not reproduced results or a novelty claim: Ilse et al. ICML 2018 (https://proceedings.mlr.press/v80/ilse18a.html, gated attention MIL); Durand et al. CVPR 2017 WILDCAT (weak localisation background)"
  data:
    pools: "A31 fold pools runs/video_session_correction_v1/pool_{0,1}.npy (sha256 96d1fb683e1a261d5be9a3cc7ec393637577bbf83b56140cec41f544c4f3b486 / 08255192dae3a90644ea062880bf6b2b298181ed12e9890d56ca04630f5adef4); split.json e03100941d77e1fe64a825e4f2a4f7ef038a5725bcf943a55db15a983ef29d6d (sessions / recordings / window identities shared 0); all re-verified. No resplit, no new stream"
    requests: "A31's pool_W: stride-5 centres c of each complete sequence, samples S = window_frames(c, N, 16, 16) (16 samples, 10 Hz), marker = marker_slot(S, c), A08 pixels / 224 crop / original gamma / normalisation; the nearest-centre sample map. Unchanged for training and readout"
    bags: "native-only, per fit pool f: every native sequence (kind native, one recording) whose single clip code is A4C (2) or A5C (3), two lists in pool order; a bag is ALL its pool_W rows in pool order (no temporal crop, window cap or positive subsampling). Window weight v_j = (samples whose nearest centre is window j) / (recording samples); sum 1. Asserted before any pixel: A4C / A5C = 200 / 67 (pool 0) and 200 / 75 (pool 1); windows per bag mean A4C / A5C 11.59 / 10.09 (f0), 12.00 / 12.37 (f1), maxima 102 / 100 (f0), 72 / 58 (f1) (Codex metadata feasibility). A mismatch is an engineering stop. Built from kinds, recording ids, clip codes and the window grid only"
    class_weights: "pi_c = n_native_c / (n4 + n5) of the fit fold: f0 200 / 267 and 67 / 267, f1 200 / 275 and 75 / 275; corrects equal-class drawing to the native class proportions; not a tuned coefficient"
    base_outputs: "A31 outputs_s{s}_f{f}.npz (q): s0 5884435770e8b65959b22ff77f74b0c2053cadf7fd2a5a28c842104df2f1a512 / 0a99be35b0cd78d650f5014c8ddc783173e6fb849ee556d6fa2a52c73f33d360; s2 5e8042a75e7c38d2f8345c3c3bbf357039efeed530f8758a1a7c7838fe5507fb / 2b1f1e13dce2a769f4091745e531bb998bc122b58cd5f3c09d2c364d904f4a33"
    base_runs: "A31 data/runs_s{s}_f{f}.npz (P runs, base_labels): s0 7b28ac6c224f594ef7bf49d6307186807d91bd8577dbc192e8cece07bea7452c / 98ce5c572aa29576a098685c1d28220684e755cbea537b6739020c0387ddc026; s2 91d04d4f255b7e892343b102c736f1b69c8126a69f2e0df1f5c23f1c60d8860f / ef76e587a0db2c7b18dcbdaee5631497963ad8eb9988a929e4526d5949259ef9"
    a08: "models_frozen/video_within_view_v1/all_s0/final.pt 9b144925f32fac7d725d13231a132abeb6635fa44b6fe0dbcec7f5b59d035bbc; all_s2 f95fed7ba78cc0b5e2474c71a156356507b4588a4b324957fd5b53fe66ee8472 only if the rule triggers. The original frozen A08 + B3 keeps producing Base and its runs, unchanged"
    fit_only: "fit fold f reads only pool f for training, checks and fit monitoring; held-out pool 1 - f is read once, by the frozen specialists' readout, and only at the eligible rows. Sessions are not verified patients; A08 already trained on these source recordings, so they are held-out sessions only for the new specialist"
    not_read: "development / check / test / EchoNet-Pediatric; the A26 runner; constructed streams or Base outputs for training; outside media; Unity training; expert or pseudo labels; S1 / harm / mistake / session-matching sets for any training exposure"
  specialist:
    copy: "per source seed s and fit fold f: A08 all_s{s} (TargetMViT) copied bit-identically; the full original marker forward (marker_stem added to conv_proj output by TargetMViT.embed) runs unchanged"
    tokens: "encoder.norm output captured with autograd by a hook (echo_routing.temporal.masked_feature.embed_with_tokens_grad: one capture, removed in finally even on error): CLS + 392 tokens; non-CLS reshaped (B, 8, 7, 7, 768) time-major, y, x; the 49 spatial tokens at temporal index t = marker_slot // 2 (nearest of token centres 0, 2, ..., 14, ties to the earlier), checked against an independent nearest-time loop. Receptive fields include global context; these are not isolated frame pixels"
    head: "gated attention, common to both arms: a = softmax_i(w_a^T [tanh(V h_i + b_v) * sigmoid(U h_i + b_u)]) over the 49 tokens; V, U Linear(768, 128) with bias; w_a Linear(128, 1) without bias; e = sum_i a_i h_i; score s = w_c^T e + b_c, Linear(768, 1). 197,761 parameters"
    init: "torch.manual_seed(2026102743 + 10 s + f) immediately after the A08 copy is built, then V, U, w_a, scorer constructed in that order with PyTorch defaults (same in both arms); scorer weight exactly 0, bias exactly -2, so every initial score is -2 for any input and the initial deployment is exactly a no-op. A zero trunk / marker / attention gradient on update 0 is expected; genuine gradients from update 1 are checked"
    trained: "encoder trunk (every m.encoder parameter except encoder.head: conv_proj, pos_encoding, 16 blocks, norm), marker_stem.weight, attention + scorer, from update 0 (no frozen warm-up)"
    frozen: "encoder.head (Dropout + Linear(768, 512) projection; its output is computed by the original forward and unused) and the original five-class classifier: requires_grad False, not in the optimiser, not called trained. Actual optimiser coverage and structurally zero-gradient tensors are enumerated by the checks"
    excluded: "no CLS concatenation, KL, replay CE, HOG, contrast / rank term, new pretrained checkpoint, augmentation or other auxiliary loss"
  arms:
    D: "dense positive windows: A5C loss = sum_j v_j softplus(-s_j)"
    M: "multiple-instance positive witness: A5C loss = softplus(-amax_j s_j) (torch.amax splits the gradient equally among exact maximum ties; the reference matches). The positive whole-recording label requires at least one witness; other A5C windows are not forced positive"
    common: "A4C loss = sum_j v_j softplus(s_j) in both arms; total = pi4 * A4C loss + pi5 * A5C loss; torch softplus (beta 1, threshold 20). Same A08 copy, head init, plan, images, weights, negative loss, optimiser, schedule, model RNG, eval mode and computation; only the positive term differs"
  plan:
    draw: "per update u: rng = numpy default_rng([20261027, 43, s, f, u]); A4C index = rng.integers(n_A4C) then A5C index = rng.integers(n_A5C) into the pool-order lists. One native A4C bag then one native A5C bag, full bags, in that order. No mistake / S1 / harm / session-matching selection. 600 draws and exposure totals precomputed before any pixel; the same plan for both arms"
  optimisation:
    updates: 600
    order: "source seed first: D_f0, M_f0, D_f1, M_f1. Final weights after update 600; no epoch / checkpoint selection, no retuning"
    optimizer: "AdamW betas (0.9, 0.999), eps 1e-8, weight decay 1e-4 in every group. Groups: 'encoder_trunk' lr 1e-5; 'marker_stem' (marker_stem.weight) lr 1e-4; 'witness' (V, U, w_a, scorer) lr 1e-3"
    schedule: "linear warm-up over 60 updates, then cosine to update 600 (echo_routing.temporal.dev_train.lr_factor via A31 sched)"
    clip: "global gradient norm 1.0 over the trainable parameters, once per update"
    mode: "eval mode throughout (dropout / stochastic depth off; LayerNorm only); gradients on (eval is not no_grad)"
    two_pass: "exact scalar-logit chain rule, microbatch 1, both arms. Pass 1: every window of both bags forwarded without a graph, all scalar scores collected; the bag objective formed on a differentiable leaf score vector gives dL/ds_j for every window. Pass 2: EVERY window recomputed with autograd and s_j.backward(dL/ds_j), zero-gradient windows of M included; parameter gradients accumulate; one clip and one optimiser step for the two bags. Both arms run the same two forwards and one backward per window. No detached feature-head substitute, no whole-training no_grad"
    model_rng: "torch.manual_seed(2026102743 + 10 s + f) before the head is constructed (CPU), same in both arms (eval disables stochastic layers)"
    numerics: "FP32; TF32 off; cudnn deterministic, benchmark False; torch.use_deterministic_algorithms(True, warn_only=False); A42's validated GatherMaxPool3d (echo_routing.temporal.session_pairs.deterministic_skip_pools) on training copies only (identical forward values and argmax routing, deterministic gather backward, no parameters); the readout uses the original nn.MaxPool3d modules (no backward). No precision, bag-size or update-count fallback"
    memory: "temporary RAM for the current updates' decoded frames only (DataLoader prefetch); no persistent pixel / prefix / token cache on disk"
    resume: "at most one active resume file (model, head, optimiser, CPU / CUDA RNG, update, log), overwritten every 150 updates and deleted after the final weights are verified; exact update / RNG / optimiser resume"
    monitoring: "fit only, never used to select or retune: per update (from pass 1) A4C loss, both A5C loss forms (dense and max), duration-weighted and plain positive-window fractions, bag maxima and the witness margin max(s_A5C) - max(s_A4C), pi-weighted score-gradient sums of each bag, pre-clip gradient norms of trunk / marker / attention / scorer; at updates 0, 150, 300, 450 and 600 on fixed fit monitoring bags (the first 8 A4C and first 8 A5C bags in pool order, all windows): both loss forms, positive fractions, bag maxima and bag-level r > 0 rates"
  deployment:
    rule: "original Base (frozen A08 + B3) cached P runs and request map. Eligible runs are ONLY those whose original Base label is A4C (2). For each, its unique original request rows (the rows of its nearest-centre multiplicity map; repeated copies of a window add no evidence) are scored by the frozen specialist and r = max score; r > 0 changes the run to A5C (3), otherwise it stays A4C. Every other Base run label is copied exactly. Equal neighbours merge by RLE; complete sequences scored with the original evaluator. No threshold selection, temperature, alternative readout, confidence mix, reference-label / source / session input or held-out adaptation"
    eligible: "asserted from the cached P runs before any held-out pixel, source 0: eligible Base-A4C runs 749 (held-out pool 0) / 771 (pool 1); unique needed request rows 5,030 / 5,437 (full grids 24,585 / 25,774). Only these rows are forwarded, once per arm, after the freeze"
    invariant: "Init (every score -2) reproduces Base exactly. Every originally non-A4C P-run label, including correct A5C, is protected BY THE DECISION RULE, not by learned retention; this is not an empirical finding. Relabel + merge can still erase real boundaries or damage A5C segments, and correct A4C can be wrongly promoted"
    private_cache: "scalar scores of the needed rows (row identity map), per-run r and labels, saved on the server with sha256 for Codex's independent recount; never exported"
  checks: "(1) bags: counts, whole-window membership, single-recording natives, duration weights (independent loop), means / maxima vs feasibility, grid = A07 windows; 600 plans per fold, repeat, plan sha, exposure totals, no cross-fold session / recording / window sharing; original markers and pixel path (A31 chunk_frames). (2) Init: A08 copy bitwise, head digest identical across arms, 197,761 head parameters, every first-pass score -2, online fit logits of the copy = A31 cache within 1e-4 (no held-out pixel), patched = original forward bitwise. (3) local tokens: shape, network grid 8 x 7 x 7, selection = explicit loop, t = marker // 2 = independent nearest-time loop, hook removed after a forward and after an error, the copy's logits unchanged by the hook. (4) attention: float64 reference of a, e and s, token permutation invariance, finite gradients. (5) loss: independent float64 BCE / amax values and score gradients with variable bag sizes, unequal weights, exact max ties, margins +/- 1e3; one-instance M = D. (6) two-pass production FP32 gradient vs a retained-graph reference on bounded short fit bags (check-only nonzero scorer weight so the trunk receives gradient), relative max <= 1e-5 for D and M; pass-1 vs replayed scores; patched vs original max-pool backward (warn_only True only there) <= 1e-5; batched vs microbatch FP32 recorded as diagnostic only, never a gate. (7) strict 6-update repeat (D), forced M-with-dense-positive vs D, 3 + 3 resume vs 6 (M): loss <= 1e-4, parameters <= 1e-5; M differs from D. (8) update 0: trunk / marker / attention gradient exactly 0, scorer nonzero; updates 1-5: all four nonzero and finite; real movement of every trained group; optimiser binding exact; unchanged and zero-gradient tensors listed. (9) synthetic one-way edit / merge invariants; eligible counts; Init = Base on all cached P runs and complete sequences; cached Base rows = A32 / A42 references; readout decision independent of reference labels; A08 files unchanged. (10) measured two-pass seconds per window on a short and the longest planned update, wall incl. loader, peak memory, disk, conservative projection. Checks never read a held-out model output"
  limits:
    loss: 1.0e-4
    params: 1.0e-5
    grad_rel: 1.0e-5
    formula: 1.0e-8
    attention_fp64: 1.0e-10
    replay_abs: 1.0e-5
    online_parity: 1.0e-4
    peak_gpu_gb: 40.0
  amendment_after_check_attempt_1: "2026-10-28, before any training (code 845f38a). Check attempt 1 (checks_attempt1.json, kept) failed only the real_update gate; every other gate passed (two-pass vs retained graph 1.6e-7 / 1.6e-7, replay 0, skip pool 7.5e-10, repeat / forced dense / 3 + 3 resume 0 / 0, projection 3.14 GPU h). After 6 updates 380 / 395 trunk tensors, the marker stem and every head tensor moved; 15 trunk tensors stayed bitwise unchanged, all blocks.*.attn.pool_k.norm_act.0.bias (block 4's moved). A key LayerNorm bias adds one vector to every key, so each query's logits shift by a constant and softmax is invariant: the exact gradient is 0, only round-off (nonzero, hence not in the exact-zero list) reaches it, and Adam's eps keeps the step below FP32 resolution. The gate wrongly admitted only frozen or exactly-zero-gradient tensors as unchanged. Check-only repair: per-tensor max |grad| over updates 1-5 is recorded; an unchanged trainable tensor passes only with this structural reason and max |grad| <= 1e-6 x the trunk maximum. The training path, every other gate and every limit are unchanged"
  freeze: "all four source-seed model / head / base / code / config / input / plan sha256 manifests committed and the git objects checked BEFORE the one opposite-fold readout (fit f -> held-out 1 - f); no outcome is computed before the freeze"
  readouts: "per held-out fold and OOF for Base / D / M over all P runs at true prevalence: fixed / broken / net and both A4C / A5C directions; S1 (true A5C read as A4C) fixed, attributed only to true-A5C source recordings inside the corrected run; correct A4C kept / damaged; the structural non-A4C invariant; runs changed by true class; complete multi segment F1@50, native macro-F1, boundary P / R and boundaries deleted by merge, FP / short FP, FN / missed short true; M - D, D - Base, M - Base; eligible-run score aggregates; fit-only monitors; cost. Attention is not LVOT evidence"
  gates:
    absolute: "per arm, source 0 denominators S1 = 103, correct A4C = 1,413, correct A5C = 1,150 (source 2 uses its own). An arm passes ONLY if ALL: (1) S1 fixed >= ceil(10%) (11 / 103) from >= 3 distinct true-A5C recordings total, and >= 1 fixed run and >= 1 source recording in EACH held-out fold; (2) every non-A4C original run label unchanged (hard invariant), correct A4C kept >= ceil(99%) (1,399 / 1,413), net fixed >= 0 in each fold and OOF >= +5; (3) complete multi segment F1 not below Base in either fold and two-fold mean delta >= +0.001, native macro-F1 delta >= -0.003 and boundary recall delta >= -0.005 in each fold, missed short true OOF <= Base + 3"
    mil_signal: "separately predeclared: M - D S1 fixes >= +1 in each fold and >= +5 OOF, M net >= D net and M segment F1 >= D segment F1 in each fold, and M correct A4C kept >= D - 3. Passing an absolute gate without this difference supports the shared package only, not a MIL advantage"
    action: "if EITHER arm passes the absolute gate and the remaining shared budget permits, repeat BOTH arms at source 2 under the identical recipe (s = 2 in every RNG key, A08 all_s2, its own q / P runs / denominators, 600 updates, four-model freeze, one readout). No winner-only threshold or variant selection. If neither passes, close at source 0. No full fit, development / check / test / Pediatric evaluation or A44 even if successful"
  scope: "a result covers only this gated-attention marker-time witness specialist with full-trunk 600-update training under these native bags, D or M positive supervision and this one-way Base-A4C rule; not passing is not equivalence, does not show that MIL or local anatomy cannot help, and attention does not show LVOT"
  reuse: "A42 GatherMaxPool3d / build / binding / resume / freeze layout (scripts/train_session_matched_discrimination.py, echo_routing/temporal/session_pairs.py), A40 embed_with_tokens_grad / token grid / init_base / full_q (echo_routing/temporal/masked_feature.py, scripts/train_masked_feature.py), A31 loaders / pool_W / outputs / opt_of / sched, A32 fold data / masks / id guard, A36 tables / staged / publish, A37 chunk_frames / coverage, A38 loaded_code, A39 a5c_extras; read only"
  budget:
    gpu_hours_max: 6.0
    cpu_hours_max: 3.0
    new_disk_gb_max: 3.0
    min_free_disk_gb: 15
    launch_gate: "before formal training: spent + the full four-model schedule (planned windows x measured two-pass seconds per window, plus per-update overhead, x 1.15) + the eligible-row readout at the measured rate + 0.4 GPU h reserve <= 6.0; re-projected before source 2 (whole-round shared cap including source 2). Otherwise engineering_stop; no schedule / bag / precision change"
    accounting: "GPU = job wall time including decode / wait inside the job and failures; CPU = active agent wall clock (idle polls excluded) plus server CPU jobs; a GPU job's loader is not charged again as CPU; actual closing timestamps only, never future reservations; Codex feasibility / reviews disclosed outside this ledger; older ledgers read only"
    storage: "no pixel / prefix / token cache; final weights, small logs and the private readout cache only; at most one active resume; only this round's regenerable intermediates may be deleted, after the finals are verified"
    ledger: runs/video_a5c_witness_mil_v1/ledger.jsonl
  outputs:
    root: runs/video_a5c_witness_mil_v1
    results_dir: docs/results/2026-10-27_a5c_witness_mil
    coordination: runs/video_a5c_witness_mil_v1/coordination.json
