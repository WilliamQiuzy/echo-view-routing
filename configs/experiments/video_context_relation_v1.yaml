# A24, teacher-referenced neighbour relation on top of the A23 context interventions (video_context_relation_v1),
# 2026-10-22 UTC. One-page task and configuration, written before any A24 preparation, check, training or evaluation output.
# Question: while keeping the local recognition that A23's context interventions bought, does a training term on the
# relation between neighbouring predictions -- the student's change between consecutive original windows should follow
# the frozen own A08's change there -- stop stable segments from being cut by scattered errors and raise full
# segmentation? The term allows every switch that A08 itself makes and penalises only changes A08 does not make.
# Predecessors: A23 (36dabaa; Other - Same negative in all six cells; window gains with pure-segment flips); A22 (the same
# pattern with short support); A08 (MS-TCN's truncated squared log-probability penalty towards zero change, all or
# label-masked neighbours, closed with post-A08's R2 reading: the penalty dominated gradients); A05/A07 (transcript /
# segment-balanced objectives, closed). Differences: the target change is the frozen A08's own change, not zero; no labels,
# mask, truncation or log-probability; probabilities; only the originals' truly consecutive windows; on A23's fixed
# intervention batches. Not a per-window KL restatement: a constant offset from the teacher costs nothing, only changes in
# the residual between neighbours do. A conventional consistency term; no algorithmic contribution is claimed.
# The check pool is not a new holdout; development halves are reused exploratory feedback; test and Pediatric not read.
experiment: video_context_relation_v1

video_context_relation:
  pinned:
