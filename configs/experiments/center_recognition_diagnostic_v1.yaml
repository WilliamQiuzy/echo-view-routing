# Where did native recognition regress in the N/S/C round? (docs/superpowers/plans/2026-10-06-recognition-regression-
# localisation.md). Inference with existing models only: no training, no threshold tuning, no label change, no test
# split, no EchoNet-Pediatric. Fixed and committed before any new metric. Inherits the center-supervision config for
# the model definition, the windows and the validation inputs; nothing of that round is changed.
extends: ev9v_center_supervision_v1.yaml
run_name: center_recognition_diagnostic_v1
experiment: center_recognition_diagnostic_v1

recognition_diagnostic:
  inputs:
    center_supervision_config: {path: configs/experiments/ev9v_center_supervision_v1.yaml,
                                sha256: 3048b6a024f6362d75522e80ac31276a0124c0000616a4f1e8fd4c84d4d6669b}
    status: {path: runs/center_supervision_v1/status.json,
             sha256: 4a65c30b315b1d2d42c558f181c4bc1d6a5b08827fb31ae928f5c1767e397a71}
    manifest_index: {path: runs/center_supervision_v1/manifests/index.json,
                     sha256: 8e2148b46d5cf028943f7000cffdfe114f31ed9320a5f6f14343359bfc1227a1}
    previous_report: {path: docs/results/2026-10-05_center_supervision_training/report.json,
                      sha256: 09998dcefaa6d4b124bee11dfe89c02ac303406e6b9cad31969022d1aa800b13}
    e1_b3_selected: {path: runs/20261002-144641-md_simple_decoders-38bbcf7c-s0/selected.json,
                     sha256: e7ef6d01bb912b711905e50e566396e00adffd6f5662531bb24fd2d0add25c2b}
    e1_b3_params: {half_window: 9, threshold: 0.22457831805925244, nms_radius: 5}   # selected.b3.main, numeric JS threshold
    e1_cache: {key: 16efc85be645, prob_dtype: float32}   # the frozen E1 probe's per-sample probabilities (F paths)
    final_checkpoints:           # status.json final_sha256 of the nine models; nothing new is trained or frozen
      N_s0: 377939a1be6f694ced96f05f97c23845726c7872db1ce54f42bef00efcd65384
      S_s0: e600c61c7af0817fee98a2b2c874155021429fc9e9e2777ea0f5adf807c23e0b
      C_s0: 05fa4ff74dd540310881c4d37e188ee04ec929ff7bab48b7b64dcd2d419745a2
      N_s1: b3431c8a9195c56e4aa3b4abb00fd60e498ddb14fa47430f33b9f64c289f47a4
      S_s1: 0d68587a0b48f9c7d41b82ae1b56a348e6fbfbdda37e16c07719ddb51060f457
      C_s1: 5c48f173b482fd37b3e3f8444ff2df2ce2edbdc6f0d3a7bc49b467ce9fc09d07
      N_s2: a80e8a80e6e658628ad9e6125c0b3a7f42c9389e48ce269460f5b8b5ee9c133c
      S_s2: 69bff66a2f005b491f5296e55b96a60b3c4b7d34c47acb5d0e55c863451a409a
      C_s2: 370b7861c3655bc589e233b6d30eb236879a55fb53246e13f1e8d47d97e592f7
  paths:                         # all five are reported; none is chosen after seeing results
    F-dense: "frozen E1 probe probabilities from the E1 cache, every 10 Hz sample of the sequence (as the original evaluation)"
    F-grid: "F-dense read only at the window target samples c (window_centres, stride 5), filled back by nearest_centre"
    J-dense: "softmax of the same checkpoint's auxiliary frame head on that checkpoint's encoder features, every sample"
    J-grid: "J-dense read only at the same c and filled back by the same rule"
    T-window: "the checkpoint's temporal Transformer and window head on B7's 16-frame windows, offsets s - c, stride 5, filled back by nearest_centre (the previous round's argmax row)"
  never: "the old probe on a new encoder, retrained heads, temperature or normalisation changes"
  main_rows: argmax              # per-sample argmax; a native clip's label is the majority of its samples (bincount, ties to the lower class)
  target_sample_error: "at every window target sample c of every validation sequence; each centre recording weighted once; also split into single-recording and mixed-view windows (echo_routing.evaluate.window_target.category)"
  comparisons:                   # per model and half; F once
    grid_effect: ["F-grid - F-dense", "J-grid - J-dense"]
    frame_path_change: ["J-grid - F-grid", "J-dense - F-dense"]
    temporal_readout: ["T-window - J-grid"]
  eight_cells: "C models: native clips by (F-grid right, J-grid right, T-window right); the eight cells must add up to the clip count; F-dense against F-grid listed separately"
  bootstrap: {draws: 2000, seed: 20261002, unit: "session of the native clip (the native part of the existing paired bootstrap)"}
  supplementary: "all five paths decoded with the one archived E1 + B3 setting (numeric threshold, no new quantiles or selection); the previous round's tuned T-window B3 rows kept as history; a diagnostic, not a fair ranking; no interval for constructed streams"
  checks:
    t_window_reproduction: "argmax metrics and segment counts equal the previous report's argmax rows for all nine models (no per-sequence archive exists; the summary rows are compared, tolerance 1e-12)"
    e1_b3_reproduction: "F-dense decoded with e1_b3_params equals the archived E1 + B3 metrics and segment counts (tolerance 1e-12); any label-changing difference stops the run"
  outputs:
    committed: "README.md and report_tables.md (aggregate counts only)"
    server_only: "runs/center_recognition_diagnostic_v1: per-recording ids, per-sample predictions and the full JSON"
