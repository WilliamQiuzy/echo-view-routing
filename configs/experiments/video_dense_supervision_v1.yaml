        1: {path: runs/video_feature_temporal_v1/features/development/ordered_s1.npz, sha256: a3309e3c06fdb77b3267b3642b513ccb8fef734635ade16f8bd42ba674d7e5ab}
        2: {path: runs/video_feature_temporal_v1/features/development/ordered_s2.npz, sha256: 2a6fa58d85d45ca7f11ef302afd1cc3f869a5830bbb342dd6f0be541919c2200}
    environment: {torch: 2.14.0+cu130, torchvision: 0.29.0+cu130, cuda: "13.0", cudnn: 92400,
                  torchvision_mvit_sha256: 76ca465f2be0bb7ff914ca434264ceb6736402856d164e5810491d5ba77d4210}
  arms: [center_only, aligned_dense, shuffled_dense]
  names: {center_only: CLS continuation, aligned_dense: Aligned token supervision, shuffled_dense: Shuffled token supervision}
  primary: aligned_dense
  model:
    forward: >-
      every arm calls the full original TargetMViT.forward(rgb, marker) once; a forward hook on encoder.norm, registered
      for that call only and removed in finally, stores a clone of the norm output X (B, 1 + 8 x 7 x 7, 768) with autograd
      and returns nothing, so token 0, the CLS path and the CLS logits are unchanged; the hook must fire exactly once
    time_logits: "P = X[:, 1:].reshape(B, 8, 7, 7, 768).mean over (7, 7); z_time = classifier(encoder.head(P)) (B, 8, 5): the shared dropout, 768->512 projection and five-class head, computed after the CLS logits in every arm"
    grid: "the final token grid read from the network must be (8, 7, 7) with every block's query time stride 1; anything else stops the round"
    stem_time: [3, 2, 1, 1]      # kernel, stride, padding, dilation of conv_proj in time; anything else stops the round
    anchors: [0, 2, 4, 6, 8, 10, 12, 14]   # j * stride - padding + (kernel - 1) * dilation / 2: input slot anchors, not receptive fields
    parameters: "none added; no aux head, temporal head, boundary loss, gate, residual, teacher or decoder"
    inference: "CLS logits only (the original TargetMViT.forward); the time logits serve the training loss and pre-specified diagnostics"
  aux:
    labels: "the per-slot labels of the seed's SC manifest at the 8 anchor slots of each window (input slot order = time order)"
    lambda: {center_only: 0.0, aligned_dense: 0.5, shuffled_dense: 0.5}
    center_only_labels: "the aligned labels at weight 0 (the time logits and their loss are still computed)"
    shuffled: "per window, numpy default_rng([20261013, seed, update_index, window_index]).permutation(8) applied once to the 8 aligned labels (new label j = aligned label perm[j]); identity or same-class permutations are kept; no resampling; pixels, targets and the global torch RNG are untouched"
    loss: "L_center = CE(z_cls, target) batch mean; L_time = mean over windows of the mean over the 8 anchors of CE(z_time, aux); loss = (L_center + lambda * L_time) / (1 + lambda)"
    repeats: "clamped or repeated slots stay as in the manifest and count among the 8 anchors; their share is reported, not counted as independent cases"
    files: "runs/video_dense_supervision_v1/manifests/AUX_s{seed}.npz (aligned labels, permutations, shuffled labels) and index.json with digests and counts; the repository records counts and digests only"
  data:
    windows: "V01's frozen RV manifest rows: 3,750 updates of 4 native and 4 mixed-view windows, 16 frames in Ordered order, the same frames, gammas, markers, targets, pixel digests and batches for the three arms of a seed"
    pairing: "for every window, the SC and RV references (vid, frame, gamma, s per slot; c, target, kind, seq, repeats per window; the video list) are identical, the RV marker is the middle target slot of the SC window, RV's Ordered order is the identity, and the SC labels at the target slots equal the target; any difference stops the preparation"
    allowlist: "protocol['train']['clips']; every recording of the RV and SC manifests must be in it, otherwise the preparation stops"
    isolation: "preparation and training read no development frames, features or labels and no test or Pediatric data; training indexes are filtered by the allowlist before any label is read"
  training:
    start: "every run strictly loads its seed's V01 Ordered final weights (encoder with the 512-d projection, marker stem, five-class head); nothing is reinitialised; a new optimiser and update count start at 0"
    seeds: [0, 1, 2]
    total_updates: 3750
    batch_windows: 8
    optimiser: {name: AdamW, lr_encoder: 1.0e-5, lr_new: 1.0e-4, weight_decay: 1.0e-4, grad_clip: 1.0, betas: [0.9, 0.999], eps: 1.0e-8}
    param_groups: "group 0 = every encoder parameter including the 512-d projection; group 1 = marker stem and five-class head; no extra group"
    warmup_updates: 375
    schedule: "new parameters 1e-4 x lr_factor(u, 375, 3750); encoder 0 for u < 375, then 1e-5 x the same factor"
    freeze: "for u < 375 every encoder parameter has requires_grad False and lr 0, with autograd through the encoder to the marker; afterwards everything trains"
    model_rng: "torch.manual_seed(seed) and torch.cuda.manual_seed_all(seed) before the first update; all arms compute the time logits in the same order; the data order is the manifest's"
    checkpoint: "final weights after 3,750 updates; no development data during training; no epoch, lr, weight or seed choice"
    resume: "full model, optimiser, update count and CPU and CUDA RNG after every epoch; every run records whether it was interrupted"
  determinism: {precision: fp32, tf32: false, cudnn_deterministic: true, cudnn_benchmark: false, stochastic_depth_and_dropout: "kept as in the source",
                deterministic_algorithms: "torch.use_deterministic_algorithms(True, warn_only=True) with CUBLAS_WORKSPACE_CONFIG=:4096:8; V01's recorded MViT max-pool CUDA backward nondeterminism applies"}
  identity: >-
    SHA256 over this config's training sections (including the budget) and the source round's training sections, the arm,
    the seed, the source weights, the RV manifest and its epoch digests, the AUX file, the environment, the total updates,
    and the dense module, the model and token-grid modules, the preparation, training and V01 training scripts in full
    plus the shared frame, path and schedule helpers
  checks:
    windows: "16 training windows of the seed-0 manifest by manifest order and coverage (V01's rule)"
    cls_parity_max_abs: 0.0          # every arm's CLS logits against the source TargetMViT, eval, same input
    time_recompute_max_abs: 1.0e-5   # the time logits recomputed by hand from the source model's norm output, eval
    arm_pairing: "train mode, same state and RNG: the three arms' CLS and time logits before the loss and the torch RNG states after the step are identical; on native windows the aligned and shuffled losses and gradients are identical"
    smoke: {updates: 100, lr_new: 1.0e-4, encoder: frozen, batches: "windows 0-7 and 8-15 alternately", gate: "finite values, updated marker and head, unchanged encoder; no score gate"}
    reproducibility: {updates: 6, loss_abs: 1.0e-4, params_abs: 1.0e-5}
    resume: {loss_abs: 1.0e-4, params_abs: 1.0e-5}
    boundary: {warmup: 3, total: 8, resume_at: 2, adam_step_bound: 2.1,
               rule: "V01's recorded rule: exact state round-trip, losses within 1e-4, parameter drift within adam_step_bound x each group's summed learning rate; tolerances are not raised from observed values"}
    timing: {warmup_updates: 5, timed_updates: 20, state: "encoder unfrozen, batch 8 from the formal manifest, decoding, time logits and hooks included"}
  budget:
    gpu_hours_max: 8.0               # failed and passed checks, nine trainings, development inference, report and fact-check; one ledger
    evaluation_allowance_hours: 2.0
    ledger: runs/video_dense_supervision_v1/ledger.jsonl
    rule: "the check and the queue project spent + remaining runs x the larger of the checked and the slowest finished run + the evaluation allowance; above the cap nothing new starts and the state is reported; no arm is dropped or shortened"
  queue: [center_only_s0, aligned_dense_s0, shuffled_dense_s0, center_only_s1, aligned_dense_s1, shuffled_dense_s1, center_only_s2, aligned_dense_s2, shuffled_dense_s2]
  evaluation:
    after: "all nine runs complete and frozen; only then are development frames loaded"
    windows: "V01's: window_centres(n, 5), window_frames(c, n, 16, 16), the marker at the middle target slot, Ordered order; every 10 Hz sample takes the nearest centre's output; native clips are scored by the per-sample majority"
    system_output: "CLS probabilities only; the time logits are saved for the pre-specified diagnostics and never form a system"
    rows: ["direct argmax", "B3", "the seed's source Ordered numeric B3 setting (decoding sensitivity only)"]
    b3: {half_window: [5, 7, 9, 11, 15], quantile: [0.80, 0.85, 0.90, 0.95, 0.97, 0.99, 0.995, 0.999], nms_radius: 5}
    b3_rule: >-
      per model, once, on the calibration half: thresholds are quantiles of that model's own calibration native B3
      scores; among settings with native macro-F1 >= 0.980 and multi boundary recall >= 0.95 the highest segment F1@50
      wins, ties to the earlier grid entry; then frozen and applied once to selection; no feasible setting fails the
      model's B3 row and the diagnostic 9 / 0.95 never passes anything
    fixed_ordered_setting: {half_window: 9, nms_radius: 5, thresholds: {0: 0.29269428317686846, 1: 0.2845063773784935, 2: 0.30845250187026374}}
    primary: "aligned_dense - center_only, multi segment F1@50 with B3, per half over the three seeds"
    must_list: ["aligned_dense - frozen Ordered + B3", "aligned_dense - shuffled_dense"]
    also: ["center_only - frozen Ordered + B3", "shuffled_dense - center_only", "aligned_dense - historical Continued CLS"]
    references: >-
      frozen Ordered + B3 (V01 saved outputs and stored settings), historical Continued CLS (V02 saved outputs and stored
      settings), E0/E1/B7 + B3, historical E1 + ASRF, paired ASRF and Original FACT (their frozen weights or outputs),
      A01 Linear + B3, MS-TCN and ASRF (their frozen heads on their saved features) and G1 + ASRF (stored rows); every
      reference reproduces its stored rows before use; no old weight is applied to new features
    bootstrap: "existing paired bootstrap: native clips by session, streams by stream (approximate; development halves reused); 2,000 draws, seed 20261002; the same draws for both systems"
    consistent: "all three seeds' 95% intervals strictly exclude zero on the same side in a half; anything else is no consistent difference detected (not equality); seeds are not extra cases"
    mixed_windows: >-
      mixed windows of the constructed streams (at least two reference views among the 16 frames): five-class CLS argmax
      accuracy at the requested sample on all mixed windows, by the number of frames carrying the requested sample's
      reference view (<= 7, 8, 9-11, 12-15 of 16) and on A4C/A5C pair windows; paired bootstrap resampling the source
      sessions of the requested samples (primary) and whole streams (sensitivity), 2,000 draws, seed 20261002
    stream_conflict: "if the stream-resampled verdict is consistent in the opposite direction to the session verdict in a half, that half's mechanism reading is uncertain"
    native: "native macro-F1, five-class recall, A4C->A5C and A5C->A4C fixed and new clips with their recordings and sessions, label switches per clip"
    units: "multi segment F1@50, boundary precision, recall and F1, reference segments of at most 16 samples, X-Y-X middles, A4C/A5C middles, cuts at same-view joins"
    diagnostics: >-
      pre-specified, not systems: the time-logit accuracy at the 8 anchors against the development reference labels
      (overall, mixed windows, class-wise recall), and at every change of the reference class between two consecutive
      anchors of a mixed window whether both anchors are right; counted with their source recordings and sessions;
      fewer than 10 units are flagged; never a selection, a sampling rule or a trigger for another round
    cases: "every case also as distinct source recordings and sessions; no id or medium leaves the server"
  goal:
    selection_min: 0.944409687184662
    calibration_min: 0.9821421709894332
    calibration_sensitivity: 0.9838935784747763
    boundary_recall_min: 0.95
    native_macro_f1_min: {selection: 0.973, calibration: 0.980}
    rule: "three-seed mean multi segment F1@50 at or above both minimums, and in every seed and half a feasible B3 setting, boundary recall >= 0.95 and native macro-F1 at or above the floor; no rounding"
  decision_rules:                # the task sheet's Task 4, applied once after the evaluation; conditions fixed before any output
    model_progress: >-
      aligned_dense - center_only and aligned_dense - frozen Ordered + B3 are both consistent positive in multi segment
      F1@50 in both halves, and aligned_dense meets every constraint and the goal -> 'it improves on the current strong
      system'; meeting the old numbers alone is not enough
    mechanism_support: >-
      on all mixed windows (session bootstrap), aligned_dense - center_only and aligned_dense - shuffled_dense are
      consistent positive in both halves; aligned_dense - center_only is consistent positive in multi segment F1@50 in
      both halves; and aligned_dense has a feasible B3 setting, native macro-F1 at the floor and boundary recall >= 0.95 in
      every seed and half -> 'this recipe supports time-aligned supervision'; it does not need the old mean goal and does
      not mean beating the frozen strong reference; a half with a stream-sensitivity conflict makes the reading uncertain
    system_only: "aligned_dense - center_only consistent positive in multi segment F1@50 in both halves without mechanism support -> the system result is kept and the mechanism is undetermined"
    shuffled_only: "aligned_dense beats shuffled_dense consistently (all-mixed accuracy or multi segment F1@50) in a half, while aligned_dense - center_only is consistent positive on neither in either half -> no practical gain"
    tradeoff: "aligned_dense - center_only is consistent positive on all-mixed accuracy or multi segment F1@50 in a half, but aligned_dense fails a constraint or lacks the two-half system gain -> the trade-off is reported and this configuration ends"
    no_gain: "aligned_dense - center_only is consistent positive on neither all-mixed accuracy nor multi segment F1@50 in either half, and aligned_dense - frozen Ordered + B3 is not consistent positive in either half -> this configuration ends; dense supervision in general is not rejected"
    end: "the round ends at its report; no teacher, boundary loss, gate, new head, lambda sweep, more epochs or seeds, and no sampling change from development cases"
    several: "the readings are not exclusive; every one that applies is reported"
  outputs:
    root: runs/video_dense_supervision_v1
    checkpoints: checkpoints/video_dense_supervision_v1
    frozen: models_frozen/video_dense_supervision_v1/{center_only,aligned_dense,shuffled_dense}_s{seed}
    results_dir: docs/results/2026-10-13_video_dense_supervision
