    V02: "continued CLS and patch readouts replacing the CLS input; one window target per window; closed"
    V03: "request density at inference only; closed"
    A01: "temporal heads on frozen 512-d window features; closed (trade-off, no gain)"
    change: "class supervision of the 8 final time tokens at their input time anchors, with the CLS path, parameters, inputs, batches and RNG use unchanged across the paired arms"
