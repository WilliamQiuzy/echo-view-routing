# Video token supervision with the preserved CLS output (docs/superpowers/plans/2026-10-13-video-dense-supervision.md).
# Fixed before any code, preparation or training of this round exists. Three paired arms continue each seed's frozen
# Ordered context model of the raw-video context round (V01) from its full final weights. Every arm runs the same forward:
# the original CLS logits first, then the 8 time positions of the final normalised tokens, averaged over space and read
# by the shared dropout, 512-d projection and five-class head. The arms differ only in the auxiliary supervision of those
# 8 time logits: none (weight 0), the classes at the true input time anchors, or the same classes permuted within the
# window. Inference uses only the original CLS output with B3. No parameter is added. Labels serve the losses and the
# evaluation only. The test split and EchoNet-Pediatric are not read. This is a test of a training objective on an
# existing backbone (MViTv2), not a new architecture; earlier per-frame supervision (R11) is acknowledged.
#
# Inherits model_development_v2.yaml only for the protocol keys, the two development halves and the decoding grid.
extends: model_development_v2.yaml
run_name: video_dense_supervision_v1
experiment: video_dense_supervision_v1

