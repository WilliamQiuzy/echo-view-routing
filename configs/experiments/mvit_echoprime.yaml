# V4 echo-pretrained video Transformer: the same MViTv2-S initialised from EchoPrime's released video encoder
# (contrastive pre-training on ~12M echo videos; third_party/EchoPrime model_data v1.0.0), EchoPrime normalisation.
extends: ../base.yaml
run_name: mvit_echoprime
task: raw9
vit:
  model: mvit_echoprime
  n_frames: 16
  step: 3
  batch_size: 8
  lr: 5.0e-5
  layer_decay: 1.0
  weight_decay: 0.05
  warmup_epochs: 1
  epochs: 30
  patience: 6
  num_workers: 4
  eval_clips_per_video: 3
  extra: {echoprime_ckpt: third_party/EchoPrime/model_data/weights/echo_prime_encoder.pt}
