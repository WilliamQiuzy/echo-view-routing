# A38 (video_predicted_run_context_v1), 2026-10-26 UTC: predicted-run limits on the wider auxiliary window, one matched screen.
# Committed before any new mapping statistic, feature extraction or training. Task sheet:
# claude_prompts/2026-10-26-predicted-run-context.md (sha256 2a1a862d8d09b1995f7ed099d736079cf1866857505ecfd16152fc2f93a120b1).
# Question: does limiting A37's auxiliary W input to the frozen Base's predicted run around the request centre (C) keep
# more correct runs than the unlimited W, while keeping the useful A5C corrections? This is a predicted-boundary input
# condition: not a fixed span / density variant of A37 and not A28's single interval clip replacing the recognition input.
# The q / e224 path, the cuts and the final merge stay as they are. C changes span, repeat rate and boundary position
# together; this round judges the whole input condition and attributes nothing to one of them. The evidence so far does
# not show that the corrections come from visible LVOT or that cross-boundary content causes the harm.
# No development / check / test / Pediatric reading; source seed 2 only by the rule below.
experiment: video_predicted_run_context_v1

