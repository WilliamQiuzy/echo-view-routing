# A44 (video_risk_constrained_a5c_v1), 2026-10-28 UTC: an end-to-end visual repair policy for original Base-A4C runs,
# trained directly on the fit fold's actual Base-A4C repair opportunities (deployed-unit P runs with their original
# multiplicity weights). N (hinge false-promotion constraint on correct A4C with an adaptive dual variable) against C
# (ordinary class-balanced binary cross-entropy): identical examples, inputs, architecture, initialisation, 600 updates
# and compute; only the objective differs. Committed before any new model, loss or plan computation (only Codex's
# metadata-only feasibility ran before, outside this ledger: cyclic plan CPU body 0.118 s, no pixels / model / GPU).
# Task sheet: claude_prompts/2026-10-28-risk-constrained-a5c-training.md
# (sha256 25f668c75db59a82e249728dec5b2d6c15f9d3edebf46a2390b8035e032c8805).
# Question: can an end-to-end visual repair policy recover Base-missed A5C while respecting an explicit budget on
# damaging correct A4C? Any common C / N gain over Base supports the shared package (training on deployed-unit repair
# opportunities + one-way rule); N - C alone addresses the constraint's contribution. This is a bounded training
# question, not a claim of a novel general algorithm: interval pooling (A29 / A27), selective correction (A31 / A42),
# hard negatives, encoder adaptation, utility weighting / routers (A16) and a fixed expected-segment-risk penalty (A25)
# already exist. No development / check / test / Pediatric reading; source seed 2 only by the rule below.
experiment: video_risk_constrained_a5c_v1

risk_constrained_a5c:
  id: A44
  type: matched_training_comparison
  predecessors: "A43 (docs/results/2026-10-27_a5c_witness_mil: marker-time gated-attention witness on whole native bags, one-way rule on run max; D fixed 25 / 103 S1 but promoted 112 / 1,413 correct A4C, net -87, segmentation worse; M fixed 2 / broke 4; trained on native recordings but acted on Base P runs; closed), A42 (docs/results/2026-10-27_session_matched_discrimination: S 4 vs C 3 S1 fixes, both broke 56 correct runs; closed), A31 (docs/results/2026-10-24_session_correction: error emphasis, the two session folds; closed), A29 / A27 (pooled five-class interval CE), A25 (fixed expected-segment-risk penalty), A16 (utility weighting / routers). None is reopened; A44 does not invent interval pooling, selective correction, hard negatives, encoder adaptation or risk awareness"
  changed_condition: "training directly on the fit fold's actual Base-A4C repair opportunities (positives = S1 runs, protected negatives = correct A4C runs, each with its entire original P membership and multiplicity weights) with a false-promotion hinge constraint on the correct A4C runs and an adaptive dual variable (N), against a matched soft-cost class-balanced binary classifier (C). The supervision unit and the optimisation problem change; A43's threshold rule (r > 0, one way) does not. Neither arm reuses A43 trained weights"
  references: "motivation only, not reproduced results or a novelty claim: Neyman-Pearson asymmetric error control; Cotter et al. AISTATS 2019 (https://proceedings.mlr.press/v98/cotter19a.html) on the limits of nonconvex Lagrangian learning. A44 tests the simple empirical hinge-constrained primal-dual recipe below, NOT their proxy-Lagrangian algorithm or its guarantees; nonconvex stochastic optimisation on these weakly labelled recordings gives no held-out harm guarantee"
  data:
    pools: "A31 fold pools runs/video_session_correction_v1/pool_{0,1}.npy (sha256 96d1fb683e1a261d5be9a3cc7ec393637577bbf83b56140cec41f544c4f3b486 / 08255192dae3a90644ea062880bf6b2b298181ed12e9890d56ca04630f5adef4); split.json e03100941d77e1fe64a825e4f2a4f7ef038a5725bcf943a55db15a983ef29d6d (sessions / recordings / window identities shared 0); all re-verified. No resplit, no new stream"
    requests: "A31's pool_W: stride-5 centres c of each complete sequence, samples S = window_frames(c, N, 16, 16) (16 samples, 10 Hz), marker = marker_slot(S, c), A08 pixels / 224 crop / original gamma / normalisation; the nearest-centre sample map. Unchanged for training and readout"
    base_outputs: "A31 outputs_s{s}_f{f}.npz (q): s0 5884435770e8b65959b22ff77f74b0c2053cadf7fd2a5a28c842104df2f1a512 / 0a99be35b0cd78d650f5014c8ddc783173e6fb849ee556d6fa2a52c73f33d360; s2 5e8042a75e7c38d2f8345c3c3bbf357039efeed530f8758a1a7c7838fe5507fb / 2b1f1e13dce2a769f4091745e531bb998bc122b58cd5f3c09d2c364d904f4a33"
    base_runs: "A31 data/runs_s{s}_f{f}.npz (P runs: unique nearest-centre request rows per run with multiplicity weights summing to 1, majority reference label, purity, Base label, sequence / sample bounds): s0 7b28ac6c224f594ef7bf49d6307186807d91bd8577dbc192e8cece07bea7452c / 98ce5c572aa29576a098685c1d28220684e755cbea537b6739020c0387ddc026; s2 91d04d4f255b7e892343b102c736f1b69c8126a69f2e0df1f5c23f1c60d8860f / ef76e587a0db2c7b18dcbdaee5631497963ad8eb9988a929e4526d5949259ef9"
    a08: "models_frozen/video_within_view_v1/all_s0/final.pt 9b144925f32fac7d725d13231a132abeb6635fa44b6fe0dbcec7f5b59d035bbc; all_s2 f95fed7ba78cc0b5e2474c71a156356507b4588a4b324957fd5b53fe66ee8472 only if the rule triggers. The original frozen A08 + B3 keeps producing Base and its runs, unchanged. A43's trained weights are not reused"
    training_lists: "per fit fold f (pool f ONLY): eligible = original Base P-run label A4C (2); positives = eligible with reference run label A5C (3), i.e. S1; protected negatives = eligible with reference A4C (2); other-class eligible runs (reference not A4C / A5C) are excluded from binary training, retained in every readout and net accounting and disclosed. Lists in original P-run order; no purity / duration / source filter, no augmentation, no new constructed stream. Asserted before any pixel at source 0: positives / protected negatives / other eligible = 34 / 714 / 1 (f0), 69 / 699 / 3 (f1); eligible 749 / 771. The run reference is the original clip-code majority label, not anatomical or expert truth; native and constructed runs occur as in the original P pool (kinds, purity and repeated-source exposure are reported). A mismatch is an engineering stop"
    deployment_unit: "every training or deployment run uses its ENTIRE original P membership: unique original request rows j with weights v_j = (that row's multiplicity in the run) / (total multiplicity), summing to 1; run score r = sum_j v_j s_j. Independently verified against the explicit repeated-sample mean over the run's samples. Windows may straddle run boundaries and are neither cropped, recentred nor capped. Each run keeps its own multiplicity even when requests coincide across runs. No frozen feature cache or prefix-head substitute"
    fit_only: "fit fold f reads only pool f (its pixels, Base outputs, P runs and reference labels) for training, checks and full-fit scoring; held-out pool 1 - f is read once, by the frozen models' readout, only at the eligible Base-A4C rows. Sessions are not verified patients; A08 already trained on these source recordings, so session separation holds out only the new repair policy"
    not_read: "development / check / test / EchoNet-Pediatric; the A26 runner; Unity training; outside media; expert or pseudo labels; A43 trained weights; held-out pixels or held-out model outputs before the freeze"
  architecture:
    copy: "per source seed s and fit fold f and per arm: A08 all_s{s} (TargetMViT) copied bit-identically; the full original marker forward (marker_stem added to conv_proj output inside TargetMViT.embed) runs unchanged, in eval mode, with gradients enabled"
    head: "the unchanged 512-dimensional `embed` output (encoder trunk -> original Dropout + Linear(768, 512) projection) feeds a new Linear(512, 1) scalar head: 513 parameters, weight exactly 0, bias exactly -2 (initial score r = -2 for any input, so Init = Base exactly under the deployment rule)"
    init: "torch.manual_seed(2026102844 + 10 s + f) immediately before the scalar head is constructed (same in both arms); the head values are then overwritten to 0 / -2"
    trained: "every original A08 parameter except the unused five-class classifier: encoder trunk (conv_proj, pos_encoding, 16 blocks, norm), marker_stem.weight, the original 768 -> 512 projection (encoder.head.1), plus the scalar head; from update 0, no frozen warm-up"
    frozen: "the original five-class classifier (classifier.weight / bias): requires_grad False, not in the optimiser, unchanged, unused"
    excluded: "no gated local attention, MIL / max pooling, KL, rank term, anatomy labels, extra loss, augmentation or new pretrained checkpoint"
  objectives:
    per_update: "one positive run p and three protected A4C runs n_k (k = 1..3), each scored by its weighted run mean r. A = softplus(-r_p); B = mean_k softplus(r_nk); H = mean_k relu(1 + r_nk)"
    C: "A + B (class-balanced binary cross-entropy of class means; no prevalence reweighting)"
    N: "A + lambda_u * (H - alpha), alpha = 0.01, lambda_0 = 1.0. The primal gradient treats lambda_u as a constant. After the primal optimiser step: lambda_{u+1} = clip(lambda_u + 0.1 * (H_pre_step - alpha), 0, 100) with the detached pre-step minibatch H. No EMA, dual warm-up, adaptive tolerance, threshold search or final multiplier selection; lambda is saved and restored exactly in the resume file"
    hinge_note: "relu(1 + r) upper-bounds 1[r > 0]; full-fit mean H <= 0.01 implies an empirical full-fit false-promotion fraction <= 0.01. The minibatch estimate and the dual trajectory do not prove the final constraint or held-out protection; full-fit feasibility is logged separately (Init is feasible: r = -2 gives H = 0). At r = -1 PyTorch's ReLU derivative is 0; the decision at r = 0 is no edit"
    common: "same A08 copy, head init, plan, images, membership weights, optimiser, schedule, model RNG, eval mode and two-pass computation; only the loss on the leaf run scores differs"
  plan:
    positive: "update u: default_rng([20261028, 44, s, f, u]).choice(positives)"
    negatives: "one permutation per fit model: default_rng([20261028, 44, s, f, 1000]).permutation(protected_negatives); update u uses its indices (3 u + arange(3)) % n_neg; every protected negative is covered and no update repeats a negative"
    layout: "int64 array (600, 4) = [p, n1, n2, n3] of fold-local P-run indices in that order; sha256 of its contiguous int64 bytes. Asserted at source 0: f0 3b3be337e7d22a1f1a96196cfc4460b4425ae367f407f6a16a01e5b2cc5c3efc, f1 2a1dd83d9e8b5f2025ccb6e4bd90587bae15ee9b42bb27fe7f6c71ab6ed463a8; unique per-run window occurrences over the 600 updates 14,778 / 15,528, most in one update 129 / 88; all 34 / 69 positives and 714 / 699 negatives drawn. P-run ids stay private. The same plan for C and N"
    selection_inputs: "the fit pool's original Base P-run labels, reference majority labels and request map only (no model output of this round, no held-out pool, no session matching)"
  optimisation:
    updates: 600
    order: "source seed first: C_f0, N_f0, C_f1, N_f1. Final weights after update 600 only; no checkpoint / epoch selection, no retuning"
    optimizer: "AdamW betas (0.9, 0.999), eps 1e-8, weight decay 1e-4 in every group. Groups: 'encoder_trunk' lr 1e-5; 'marker_stem' 1e-4; 'projection' (encoder.head.1.weight / bias) 1e-4; 'scalar_head' (Linear(512, 1)) 1e-3"
    schedule: "linear warm-up over 60 updates, then cosine to update 600 (echo_routing.temporal.dev_train.lr_factor via A31 sched)"
    clip: "global gradient norm 1.0 over the trainable parameters, once per update"
    mode: "eval mode throughout (dropout / stochastic depth off; LayerNorm only); gradients on (eval is not no_grad)"
    two_pass: "A43's exact scalar chain rule, microbatch 1, both arms. Pass 1: EVERY window occurrence of the four runs (each run's unique rows; a row shared by two runs is two occurrences) forwarded without a graph; the run means on a differentiable leaf score vector give dL/ds for every occurrence. Pass 2: EVERY occurrence recomputed with autograd and s.backward(dL/ds), including zero-gradient N-negative windows; parameter gradients accumulate; one clip and one optimiser step per update. Same plan, occurrence order, two forwards and one backward per occurrence in both arms; no window cap or short-bag substitution; no detached feature-head substitute"
    numerics: "FP32; TF32 off; cudnn deterministic, benchmark False; torch.use_deterministic_algorithms(True, warn_only=False); A42's validated GatherMaxPool3d (echo_routing.temporal.session_pairs.deterministic_skip_pools) on training copies only; the readout uses the original nn.MaxPool3d modules (no backward). No precision, membership or update-count fallback"
    memory: "RAM-only decoded-frame prefetch for the current updates (DataLoader); no persistent pixel / feature / prefix cache on disk"
    resume: "at most one active resume file per model (model, head, optimiser, lambda, update, log, scheduler state is a function of the update, CPU / CUDA RNG, plan sha256), overwritten every 150 updates and removed after the final weights are verified; exact resume"
    logging: "every real update: run ids kept private but exposures counted; A / B / H; actual false-promotion indicators (r_nk > 0) and their count; positive r; negative r min / max; lambda before / after and cap hits (both arms log lambda; C's is inert); score-gradient sums by class; pre-clip gradient norms of trunk / marker / projection / head and the total; pass-1 vs replayed score parity; device / PID / per-window and per-update seconds"
    full_fit_scoring: "at update 0 and after update 600, every fit training run (all positives and protected negatives, plus the excluded other-class eligible runs for disclosure) is scored with its original membership (unique rows, no grad): full-fit mean H, actual false-promotion count / fraction among protected negatives, positive recovery (r > 0), kinds / purity / repeated-source exposure. Fit only; no retuning or selection; per-run outputs stay private"
  deployment:
    rule: "original Base (frozen A08 + B3) cached P runs and request map. Eligible runs are ONLY those whose original Base label is A4C (2). For each, its unique original request rows are scored by the frozen model and r = the multiplicity-weighted mean; r > 0 changes the run to A5C (3), otherwise it stays A4C. Every other Base run label is copied exactly. Equal neighbours merge by RLE; complete sequences are scored with the original evaluator. No threshold selection, temperature, mix, alternative readout, reference-label / source / session input or held-out adaptation; the same forward score arrays feed the weighted run means, the one-way labels and the original full evaluator"
    eligible: "asserted from the cached P runs before any held-out pixel, source 0: eligible Base-A4C runs 749 (held-out pool 0) / 771 (pool 1); unique needed request rows 5,030 / 5,437 (full grids 24,585 / 25,774). Only these rows are forwarded, once per arm, after the freeze"
    invariant: "Init (every score -2) reproduces Base exactly. Every originally non-A4C P-run label, including correct A5C, is protected BY THE DECISION RULE, not by learned retention. RLE merges can still erase real boundaries even when non-A4C labels are structurally protected; correct A4C can be wrongly promoted"
    private_cache: "scalar scores of the needed rows (row identity map), per-run r, membership offsets and per-run labels, saved on the server with sha256 for Codex's independent recount; never exported"
  checks: "(1) inputs: pools / split / A08 / q / P-run hashes; original markers and pixel path (A31 chunk_frames) equal an independent per-reference decode; A07 grid; run multiplicity weights equal an explicit repeated-sample loop and sum to 1; fit-only isolation (no session / recording / window shared across folds). (2) lists / plan: asserted counts; positive and negative explicit RNG reproduction; permutation coverage without same-update duplication; plan sha256 as asserted; exposure totals and maxima. (3) Init: A08 copy bitwise, identical arm start, 513 head parameters at 0 / -2, every first-pass score exactly -2, online fit logits = A31 cache within 1e-4 (no held-out pixel), patched = original forward bitwise, Init = Base on every cached P run / sequence / A32 row. (4) formula: independent float64 run means, A / B / H, gradient coefficients (incl. zero-loss negative windows under N when 1 + r <= 0) and the lambda recurrence with r = -1 / 0, huge scores and clipping at 0 / 100. (5) production two-pass FP32 gradients vs one retained-graph backward on short runs (check-only nonzero head weight; relative max <= 1e-5) for C and N; replay <= 1e-5; gather vs original max-pool backward parity (warn_only True only there). (6) binding: exactly the trainable tensors (trunk, marker, projection, head), classifier frozen; update 0 trunk / marker / projection gradient exactly 0 with the zero head, head gradient nonzero; updates 1-5 genuine gradients and movement in every group (unchanged tensors must be structurally explained; A43's key-LayerNorm-bias exception is not blanket permission); 6-update repeat, 3 + 3 resume (lambda and optimiser included) vs 6, forced N-with-C-objective (dual off, check only) vs C exactly, genuine N vs C divergence. (7) synthetic one-way edits, negative / zero ties, full-sequence reconstruction / RLE, label-free decision; eligible counts. (8) A08 files unchanged; measured timing / memory / disk and the conservative projection. No held-out pixel or model output in checks"
  limits:
    loss: 1.0e-4
    params: 1.0e-5
    grad_rel: 1.0e-5
    formula: 1.0e-8
    replay_abs: 1.0e-5
    online_parity: 1.0e-4
    peak_gpu_gb: 40.0
    roundoff_grad_rel: 1.0e-6
  freeze: "all four source-seed model / head / base / code / config / input / plan sha256 manifests committed and the git objects checked (local object contents and server weights) BEFORE the one opposite-fold readout (fit f -> held-out 1 - f); no outcome is computed before the freeze"
  readouts: "per held-out fold and OOF for Base / C / N over all P runs at true prevalence: S1 fixed / 103 and true-A5C source recordings INSIDE the corrected runs; correct A4C damaged / 1,413; fixed / broken / net including other classes; correct A5C and non-A4C structural retention; complete multi segment F1@50, native macro-F1, boundary P / R and boundaries deleted by merge, short FP / missed short true; deployment cost; full-fit constraint feasibility. N - C paired private overlap: common / C-only / N-only fixes AND harms and the per-run-label disagreement count (not inferred from equal aggregates). Aggregate comparison with A43 D / M on the same fixed denominators. No case exports or LVOT claim"
  gates:
    absolute: "per arm, source 0 denominators S1 = 103, correct A4C = 1,413, correct A5C = 1,150 (source 2 uses its own). An arm passes the common package gate ONLY if ALL: (1) S1 fixed >= ceil(10%) (11 / 103) from >= 3 distinct true-A5C recordings total, and >= 1 fixed run and >= 1 source recording in EACH held-out fold; (2) every non-A4C original run label unchanged (hard invariant), correct A4C kept >= ceil(99%) (1,399 / 1,413), net fixed >= 0 in each fold and OOF >= +5; (3) complete multi segment F1 not below Base in either fold and two-fold mean delta >= +0.001, native macro-F1 delta >= -0.003 and boundary recall delta >= -0.005 in each fold, missed short true OOF <= Base + 3. A no-op cannot pass. C's absolute gate is the package gate. N's absolute gate is the package gate AND full-fit H <= 0.01 in BOTH training models (a constraint-qualified success); a package-only held-out pass with an infeasible fit constraint is reported but does not pass N's absolute gate or trigger source 2 through N. Any infeasibility is stated"
    clarification_before_training: "2026-10-28, after the config commit 696ac68 and before any check or training (Codex implementation note): N's absolute gate and the source-2 trigger use the combined package + full-fit feasibility boolean; the package-only outcome is still reported separately. Readout bookkeeping only; no training condition changes"
    constraint_contribution: "separately predeclared: N S1 fixes >= ceil(0.8 x C's S1 fixes) in each held-out fold; N has no more correct-A4C harms than C in either fold; >= 50% fewer harms OOF AND at least 5 fewer; net N - C >= +5 OOF; full segment F1 N >= C in each fold; and N passes its absolute gate. Merely losing both fixes and harms, or passing the shared package without this difference, is not evidence for the constrained objective; raw differences are reported even when this gate fails"
    action: "if EITHER arm passes the absolute gate and the conservative remaining shared budget suffices, repeat BOTH arms at source 2 under the identical recipe (s = 2 in every RNG key, A08 all_s2, its own Base / membership / denominators, 600 updates, four-model commit, freeze, one readout). Otherwise close at source 0. No development / check / test / Pediatric evaluation, A26 runner, Unity training, expert / pseudo labels, additional variants, full fit or A45"
  scope: "a result covers only this scalar-head repair policy on the unchanged A08 embed output, full-model 600-update training on deployed-unit Base-A4C runs of the fit fold, the C / N objectives above and the one-way r > 0 rule on clip codes; not passing is not equivalence"
  reuse: "A43 two-pass chain rule / build / binding / resume / freeze / readout layout (scripts/train_a5c_witness_mil.py; one_way, edit_sequences, eligible rows), A42 GatherMaxPool3d (echo_routing/temporal/session_pairs.py), A31 loaders / pool_W / outputs / P runs / opt_of / sched, A32 fold data / masks / id guard, A36 tables / staged / publish, A37 chunk_frames / coverage, A38 loaded_code / boundaries, A39 a5c_extras / ceil_pct; read only, old configurations unchanged"
  budget:
    gpu_hours_max: 6.0
    cpu_hours_max: 3.0
    new_disk_gb_max: 3.0
    min_free_disk_gb: 15
    launch_gate: "before formal training: spent + the full four-model schedule (planned occurrences x measured two-pass seconds per occurrence, plus per-update overhead, plus the update-0 / 600 full-fit scoring at the measured no-grad rate, x 1.15) + the eligible-row readout at the measured rate + 0.4 GPU h reserve <= 6.0; re-projected before source 2 (whole-round shared cap including source 2). Otherwise engineering_stop; no schedule / membership / precision change"
    accounting: "GPU = job wall time including decode / wait inside the job, bootstrap and failures; CPU = active agent wall clock (idle polls and waits excluded; active intervals between polls recovered from stream timestamps) plus server CPU jobs; a GPU job's loader is not charged again as CPU; actual closing timestamps only, never future reservations; Codex feasibility / reviews / root audit disclosed outside this ledger; older ledgers read only"
    storage: "no pixel / feature cache; final weights, small logs and the private readout cache only; at most one active resume per model; only this round's regenerable intermediates may be deleted, after the finals are verified"
    ledger: runs/video_risk_constrained_a5c_v1/ledger.jsonl
  outputs:
    root: runs/video_risk_constrained_a5c_v1
    results_dir: docs/results/2026-10-28_risk_constrained_a5c
