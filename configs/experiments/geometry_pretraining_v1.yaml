# Geometry-supervised pretraining, minimal design (the user's decision of 2026-10-03, after the CETUS request was sent).
# Written before any pretraining run; plan: docs/superpowers/plans/2026-10-03-geometry-pretraining.md. Nothing here may
# start until every item under `start_conditions` holds and the project lead approves. Changes go under `amendments`.
experiment: geometry_pretraining_v1

question: "Beyond same-plane temporal consistency, does adding regression of the tilt difference improve real 2D
  tasks: keeping the A4C/A5C difference and reducing false changes inside a recording? G2 - G1 tests the extra tilt
  supervision. G1 already uses one geometric relation (the same plane at two times), so a G1 - G0 gain is not only the
  effect of more data. Answered only on real 2D EV9V clips, against B3 and ASRF. A more accurate 3D angle, or steadier
  output on one plane, is mechanism evidence only."

arms:
  G0: "the E1 encoder as it is (EchoViewCLIP stage-1 image encoder, models_frozen/e1_echoviewclip_probe/v1)"
  G1: "E1 + same-plane temporal consistency: InfoNCE with the same plane at two times as positives"
  G2: "E1 + the same InfoNCE term + regression of the tilt difference d_alpha"
  identical_for_G1_G2: [pair bank and its order, augmentation draws, trainable parameters, initialisation, optimiser,
    steps, batch, seeds, preprocessing]
  only_difference: "lambda_geo = 0 for G1, 1.0 for G2 (fixed in advance, not tuned)"

data:
  sources:
    echoslicer: "29 Philips EPIQ CVx 3D+t volumes from 4 people (A 15, B 5, C 5, D 4); acoustic grid; 6-30 volumes/s"
    stacom2011: "15 volunteers, one Philips iE33 Cartesian volume each, one gated cycle at 18-21 volumes/s; probe pose
      from scripts/stacom_verify.py"
    cetus: "not used until the organisers grant access and permission"
  split_by_person: "no person's volumes are divided between pretraining and held-out checks"
  held_out_people: [echoslicer C, stacom v14, stacom v15, stacom v16]   # mechanism checks and the contrast baseline only
  inclusion: "a (volume, psi) draw is kept only if its fixed mask covers at least 20% of the slice; a volume whose median
    coverage over psi is below 20% is dropped and listed"

pairs:                                    # echo_routing/geometry/pairs.py
  plane: "ProbePlane(psi, alpha): psi uniform on [-150, 30] degrees about the beam, alpha the fan tilt about the lateral
    axis (the A4C to A5C motion), planes through the probe. psi and psi + 180 are the same plane mirrored; this range
    keeps the standard display orientation, with A4C near 0 and EchoSlicer's A2C and A3C at negative psi"
  psi_grid_deg: 1                         # psi drawn from whole degrees, so fixed masks can be cached per (volume, psi)
  alpha_range_deg: [-15, 15]
  sampling: "person first (uniform over pretraining people), then volume (uniform within the person), then psi,
    alpha and times; EchoSlicer person A's 15 volumes count as one person"
  augmentation: "none in the first round: no flips or rotations, which would have to move the geometric labels with
    them, and no intensity changes"
  kinds: {same_plane: "same plane, two times (only the heart moved; d_alpha = 0)",
          same_time: "two planes, one time (only the plane moved)", both: "both changed"}
  kind_probabilities: [0.3333, 0.3333, 0.3333]
  grid: {pixel_mm: 0.5, width_mm: 160, depth_mm: 150}
  bank: "rendered once per seed and stored with its digest; G1 and G2 read the same bank in the same order"
  controls:
    fixed_mask: "both slices share the region visible at every tilt in alpha_range for that psi"
    standardise: "each slice moved inside the mask to the mean and SD of EV9V training frames' sectors, then clipped"
    contrast_baseline: "a ridge regression from per-slice mean, SD, sharpness and relative sharpness to d_alpha,
      trained on pretraining people and scored on held-out people, computed twice: on the raw slices and on the final
      input the model sees (after standardisation, clipping, resize to 256 and the centre crop 224). Reported with the
      zero predictor (always d_alpha = 0) as the floor reference"

model:
  encoder: "VisualEncoder(load_vision_transformer(...), trainable_blocks=1): resblocks.11, ln_post and proj train"
  preprocessing: "as E1: grey copied to RGB, short side 256 (bilinear), centre crop 224, mean [123.675, 116.28,
    103.53], std [58.395, 57.12, 57.375] on 0-255"
  infonce: {projector: "512-512-128 MLP", temperature: 0.1,
            positives: "the two slices of a same_plane pair (same plane, two times), the analogue of frames of one clip",
            negatives: "every other slice in the batch",
            masks: "explicit: anchors are the slices of same_plane pairs; an anchor's positive is its partner; the
              denominator holds every other slice of the batch, the partner once, never the anchor itself"}
  geometric_term: {head: "MLP on [z1, z2, z1 - z2, z1 * z2] -> 256 -> 1", target: "d_alpha / 15 degrees",
                   loss: "smooth L1", pairs: "all kinds (d_alpha = 0 for same_plane)"}
  optimiser: {name: AdamW, lr_encoder: 1.0e-5, lr_heads: 1.0e-4, weight_decay: 1.0e-4, warmup_steps: 300,
              schedule: cosine, grad_clip: 1.0}
  budget: {steps: 3000, pairs_per_step: 32, seeds: [0, 1, 2], weights: "final, no early stopping"}
  tf32: false
  checks: ["G1 and G2 read bit-identical batches for each seed",
           "with the InfoNCE term off, the geometric term alone gives finite, non-zero gradients in every trainable
             encoder tensor (resblocks.11, ln_post, proj) and none in frozen ones"]

evaluation:                               # real 2D only; test split stays sealed
  halves: [selection, calibration]
  stage_a_classification:
    features: "frame embeddings of EV9V train and validation clips from each arm's encoder (main-environment
      extractor, same raw layout and frame indices as the E1 cache)"
    probe: "the E1 recipe: Linear(512, 5), AdamW 1e-3, at most 20 epochs, patience 5, kept on selection clip-majority
      macro-F1"
    metrics: ["A4C/A5C separation: AUC of the probe margin (A5C minus A4C) over the cached samples of native A4C
                and A5C clips (see terms.separation and amendments)",
              "the same AUC on clip-mean margins (reported; at its ceiling for G0)",
              "A4C recall and A5C recall (clip majority)", "native macro-F1",
              "false changes inside a recording: native_internal_cuts_per_clip of the frame-wise probe"]
  stage_b_segmentation:
    systems: ["ASRF (job M1, 3 seeds)", "B3 tuned (job simple)"]
    entry: "scripts/model_development_queue.py with each arm's feature manifest"
    native_f1_floors: {selection: 0.973, calibration: 0.980}   # fixed for every arm, applied at report time
    boundary_recall_min: 0.95             # multi-fragment boundary recall within 0.5 s on the calibration half
    job_rules: "inside the jobs, checkpoint and operating-point choice keep the established rules (each encoder's
      frame-majority baseline minus 0.005, recall 0.95); the thresholds above judge every arm alike, as in round 6"
    metrics: ["segment F1@50", "boundary recall within 0.5 s", "native macro-F1", "native_internal_cuts_per_clip"]
    references: {strongest_previous: {selection: 0.9344, calibration: 0.9721}}
    final_goal: "unchanged from the earlier rounds: three-seed mean segment F1@50 at least 1 point above the strongest
      previous configuration on each half, with boundary recall >= 0.95 and native macro-F1 at or above the floors in
      every seed and half"
  contrasts: ["G2 - G1", "G2 - G0", "G1 - G0"]
  required_reporting: ["classification and segmentation differences of G2 against G1 and G0, both halves",
                       "each system against the native floors and boundary recall >= 0.95",
                       "each system against B3, ASRF and the strongest previous configuration"]
  statistics: "paired bootstrap per seed (report_model_development.paired_bootstrap); consistent = all three seeds'
    95% intervals exclude zero in the same direction; otherwise 'no consistent difference detected'"
  mechanism_only: ["d_alpha error on held-out people, against the contrast baseline",
                   "embedding change between times at one plane against between tilts at one time"]

interpretation:                           # fixed before training
  - "These rules screen for a research signal; they do not establish the final goal. 'No consistent difference
    detected' is not evidence of no loss. An improvement on one half means the direction deserves further testing.
    The final goal stays beating the strongest previous configuration with the thresholds met."
  - "Geometry helps only if all hold: (1) G2 shows no consistent loss against G0 or G1 in A4C/A5C separation or A5C
    recall on either half; (2) G2 - G1 is consistently positive in A4C/A5C separation on at least one half and not
    consistently negative on the other; (3) G2 - G1 shows no consistent increase in false changes inside a recording;
    (4) in stage B, G2's systems are not consistently below G1's and gain consistently in segment F1@50 on at least
    one half."
  - "Only then is a larger round (more data, more steps) considered. G2 must also be compared with the strongest
    previous configuration and with ASRF; failing those is reported as such."
  - "G1 better than G0 while G2 adds nothing over G1: the slice data help, the geometry does not."
  - "Any arm with a consistent loss of A4C/A5C separation against G0 is not a success, whatever else improves."
  - "If the contrast baseline predicts d_alpha on held-out people about as well as G2's head, G2 may be using the
    shortcut; this is reported next to every G2 result."
  - "Neither G1 nor G2 better than G0: stop this direction at this data scale; CETUS would change the scale, not the
    rules."

terms:                                    # how the rules above are evaluated, fixed before training
  consistent: "all three seeds' paired 95% intervals exclude zero in the same direction (G0 has one probe and one B3
    run, paired with every seed; G0's ASRF seed k pairs with seed k)"
  separation: "AUC of the probe margin logit(A5C) - logit(A4C) over every cached 10 Hz sample of the native A4C and A5C
    clips of a half, samples of A5C clips against samples of A4C clips; bootstrap by session. The AUC of clip-mean
    margins is reported beside it"
  rule_4: "neither ASRF nor B3 of G2 is consistently below G1's in segment F1@50 on either half, and at least one of
    them is consistently above on at least one half"
  better_than_G0: "an arm whose separation, or the segment F1@50 of ASRF or B3, is consistently above G0's on at least
    one half, with no consistent loss against G0 in separation, A5C recall or segment F1@50 on either half"
  g2_adds_nothing: "G2 - G1 is not consistently positive in separation or in either system's segment F1@50 on either
    half"
  shortcut_warning: "in any seed, the contrast baseline on the final input (signed, held-out people, all pairs) has a
    mean absolute error at most 1.1 times that of G2's tilt head"

start_conditions:
  - "STACOM: all 15 volunteers decode (DICOM equals VTK), sectors fitted, timing recorded, one probe-frame convention
    (azimuth axis, handedness, anterior side) fixed for all, inclusion list written."
  - "EchoSlicer: all 29 volumes load as SphericalVolume; exclusions by the coverage rule listed."
  - "Pipeline: geometry unit tests pass; on real volumes, (a) EchoSlicer's A4C planes rendered by the pipeline score
    within 0.1 of EchoSlicer's own A4C probability, (b) the Cartesian path and a fine spherical resampling of each
    STACOM volume render the same planes with Pearson r >= 0.95 on shared pixels and a best-matching shift of zero
    pixels (speckle-level differences from the extra resampling are expected; a pose error would shift the image),
    (c) no fixed-mask pixel falls outside the volume at randomly drawn tilts."
  - "Main-environment extractor written. On identical input tensors with the same weights in fp32 and TF32 off, it
    matches the original encoder within 1e-4 (max abs). Its full pipeline from frames is compared with the float32 raw
    E1 embeddings; any difference above 1e-4 is traced to its cause."
  - "The existing E1 probe and decoding settings, applied without retuning to G0's features from the new extractor,
    reproduce E1's predictions and metrics."
  - "Pair banks rendered and their digests recorded; held-out people fixed above."
  - "One run at a time on the GPU, within 20 GB."
  - "The project lead approves the launch."

run: "once every start condition holds and the launch is approved: G1 and G2 for seeds 0, 1 and 2 at the fixed
  budget, one run at a time. Any check failure that cannot be explained stops the work at that item."

amendments:                               # revisions before any training run
  - "2026-10-04, from the project lead's review: the question is stated as above (G1 uses the same-plane relation, so
    G2 - G1 tests the extra tilt supervision); sampling is balanced by person before volume; InfoNCE masks are explicit;
    no augmentation in the first round; the geometric term's gradient reaches the trainable layers; the contrast
    baseline runs on raw slices and on the final input, with the zero predictor; the extractor tolerance is 1e-4 on
    identical input tensors (2e-2 had no basis: round 2 matched E1 within 3e-6 with TF32 off) and the existing probe
    and decoding settings must reproduce E1 without retuning; boundary recall >= 0.95 is written back as a threshold;
    the interpretation rules are screening rules, and the final goal is unchanged."
  - "2026-10-04, rule revision before training, for every volume (start condition 3a). The first check compared
    classifier scores of two different images: the pipeline's fixed 160 x 150 mm grid and EchoSlicer's own grid,
    extent, rotation and flips. Rendered under aligned conditions (EchoSlicer's sample points, frame 0, its display and
    its per-frame min-max grey scale; scripts/geometry_aligned_check.py), every EchoSlicer sample point lies on the
    pipeline's plane (at most 6e-14 mm off), and the images agree with Pearson r 1.000 on EchoSlicer's own volumes and
    0.994 to 0.998 on STACOM, best shift zero in all 18. Aligned, the classifier scores differ by at most 0.01 in 17
    volumes and 0.037 in v14, against +0.128 on the fixed grid, where the pipeline scored higher in all 18. Correctness
    is therefore judged on coordinate and pixel agreement under aligned conditions; the classifier comparison is
    auxiliary and made on aligned images. v14's failure under the first rule stays on record."
  - "2026-10-04, extractor result (start condition 4). Identical input tensors: the new encoder matches the original
    within 9.5e-6. Full pipeline against the float32 raw cache: at most 1.5e-4 over 477,144 frames. Traced: both
    environments crop identically (Pillow 12.3.0 in both), and the original model re-run on the same frames differs
    from the cache by up to 1.3e-4 too, yet reproduces it exactly (difference 0) inside the 256-frame batches of the
    original extraction. The residual is GPU summation order, which depends on the batch shape. The E1 probe, not
    retrained, changes no per-sample prediction; the stored ASRF checkpoints decode every validation sequence
    identically for all three seeds; B0 and B3 give identical metrics in all 111 tables, with the same operating
    point, whose derived threshold moves by 9e-8."
  - "2026-10-04, before launch: the final goal (the success test of the earlier rounds, unchanged) and the terms the
    report evaluates are written out (evaluation.stage_b_segmentation.final_goal, terms). The coverage rule is evaluated
    with the final masks (1-degree tilt steps, 2-pixel margin) over the 181 whole-degree psi values the sampler draws
    from; the pipeline check had estimated the median from 5 psi values. EchoSlicer D_0 (0.00) and D_3 (0.10) are
    dropped; D_1 (0.21, against 0.18 on the 5-value estimate) is kept; 42 volumes in all."
  - "2026-10-04, before launch, from the report's self-test on G0 (no G1 or G2 result exists): the clip-mean AUC is at
    its ceiling for G0 (1.000 on selection, 0.998 on calibration; 87 and 61 native A4C clips against 11 and 18 native
    A5C clips), so rule 2 could not detect a gain. One revision for every arm: the rules use the AUC over cached
    samples (G0: 0.915 and 0.882), which measures the same margin before it is averaged over a clip. The clip-mean AUC
    is still reported."
