# Round 3 (the user's instruction of 2026-10-02 after round 2): can separately learned boundaries beat B3 and ASRF?
# Fixed before any round-3 decoding or training. Recovering M5's own classification loss is not success. Protocol,
# halves, banks, training data, optimiser and update budget are inherited unchanged (model_development_v2 -> v1).
extends: model_development_v2.yaml
run_name: model_development_v3
experiment: round3

boundary_decoding:               # one rule for step 1 (existing boundary heads) and step 2 (boundary-only model)
  # intervals: peaks of the boundary probability at or above the threshold, non-maximum suppression within nms_radius
  # samples, position 0 excluded; labels: argmax of the frozen frame-level classifier's mean probability inside each
  # interval (E0: the v3 head; E1: the probe); adjacent intervals with the same label merge (labels written per sample)
  threshold: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]   # the round-2 boundary-segment grid; chosen on the calibration half
  nms_radius: 5
  checkpoint_threshold: 0.5      # step 2 only: decoding for checkpoint selection on the selection half

boundary_only:                   # step 2: projection, the three dilated convolutions and the boundary head of M5
  dim: 128
  dilations: [1, 2, 4]
  dropout: 0.2
  # trained with the boundary loss only: joins where the view class changes are positives, same-class joins are
  # strong negatives, all other transitions weak negatives (0.1); no class loss, attention, gate or pooling

success:                         # unchanged from the round-1 plan
  segment_f1_margin: 0.01        # three-seed mean segment F1@50 at least 1 point above the strongest previous configuration
  recall_min: 0.95               # multi-fragment boundary recall, every seed
  native_floor: "encoder frame-majority native macro-F1 minus 0.005"
  strongest_previous:            # fixed before round 3 from the round-2 report
    selection: "E0 B3 tuned (0.934)"
    calibration: "B7 with B3 on its posteriors (0.972)"

interpretation:
  - "if step 2 is not better than step 1, the gain belongs to the decoding, not to the boundary training"
  - "if the best candidate only matches ASRF and stays below the strongest B3, the M5 route ends; next, study the
     clips that B3 and ASRF both get wrong"
