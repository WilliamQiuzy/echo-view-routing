# Within-view output regularization on the V01 Ordered video model (A08;
# docs/superpowers/plans/2026-10-16-video-within-view-regularization.md). Fixed before any edge mask is counted, any code of
# this round exists or any model is trained. Two new three-seed continuations of each seed's V01 Ordered final state read
# A07's unchanged training manifests (one native group and one change-containing constructed group of four neighbouring
# request centres per update, eight ordinary 16-frame windows) and add a fixed truncated log-probability penalty between
# neighbouring CLS outputs to A07 F's plain cross-entropy: A on every neighbour pair, M only on pairs whose training labels
# are equal. A07's already-trained plain-CE continuations F are reused as the control under their A07 identities; they are
# not retrained, retuned or re-chosen. No parameter, readout, temporal head or decoder is added. Labels serve the losses,
# the masks and the evaluation only. The test split and EchoNet-Pediatric are not read. The penalty is MS-TCN's (coefficient
# 0.15, truncation 16, detached previous output); the label mask and the per-group normalisation are this task's adaptation.
# No novelty is claimed.
#
# Inherits model_development_v2.yaml only for the protocol keys (10 Hz, the 0.5 s boundary tolerance), the two development
# halves and the decoding grid (decode_grids.b3, checked against evaluation.b3 below).
extends: model_development_v2.yaml
run_name: video_within_view_v1
experiment: video_within_view_v1

