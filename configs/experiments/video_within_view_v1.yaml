    environment: {python: 3.12.3, numpy: 2.5.2, pandas: 3.0.5, scipy: 1.18.1, torch: 2.14.0+cu130, torchvision: 0.29.0+cu130, cuda: "13.0", cudnn: 92400,
                  torchvision_mvit_sha256: 76ca465f2be0bb7ff914ca434264ceb6736402856d164e5810491d5ba77d4210}
  arms: [all, masked]
  names: {all: A, masked: M}
  control: {name: F, a07_arm: frame, rule: "A07's frozen plain-CE continuations under their A07 identities, outputs and choices; never retrained, retuned or re-chosen"}
  primary: "M - A"
  model:
    network: "echo_routing.vit.target_mvit.TargetMViT (torchvision MViTv2-S with its 512-d projection, the target-marker stem and the five-class CLS head), built and then strictly loaded with the seed's V01 Ordered final state (never an A07-trained state); no parameter added or reinitialised"
    forward: "the unchanged TargetMViT.forward(rgb, marker) once per update on the eight windows as one batch; the (8, 5) logits are viewed as (2, 4, 5) only for the loss"
    inference: "ordinary single-window CLS logits; no mask, label, boundary, transcript, group or native/mixed flag input"
  data:
    manifests: "A07's runs/video_sequence_objective_v1/manifests/VSO_s{seed}.npz and index.json, pinned above; file, array and epoch digests checked against index.json and A07's preparation record; update u of every run reads row u"
    allowlist: "A07's training allowlist (the protocol's training clips); every manifest recording must be on it before any label or path is used"
    preprocessing: "V01's: numeric frame order, whole-stream context, 16 frames, load_frame_u8 (gamma lookup per recipe fragment, short side 256, centre crop 224), EchoPrime 0-255 mean and std; the loader checks every window's pixel digest against the manifest"
    isolation: "preparation and training read no development frame, label, saved output or array and no test or Pediatric data; same-view joins carry no label change; no recording or session identity is a model input"
  loss:
    module: echo_routing/temporal/losses/within_view.py
    ce: "L_CE = segment_objective.objective('frame', z, [runs of group 0, runs of group 1], ones(5)) of the pinned A05 module: A07 F's value and gradient path, unchanged; no run-balanced or transcript term"
    log_probabilities: "ell = log_softmax(z, dim=-1).to(float64) for the (2, 4, 5) logits z"
    edge_penalty: "d[n, t, c] = clamp((ell[n, t, c] - stop_gradient(ell[n, t-1, c]))**2, min=0, max=16) for the groups n = 0, 1, the edges t = 1, 2, 3 and the classes c"
    all: "S_A = mean_n sum_(t, c) d[n, t, c] / (3 * 5)"
    masked: "m[n, t] = 1{label[n, t] == label[n, t-1]} of the training targets; S_M = mean_n [sum_(t, c) m[n, t] d[n, t, c] / (5 * max(1, sum_t m[n, t]))], the bracket exactly zero when the group has no selected edge; the denominator is clamped before the division, so no zero denominator is evaluated in any branch"
    objective: "L_A = L_CE + 0.15 S_A; L_M = L_CE + 0.15 S_M; F is the stored L_CE baseline; no division by 1.15, learned coefficient, sweep, label smoothing or auxiliary term"
    coefficient: 0.15
    truncation: 16.0
    detach: "the earlier endpoint of every edge is detached, so the penalty has no gradient through it; CE still trains every output; no symmetric KL, reversed direction or negative-distance boundary term"
    normalisation_note: "equal group weights keep the native group's penalty weight the same in A and M and reweight the selected edges inside a mixed group, so M - A tests this mask-and-normalisation rule, not a pure position intervention with equal per-edge weight"
    identities: "M equals A on a group whose four labels are equal; a group with no selected edge contributes exactly zero value and gradient; at coefficient 0 the value and the logit gradient equal L_CE exactly"
    monitor: "every update of both arms logs L_CE, S_A, S_M and, from the same detached logits, the sums and counts of the per-edge class-mean penalties of the equal-label and the different-label edges; no extra forward and no extra random draw"
    repeats: "repeated native centres stay as in A07; their number is disclosed and they are not extra cases"
  training:                      # literally A07's training section (checked by the code before any run); the start state is V01's (model.network)
    seeds: [0, 1, 2]
    total_updates: 3750
    updates_per_epoch: 375
    batch_windows: 8
    optimiser: {name: AdamW, lr_encoder: 1.0e-5, lr_new: 1.0e-4, weight_decay: 1.0e-4, grad_clip: 1.0, betas: [0.9, 0.999], eps: 1.0e-8}
    param_groups: "group 0 = every encoder parameter including the 512-d projection; group 1 = marker stem and classifier; no extra group"
    warmup_updates: 375
    schedule: "new parameters 1e-4 x lr_factor(u, 375, 3750); encoder 0 for u < 375, then 1e-5 x the same factor (V01/A02, unchanged)"
    freeze: "for u < 375 every encoder parameter has requires_grad False and lr 0, with autograd through the encoder to the marker; from u = 375 every encoder parameter trains"
    start: "a fresh optimiser and update count per continuation; strict load of the seed's V01 Ordered final state"
    model_rng: "torch.manual_seed(seed) and torch.cuda.manual_seed_all(seed) before each arm's first update, identical across arms and independent of the manifest RNG"
    checkpoint: "final weights after 3,750 updates; no validation, epoch choice or training-score gate"
    resume: "after every epoch: model, optimiser, update count and CPU and CUDA RNG states; a run continues only under its complete identity, never by directory name"
  determinism: {precision: fp32, tf32: false, cudnn_deterministic: true, cudnn_benchmark: false, dropout_and_stochastic_depth: "kept as in the source",
                deterministic_algorithms: "torch.use_deterministic_algorithms(True, warn_only=True) with CUBLAS_WORKSPACE_CONFIG=:4096:8; V01's recorded max_pool3d_with_indices_backward_cuda nondeterminism applies; bitwise weights are not promised"}
  identity: >-
    SHA256 over this configuration's training sections (task_sheet, source, arms, control, model, data, loss, training,
    determinism, budget), A07's training sections, V01's training sections, the arm, the seed, the source weights, the manifest
    and its epoch digests, the environment, the total updates, and this round's training script and loss module, A07's training
    and preparation scripts, A05's loss module, the model module, V01's trainer and preparation and A01's preparation and
    sequence modules in full, plus the shared frame, path and schedule functions
  preparation: >-
    CPU, after this configuration's commit and before any GPU job: every pin; the manifests' file, array and epoch digests
    against index.json and A07's preparation record; every window's pixel digest recomputed from the allowlisted training
    frames and compared with the manifest's; the edge masks counted per seed and group kind (selected and unselected edges,
    zero-edge groups, mask patterns) and the repeated native targets; descriptive counts that never change the rule
  checks:
    windows: "the 16 windows of updates 0 and 1 of the seed-0 manifest (two native and two constructed groups)"
    source_parity_max_abs: 1.0e-4      # zero-update model against V01's own build of the source state, eval, the 16 windows; argmax equal
    label_isolation: "eval logits of the 16 windows unchanged when the targets, and so the masks, change"
    arm_pairing: "train mode, the same state and RNG: identical logits before the loss and identical CPU and CUDA RNG states after one update across A, M and A07's F update"
    lambda_zero:
      rule: "this round's update at coefficient 0 against A07's original F update (train_video_sequence_objective.train_step, arm frame) from identical states, RNG and optimiser"
      single_update: "identical logits and loss value; parameters within params_abs"
      six_updates: "losses within loss_abs and parameters within params_abs after six updates"
      resume: "3 + 3 at coefficient 0 against A07 F's six updates, within the same tolerances"
      loss_abs: 1.0e-4
      params_abs: 1.0e-5
      note: "a compatible implemented control path; not a bitwise rerun of F"
    pure_identity_tolerance: 1.0e-12   # S_A and S_M of a batch whose two groups are pure, value and logit gradients
    regulariser_gradient: "after unfreezing, 0.15 S of each arm alone gives every encoder parameter (including the 512-d projection), the marker stem and the classifier a finite gradient, non-zero for the projection, conv_proj, the marker stem and the classifier"
    hooks: "the model's forward and backward hook counts are unchanged after every check"
    optimiser_binding: "the two AdamW groups hold exactly the encoder's and the new parameters; the encoder digest is unchanged by warm-up updates"
    smoke: {updates: 100, lr_new: 1.0e-4, encoder: frozen, batches: "updates 0 and 1 of the seed-0 manifest alternately", gate: "finite values, changed marker and classifier, unchanged encoder; curves saved; no fit, score or token gate"}
    reproducibility: {updates: 6, loss_abs: 1.0e-4, params_abs: 1.0e-5}
    resume: {updates: "3 + 3 against 6", loss_abs: 1.0e-4, params_abs: 1.0e-5}
    boundary: {warmup: 3, total: 8, resume_at: 2, adam_step_bound: 2.1,
               rule: "V01's recorded rule: lr of every update, frozen then changing encoder, exact state round-trip, losses within 1e-4, parameter drift within adam_step_bound x each group's summed learning rate; no tolerance raised from observed values"}
    timing: {warmup_updates: 5, timed_updates: 50, state: "encoder unfrozen at the formal learning rates, formal manifest batches with RGB loading, the arm's objective and every monitor term, backward and step; peak memory recorded"}
  budget:
    gpu_hours_max: 6.0
    cpu_hours_max: 3.0
    evaluation_reserve_hours: 1.25   # staged evaluation and fact-check
    overhead_reserve_hours: 0.25
    ledger: runs/video_within_view_v1/ledger.jsonl
    charged: "every GPU job (checks, failed attempts, training, inference, the fact-check's jobs) as GPU hours; preparation, tests, grids, bootstrap, queue overhead and every agent's wall clock as CPU hours"
    launch_rule: "spent (every ledger GPU line, passed or failed) + 3 x A's measured hours per run + 3 x M's + 1.25 + 0.25 <= 6"
    queue_rule: "before every run: spent + every unfinished run at the larger of its arm's measured hours per run and the slowest finished run + 1.25 + 0.25 <= 6; finished runs enter only through the ledger; otherwise nothing new starts, the estimate is saved and no run is shortened, dropped or changed"
  queue: [all_s0, masked_s0, all_s1, masked_s1, all_s2, masked_s2]
  evaluation:
    after: "all six runs finished and frozen with scripts/freeze_model.py; only then are development metadata, frames, labels or saved outputs (V01's or F's) read"
    reader: "A03's half_sets (half_index, meta_stream) for one half at a time and that half's references from the pinned window plans; frames of that half only, decoded with V01's decode_frames; no eager reader of both halves"
    windows: "V01's: window_centres(n, 5), window_frames(c, n, 16, 16), marker_slot, identity slot order; every 10 Hz sample takes its nearest centre's softmax; native clips by per-sample majority"
    parity: "on the calibration half, each seed's frozen V01 source and frozen F re-inferred on the first 64 calibration windows in half order against their saved logits: max |difference| <= 1e-4 and argmax equal"
    f_control: >-
      F's saved per-window outputs of one half are read only in that half's stage: file sha256 and run identity as pinned,
      windows equal to the half's; the per-sample probabilities recomputed from the stored logits must equal the stored ones;
      F's B3 row at its A07 choice, its argmax row and its row at the stored Ordered setting must equal A07's summary rows of
      that half exactly; F keeps its A07 choices and is never re-chosen
    v01_rows: "V01's archived argmax and B3 rows of frozen Ordered reproduced from its saved outputs on each half"
    rows: ["B3 at the model's calibrated setting (the system)", "direct argmax (sensitivity)", "the source Ordered seed's fixed numerical B3 setting (sensitivity)"]
    b3: {grid: {half_window: [5, 7, 9, 11, 15], quantile: [0.80, 0.85, 0.90, 0.95, 0.97, 0.99, 0.995, 0.999], nms_radius: 5}}
    b3_rule: >-
      for each of the six new models, once, on the calibration half: thresholds are quantiles of that model's own calibration
      native B3 scores; among settings with native macro-F1 >= 0.980 and multi boundary recall >= 0.95 the highest multi
      segment F1@50 wins, ties to the earlier grid entry; no feasible setting fails the model (the diagnostic 9 / 0.95 is
      reported and passes nothing); the selection grid is never computed
    fixed_ordered_setting: {half_window: 9, nms_radius: 5, thresholds: {0: 0.29269428317686846, 1: 0.2845063773784935, 2: 0.30845250187026374}}
    barrier: "the calibration stage writes choices.json (the six choices with their grids, F's A07 choices and the provenance with every run and control identity); it is committed and its git-object proof made locally and copied to the server; --selection verifies the sha256, the commit and the proof before any selection metadata, frame, label or saved output is read; the selection half is opened once and every opening is recorded"
    dry_run: "before the commit, the selection pipeline with the calibration half standing in for both halves; a code check, not a result"
    comparisons:
      primary: "M - A"
      mandatory: ["M - F", "A - F", "M - frozen Ordered", "A - frozen Ordered"]
      metric: "multi segment F1@50 of the B3 systems, per seed and half; the same comparisons for the two sensitivities are kept apart and choose nothing"
    bootstrap: "the inherited paired bootstrap: native clips by session, streams by stream (approximate; streams reuse recordings), 2,000 draws, seed 20261002, the same draws for both systems"
    consistent: "all three seeds' 95% intervals strictly exclude zero on the same side within one half; an interval touching zero is not; anything else is no consistent difference detected (not equality); seeds are not extra cases; every comparison is exploratory on repeatedly reused development halves"
    reported: >-
      native, pair and multi populations; TP/FP/FN; recovered and newly lost matched reference segments and extra predictions
      against A, F and frozen Ordered with source recordings and sessions; segments of at most 16 samples and A4C/A5C X-Y-X
      middles with raw denominators; boundary precision/recall/F1, same-view join cuts, native switches, native macro-F1,
      per-class precision and recall and A4C<->A5C fixed and new counts; counts on fewer than 10 sessions flagged and the seeds'
      shared cases noted; the training penalties of equal-label and different-label neighbours shown separately; a smaller
      smoothness loss or fewer switches alone is never a success, and fewer false fragments must not be bought with lost true
      segments
  goal:
    selection_min: 0.944409687184662
    calibration_min: 0.9821421709894332
    calibration_sensitivity: 0.9838935784747763
    boundary_recall_min: 0.95
    native_macro_f1_min: {selection: 0.973, calibration: 0.980}
    rule: "three-seed mean multi segment F1@50 at or above both minimums, and in every seed and half a feasible B3 setting, boundary recall >= 0.95 and native macro-F1 at or above the floor; no rounding; meeting the old targets without beating the stronger frozen reference is not a new winner"
  readings:                      # the task sheet's Task 4, fixed before any output and applied once after the selection evaluation; not exclusive; each lists its halves
    qualifies: "a comparison qualifies when it is consistent positive in at least one half and not consistent negative in the other (multi segment F1@50, B3)"
    floor_failure: "an infeasible calibration decoder, boundary recall below 0.95 or native macro-F1 below the floor of a model in any seed and half"
    full_success: "M - A, M - F and M - frozen Ordered consistent positive in both halves, and M has no floor failure and meets both mean targets; a development-protocol success only"
    mask_specific_signal: "in some half M - A and M - F are both consistent positive, neither is consistent negative in the other half, and M has no floor failure; whether M - frozen Ordered is consistent positive and whether the mean targets hold are stated as limitations; the recipe closes regardless"
    smoothing_only_signal: "in some half A - F and M - F are both consistent positive while M - A is not consistent positive there, neither A - F nor M - F is consistent negative in the other half, and neither A nor M has a floor failure: common regularisation is credited, not the mask"
    release_of_harm_only: "M - A qualifies and M - F does not: recovery from A's damage, never called a practical gain"
