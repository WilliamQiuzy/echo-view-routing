# V1 plain ViT: ViT-S/16 (ImageNet-21k AugReg) fine-tuned on single frames, family5 task, B0's data recipe
# (class-balanced cine draws x 16 spaced frames, gamma edit, class-weighted CE, val cine macro-F1, patience 6).
extends: ../base.yaml
run_name: vit_s_frame
task: family5
vit:
  model: vit_frame
  frames_per_video: 16
  batch_size: 64
  lr: 1.0e-4
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_epochs: 1
  epochs: 30
  patience: 6
  num_workers: 4
  eval_frames_per_video: 16
  extra: {drop_path: 0.1}
