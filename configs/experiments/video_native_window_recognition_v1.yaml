# A29, interval recognition on A08's native request windows with a frozen against an adapted representation
# (video_native_window_recognition_v1), 2026-10-24 UTC. One-page protocol committed before any A29 output. Task sheet:
# claude_prompts/2026-10-24-native-window-recognition-training.md (sha256 97a5f426).
# Question: keeping A08's own 16-frame, 10 Hz request windows and the nearest-centre pooling of their probabilities inside
# each Base run (zero update = Base exactly), does adapting the recognition branch's last block, norm and projection (T)
# classify the runs better than the frozen representation (F), and does that improve full segmentation?
# Predecessors and differences: A27 trained a linear head on these pooled windows with an own-A08 KL (barely moved labels);
# A28 adapted the same modules on a single evenly spaced clip per run (Init already below Base; no adaptation effect);
# A20 hard-window replay, A22 short-support frames and A25 a four-window expected-error surrogate were shared-trunk changes;
# R06 a frozen against last-block span classifier on the E1 image encoder. A29 restores A08's input and readout, drops the KL
# for both arms and isolates representation adaptation as T - F. No new clip rule, sampling, decoder or teacher. Causes of
# A27/A28 are not presumed. Development halves are reused exploratory feedback; the A15 check pool's recordings trained the
# encoder (not a holdout); test and Pediatric are not read.
experiment: video_native_window_recognition_v1

