    sources: "A15 pool (pool manifest 5ab124d4; windows/preds s0 2a6b53ae / 848c4c91, s2 c21becbd / af5a489b) through A27's pins; A13 development caches through A27's pins; A19 check rows through A27's pins"
  arms:
    F: "independent copy of A08 all_s{k}; trains only the copied classifier (2,565 parameters) on the verified A15 / A13 cached 512-d window embeddings"
    T: "the same copy; additionally trains encoder.blocks.15, encoder.norm and encoder.head.1 (7,497,989 trainable with the classifier) through the real request windows; earlier blocks, conv_proj, pos_encoding and marker stem frozen"
    mode: "both arms in eval mode; gradients only on the listed parameters; the original A08 + B3 path never reads updated tensors"
  windows: "A15's request windows exactly: stride-5 targets over the whole stream, 16 frames at 10 Hz, A08's marker, numeric frame order, gamma and preprocessing; samples map to their nearest request centre (no clamping to reference boundaries; short runs keep their mapped windows)"
  intervals: "A27's pinned T (reference runs) and P (seed's Base runs, majority reference label, ties to the smallest class) with their multiplicity weights; A27's 1,350 x (16 T + 16 P) batches"
  objective: "both arms: mean_j -log(sum_t w_jt softmax(z_t)[y_j]) by logsumexp; no KL, no teacher, no relation term"
  prefix_cache: "T only: per seed, the frozen prefix (conv_proj + marker, positional encoding, blocks 0-14) of every training window, fp32, own cache key; verified window by window (cached prefix + original suffix reproduces A15's logits and argmax); one seed at a time, deleted after its training and readout"
  training: "1,350 optimizer updates; AdamW weight decay 1e-4, betas (0.9, 0.999), eps 1e-8; classifier lr 1e-4, T representation lr 1e-5; warm-up 135 then cosine (lr_factor); clip 1 over all trainable parameters; duplicate windows of a batch computed once; final weights only; seeds 0 and 2"
  monitoring: "training data only, fixed before training: all Base-wrong P runs and a fixed sample of 1,000 Base-correct P runs (default_rng([20261024, 29, seed])); CE, true-class margin, fixed / broken at updates 0, 270, 540, 810, 1080 and 1350; split pure / mixed and single / multi recording; final full T / P readout"
  deployment: "original q gives the Base + B3 runs; the arm's per-sample probabilities (same nearest-centre mapping) are averaged inside each run; argmax; equal neighbours merge; complete sequences scored; Init = zero update = Base"
  checks: "configuration first; Base four rows; zero-update F and T logits / probabilities against original q, exact argmax, sample labels, run labels and Base results on the pool and the four cells; window pixels, marker and boundaries; multiplicity, short runs, repeated requests, cross-recording runs, merging; pooled CE against numpy; whole-batch against microbatch-accumulated gradients; T at representation lr 0 equals F; optimizer binding and frozen-component hashes; resume; original q unchanged; timing and budget"
