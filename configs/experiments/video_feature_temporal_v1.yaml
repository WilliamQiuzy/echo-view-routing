                  torchvision_mvit_sha256: 76ca465f2be0bb7ff914ca434264ceb6736402856d164e5810491d5ba77d4210}
    paired_asrf:                 # the paired FACT-ASRF round's ASRF plans and initial states (same 512-d ASRF structure); compared, reused only when identical
