# Frozen video features with matched temporal training (docs/superpowers/plans/2026-10-12-video-feature-temporal-training.md).
# Fixed before any feature of this round exists. The three frozen Ordered context models of the raw-video context round
# give 512-d window features (stride 5, nearest centre to the 10 Hz axis); three heads per seed train on exactly the same
# inputs and batches: a linear class read-out with the change-point decoder, the official MS-TCN and the official ASRF
# (primary candidate). The video weights never change. Existing methods; no architecture is claimed. Labels and joins
# serve the training losses and the report only. The test split and EchoNet-Pediatric are not read.
#
# Inherits model_development_v2.yaml only for the protocol keys (10 Hz, the 0.5 s boundary tolerance), the development
# halves, the recipe settings of the fixed training bank and the decoding grid.
extends: model_development_v2.yaml
run_name: video_feature_temporal_v1
experiment: video_feature_temporal_v1

