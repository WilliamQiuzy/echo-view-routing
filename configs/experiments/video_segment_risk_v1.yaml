# A25, minimum expected segment-error training for the single CLS video model (video_segment_risk_v1), 2026-10-23 UTC.
# One-page task and configuration, written before any A25 preparation, check, training or evaluation output.
# Question: starting from the strong A08 system, does adding a differentiable expected segment-error risk on short groups
# of consecutive training windows -- which charges false short segments (isolated flips inside a true run) more than a
# shifted boundary and protects true short runs -- reduce false short segments without losing true short ones, and raise
# full segmentation, against the identical training without the risk?
# Predecessors and differences: A05/A07 trained run-balanced CE and a no-blank transcript-forward likelihood (sequence
# likelihood over run labels, durations ignored) -- closed; A08 neighbour smoothing towards zero change (all / label-masked)
# and A24's teacher-referenced difference relation -- closed; A10/A13 switch heads, A14-A17 routers, A20 replay, A22 short
# support and A23/A24 donor interventions -- closed. A25 is an expected-cost (minimum Bayes risk) objective whose cost is
# a segment-matching error count (unmatched predicted + unmatched true runs at IoU >= 0.5, the F1@50 rule) over joint
# output patterns of four consecutive windows; it couples the windows, is not a reweighted per-window CE, needs no new
# module, data, teacher or decoder, and does not repair A23. Known approach (expected-loss training); no algorithmic
# contribution is claimed. The check pool is not a new holdout; development halves are reused exploratory feedback;
# test and Pediatric are not read.
