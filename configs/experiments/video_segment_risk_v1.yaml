  arms:
    Seg: "A10 R's recipe exactly (A08 all_s{k} start, A10's pinned 12 windows per update = native, change-containing constructed and same-label join groups of 4 consecutive request windows, CE + KL to the cached own A08, A10's optimiser, schedule, seeds, initialisation and dummy head group) plus lambda * L_seg"
    control: "R = the same recipe with lambda = 0: A10's frozen R_s0/R_s2 (A18's R_s1 for seed 1) reused after a lambda = 0 replay of their logged training; never retrained"
    model: "the unchanged TargetMViT (34,640,549 parameters), one CLS forward per window at deployment; no head, branch, router or decoder change"
  risk:
    group: "each of the 3 groups of 4 consecutive request windows (one sequence, consecutive centres; clip-end repeats kept as positions)"
    pads: "one fixed, correctly predicted position on each side: the true label at the neighbouring request centre (c_first - 5, c_last + 5) of the same sequence when it exists, none at a sequence end; pads carry no gradient"
    cost: "for an output pattern y_hat in {0..4}^4 with the pads: runs of equal class over the padded positions for truth and output; same-class one-to-one matching at IoU >= 0.5 in position units, greedy by IoU (the F1@50 rule); cost = unmatched predicted runs + unmatched true runs"
    term: "L_seg = mean over the 3 groups of E_{y_hat ~ prod_i p_i}[cost(y_hat)] = sum over the 625 patterns of cost * prod_i p_i(y_hat_i), p = softmax(student logits); exact, differentiable through all four windows"
    coefficient: "lambda = 1.0, fixed once; no data-dependent scaling"
    approximations: "independent per-window sampling stands for B3's smoothing, hysteresis and NMS; request windows (0.5 s) stand for samples; groups of 4 plus 2 pads stand for whole sequences; segment labels are run classes, not B3's mean-probability labels"
    labels: "labels define truth runs, pads and groups only; inference reads no label, boundary, source, join or purity input"
  loss: "L = mean CE + mean KL(own A08 || student) + lambda * L_seg"
  training: "Seg_s0, Seg_s2: 1,350 updates, warm-up 135, encoder incl. projection 1e-5 frozen for u < 135 then warm-up/cosine, marker/classifier 1e-4, unused head group kept, weight decay 1e-4, clip 1; torch.manual_seed(seed) and CUDA seed as A10; final weights only"
  checks: "configuration committed before any output; cost recomputed by an independent loop and by echo_routing's segment_f1 on enumerated patterns; small examples (an interior flip costs more than a boundary shift with the same wrong-window count; A-B-A output costs > 0 under A-A-A truth and 0 under A-B-A truth; A24's constant-offset example gives a non-zero risk change); autograd against finite differences; groups and pads legal; lambda = 0 path reproduces A10 R_s0's logged losses over updates 0-136 within 1e-4 (and R_s2's first updates); teacher cached-online parity; optimiser binding, encoder freeze/unfreeze, real gradients; 3 + 3 resume against 6; L_seg size and gradient norm against CE + KL disclosed; timing and budget with evaluation and seed 1 reserved"
  evaluation:
    primary: "Seg@A08 and the control R@A08 at each seed's committed A08 B3 numeric setting"
    comparisons: "Seg - R (the risk term); Seg - Base; R - Base (the common continuation); Seg against A14 P (seeds 0/2) and A20 H@A08"
    sensitivity: "one own-calibration choice per new model (standard 40 settings) and argmax; R's own committed choice as its sensitivity row; final weights sha and all choices committed (git object checked) before selection or the check pool is read; never used for promotion"
    check_pool: "A15's 600 multi + 200 native once after the commits; A08 and R from A19's pinned pool logits and rows"
    rows: "multi segment F1@50, native macro-F1, both A4C/A5C directions, boundary recall/precision, FP / short FP, FN / missed short true, recovered / lost matched segments; window groups and A24's fixed flip diagnostics (new pure flips, wrong windows within 8 samples of a true change and farther)"
  promotion_rule:
    applies_to: "Seg@A08 against each seed's A08 + B3 over the 4 cells"
    signal: "mean dF >= +0.003"
    no_reversal: "each half's two-seed mean >= -0.005 and no cell < -0.015"
    no_harm: "mean native macro-F1 difference >= -0.003, mean boundary recall difference >= -0.010, missed short true segments <= Base's + 3"
    feasibility: "each seed's primary calibration row meets native >= 0.980 and multi boundary recall >= 0.95"
    decision: "if met, Seg_s1 by the same recipe (control A18 R_s1 reused), its choices committed before its selection; otherwise A25 closes with two seeds and no coefficient, cost, group, data, input, teacher or schedule variant"
    reading: "a mechanism gain needs Seg - R evidence that removes short false segments without a matching loss of true or short true segments; fewer cuts alone is not success"
