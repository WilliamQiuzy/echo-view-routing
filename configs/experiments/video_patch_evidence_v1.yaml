# A39 (video_patch_evidence_v1), 2026-10-27 UTC: projected non-CLS token channel max (P) against channel mean (G) as the
# auxiliary input of a zero-output residual head on the frozen A08's original request windows. One matched screen.
# Committed before any new token statistic, model forward or training. Task sheet:
# claude_prompts/2026-10-26-local-token-a5c-evidence.md (sha256 2066f26637a1fd2416f6f3c91f7dc4e3c50f24af48b5fb2591c8e12c651160a8).
# Question: on the same final non-CLS tokens of the unchanged A08 forward, does the per-channel maximum of the projected
# tokens (P) give transferable A5C recognition evidence that the per-channel mean (G) does not, while the complete A08 + B3
# system does not get worse? Exploratory and falsifiable; it is not known that the tokens carry LVOT information. The final
# tokens have interacted with each other and with CLS, and different channel maxima can come from different times /
# positions: nothing here is a structure location, cardiac phase or expert evidence. The projection was trained for CLS.
# No development / check / test / Pediatric reading; source seed 2 only by the rule below.
