  metadata:
    adapter: >-
      per development half, only that half's protocol entries (clips and pair/multi recipes) are used; the clip index is
      read as video_id, split and n_samples first, and label_index is parsed only for the half's own clips; per-sample
      frame references come from the pinned window plans of the half's sequences; streams take their labels, joins and
      semantic boundaries from their recipes; no feature, probability, training label, other split's label, test or
      Pediatric file is read; validation(), Inputs and A02's evaluate entry are not used
    order: "native clips in protocol order, then pair streams, then multi streams (A02's order); the saved sequence ids must equal it"
    windows: "window_centres(n, 5), window_frames(c, n, 16, 16) and the marker at the middle target slot; every window's seq, centre and marker must equal the saved ones"
    calibrate_reads: [calibration]
    selection_reads: [calibration, selection]
  arms: [center_only, aligned_dense, shuffled_dense]
  names: {center_only: CLS-only token readout, aligned_dense: Aligned token readout, shuffled_dense: Shuffled token readout}
  cls_names: {center_only: CLS-only CLS, aligned_dense: Aligned CLS, shuffled_dense: Shuffled CLS}
  primary: aligned_dense
  selector:
    anchors: [0, 2, 4, 6, 8, 10, 12, 14]
    rule: "the unique j minimising (|s[a[j]] - c|, |a[j] - m|, j); only the window's sample positions s, request c and marker m enter; a window whose s[m] != c stops the round"
    readout: "time_logits[i, j_i, :] -> five-class softmax (A02's helper) -> nearest-centre to the 10 Hz axis; the prediction stays at the request c"
    forbidden: ["labels, confidence, attention, sensitivity, native or mixed flags or any score in the choice", "anchors 2j + 1", "interpolation, averaging tokens or windows, CLS fusion, temperature or threshold calibrators", "another anchor rule or arm picking"]
    report: "per window the anchor offset s[a[j]] - c and whether the anchor's reference label differs from c's; exact (offset 0) and non-exact windows all stay in the main evaluation"
  systems:
    token: "the three arms' token readouts; B3 chosen once per seed on calibration from the 40-setting grid (A02's rule), committed before selection"
    cls: "the three arms' A02 CLS outputs with A02's stored B3 settings (reproduced exactly, never chosen again)"
    ordered: "V01's frozen Ordered + change-point with its stored settings (reproduced exactly)"
    stored_rows: "E0/E1/B7 + B3, historical E1 + ASRF, paired ASRF, Original FACT, historical Continued CLS and A01's Linear + B3, MS-TCN and ASRF are listed from A02's summary; not recomputed"
    sensitivity: ["direct argmax", "token probabilities decoded with the same seed and arm's A02 CLS numeric B3 setting (a fixed working point; never selects)"]
  b3:
    grid: {half_window: [5, 7, 9, 11, 15], quantile: [0.80, 0.85, 0.90, 0.95, 0.97, 0.99, 0.995, 0.999], nms_radius: 5}
    rule: >-
      once per token system on calibration: thresholds are quantiles of its own calibration native B3 scores; among
      settings with native macro-F1 >= 0.980 and multi boundary recall >= 0.95 the highest segment F1@50, exact ties to
      the earlier grid entry; no feasible setting fails the system (the 9 / 0.95 diagnostic never passes); the choices
      and their identity are committed before any selection metric of a token system exists; selection applies them once
  comparisons:
    primary: "Aligned token - Aligned CLS, multi segment F1@50 with B3, per seed and half"
    also: ["Aligned token - frozen Ordered + B3", "Aligned token - CLS-only token", "Aligned token - Shuffled token", "CLS-only token - CLS-only CLS", "Shuffled token - Shuffled CLS"]
    bootstrap: "existing paired bootstrap: native clips by session, streams by stream (approximate; development halves reused); 2,000 draws, seed 20261002"
    consistent: "all three seeds' 95% intervals strictly exclude zero on the same side in a half; anything else is no consistent difference detected (not equality); seeds are not extra cases"
    classification: >-
      the same windows and requests: each token readout against its own arm's CLS on native windows, all mixed windows,
      8 of 16, 9-11 of 16, A4C/A5C pair windows, exact and non-exact anchors; all mixed windows use the target-session
      bootstrap (primary) with the stream bootstrap as the sensitivity; a consistent opposite stream verdict makes that
      half's classification reading uncertain; only all-mixed enters the readings, the rest is described
  goal:
    selection_min: 0.944409687184662
    calibration_min: 0.9821421709894332
    calibration_sensitivity: 0.9838935784747763
    boundary_recall_min: 0.95
    native_macro_f1_min: {selection: 0.973, calibration: 0.980}
    rule: "three-seed means at or above both minimums, and in every seed and half a feasible B3 setting, boundary recall >= 0.95 and native macro-F1 at or above the floor; no rounding"
  decision_rules:                # the task sheet's readings, applied once after the selection run; conditions fixed before any new metric
    complete_progress: >-
      Aligned token - Aligned CLS, - frozen Ordered + B3, - CLS-only token and - Shuffled token are all consistent
      positive in multi segment F1@50 in both halves, and the aligned token system meets the goal and every constraint
      -> 'this recipe exceeds these systems'; beating only the unsupervised or shuffled controls is not progress
    useful_readout: >-
      Aligned token - Aligned CLS is consistent positive in all-mixed same-target classification accuracy (session
      bootstrap) in both halves and in multi segment F1@50 in both halves, and the aligned token system meets every
      constraint -> 'the direct token readout has a usable gain'; the old goal and the strong reference are reported apart
    labels_learned_no_usable_gain: >-
      neither of the above -> the facts are reported as local, uncertain or no gain, and this configuration ends;
      classification gains without segment gains, native or recall losses and one-half results are stated separately; an
      interval containing zero is not equality and does not show that every token method fails
    end: "no added training, loss, anchor rule, fusion, probability rule or threshold search; a next step needs a new question and task"
    several: "the readings are not exclusive; every one that applies is reported"
  budget:
    cpu_wall_hours_max: 2.0      # every CPU stage, failed attempts included
    gpu_hours_max: 0.25          # an optional fixed spot-check of at most 24 windows (8 per seed: 4 native, 4 multi, by window order)
    ledger: runs/trained_token_readout_v1/ledger.jsonl
  outputs:
    root: runs/trained_token_readout_v1
    results_dir: docs/results/2026-10-14_trained_token_readout
