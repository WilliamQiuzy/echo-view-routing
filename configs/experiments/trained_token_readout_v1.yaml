# Frozen trained time-token readout (docs/superpowers/plans/2026-10-14-trained-token-readout.md). Fixed before any code
# or new metric of this round exists. Nothing is trained: the nine frozen A02 models' saved per-window outputs are read.
# Each window keeps its request c and its Sparse input; a fixed position rule picks one of the 8 trained time anchors, and
# that anchor's saved time logits replace the CLS logits as the window's prediction at c. Probabilities, the nearest-centre
# mapping and B3 are A02's. Compared with the same weights' CLS output, the same token readout of the two other A02 arms,
# and the frozen Ordered + change-point reference. No parameter, fusion, interpolation, calibration layer or new request.
#
# Inherits model_development_v2.yaml only for the protocol keys, the development halves and the decoding grid.
