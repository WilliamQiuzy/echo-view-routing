# Model development round 1 (docs/superpowers/plans/2026-10-02-model-development.md).
# Fixed before any candidate is trained or scored. Candidate selection and calibration use the validation split only.
extends: ../base.yaml
run_name: model_development_v1

protocol:
  version: model_development_v1
  seed: 20261002                 # session-level split of validation into selection / calibration halves
  max_attempts: 50               # reseed (seed + attempt) until both halves contain all five families
  hz: 10.0
  mapping_version: family5_v1
  # validation banks are rebuilt inside each half from that half's sessions only
  half_recipe_seed: {selection: 31001, calibration: 31002}

selection:
  # checkpoint selection (selection half) and decoding-parameter selection (calibration half)
  native_f1_tolerance: 0.005     # native clip macro-F1 at most 0.5 points below the encoder's frame-majority baseline
  tie_margin: 0.002              # segment F1@50 differences below 0.2 points are ties -> fewer native internal cuts wins
  boundary_recall_min: 0.95      # multi-fragment boundary recall at 0.5 s (calibration rule)
  primary: segment_f1_50_multi
  native_vote: majority          # clip label = majority of per-sample decoded labels
  boundary_tolerance_s: 0.5

metrics:                         # output format fixed in advance (Task 1)
  - native_macro_f1
  - native_per_class_recall
  - native_confusion
  - segment_f1_50_multi
  - boundary_f1_multi
  - boundary_recall_multi
  - segment_f1_50_pairs          # secondary only
  - native_internal_cuts_per_clip
  - native_internal_cuts_per_min
  - same_class_cut_rate_multi
  - parameters
  - peak_gpu_memory_mb
  - system_latency_ms_per_sample

decode_grids:                    # simple baselines, tuned on the calibration half with the selection rule above
  b1: {window: [3, 5, 9, 15, 21], min_run: [1, 3, 5, 9, 15]}
  b2: {stay: [0.9, 0.95, 0.98, 0.99, 0.995, 0.999]}
  b3: {half_window: [5, 7, 9, 11, 15], threshold_quantile: [0.80, 0.85, 0.90, 0.95, 0.97, 0.99, 0.995, 0.999], nms_radius: [5]}

temporal_training:               # shared by M0-M4 (same data, same optimizer-update budget, same selection rule)
  seed: 0
  lr: 0.0003
  lr_retry: 0.001                # at most one extra learning rate per row, every trial reported
  weight_decay: 0.0001
  batch_size: 8
  grad_clip: 1.0
  warmup_epochs: 2
  max_epochs: 50
  patience: 8
  native_window: 256             # samples; long clips are windowed uniformly
  native_per_epoch: 1500         # equal to the number of training streams
