# A41 (video_echojepa_recognition_v1), 2026-10-27 UTC: a new recognition branch from an external large-scale echo
# latent-prediction representation (EchoJEPA ViT-L, E) against the same architecture with the generic V-JEPA 2
# initialisation (G); identical QKV LoRA adaptation, target / global readout, batches and schedule. One matched comparison.
# Committed before any checkpoint download, weight statistic, forward or training. Task sheet:
# claude_prompts/2026-10-27-echojepa-a5c-recognition.md (sha256 ccc3836cf2f801b9ad943c0950884e1d9c005dadc73a84e3a06ad166e243a33e).
# Question: does the EchoJEPA initialisation, under one fixed LoRA recipe, give a transferable A5C correction over the generic
# initialisation while keeping correct A4C / A5C and the complete segmentation? The contrast isolates the two named pretrained
# states under this recipe; it cannot separate pretraining data volume, schedule, domain or other upstream conditions and is
# not evidence of JEPA-algorithm superiority. Against A08, backbone, pretraining and parameter count all differ at once.
# Labels are EV9V clip codes, not LVOT visibility or expert truth. No development / check / test / Pediatric reading.
experiment: video_echojepa_recognition_v1

echojepa_recognition:
  id: A41
  type: matched_training_comparison
  predecessors: "A31 (docs/results/2026-10-24_session_correction: last-block adaptation and error emphasis, no held-out session net gain), A34 (docs/results/2026-10-25_native_bag_evidence: whole-native power-mean head on frozen A08 features; S1 0), A39 (docs/results/2026-10-26_local_token_a5c_evidence: frozen A08 final-token max / mean; S1 0 / 103), A40 (docs/results/2026-10-27_masked_feature_recognition: masked-HOG auxiliary in full-encoder A08 continuation; H - R 0 in every reported aggregate, S1 1 / 103; closed at source 0)"
  changed_condition: "the source and backbone of the recognition representation: a ViT-L pretrained by latent prediction on large-scale echo video (EchoJEPA), adapted with cross-layer attention LoRA and a new recogniser, against the same code / architecture / adaptation from the generic V-JEPA 2 ViT-L. Not an external five-class probability swap, teacher vote, extra A08 loss or another frozen descriptor; no A40 / HOG / DINO / MIL variant"
  sources:
    code: "https://github.com/bowang-lab/EchoJEPA commit 77208e1a8521c0e82f79579eebe4b22f46c5ccbd (2026-06-18); server clone third_party/EchoJEPA (never edited); every loaded upstream module file must sit in that clone and equal the pinned commit's git blob, the clone clean. Upstream file headers state MIT (Meta); the README names three Apache-2.0 files and the repository carries APACHE-LICENSE; provenance and licence notes kept. Only src.models.vision_transformer / src.models.utils.{modules, patch_embed, pos_embs} / src.masks.utils / src.utils.tensors are needed; the `src` package must resolve to this clone only (no other third_party `src`)"
    E: "EchoJEPA vitl-vmix22m-pt220-c55.pt (README: ViT-L initialised from V-JEPA 2 VM22M, then echo pretraining; about 4.8 GB), public Google Drive file id 1T_ubAMpDMEByH7V6TJu9iT5Yf9IxlDBB from the README folder https://drive.google.com/drive/folders/1RFEXMe8TTcABMBz4H_qtiLB43K9jD_lf"
    G: "generic V-JEPA 2 ViT-L https://dl.fbaipublicfiles.com/vjepa2/vitl.pt (src/hub/backbones.py; Codex HEAD 200, 5,127,726,842 bytes). Not a random model, not EchoPrime"
    acquisition: "downloaded on the server from these public endpoints only, after this configuration is committed; recorded: bytes, full sha256, URL / HTTP status / final URL, time, upstream commit. No account, new data agreement, training-media download (MIMIC or other) or EV9V upload"
    extraction: "checkpoint['target_encoder'] for both files; key normalisation only strips leading 'module.' / 'backbone.' prefixes; the only key that may be dropped is an explicitly unused legacy 'pos_embed' (RoPE model has pos_embed None), recorded; then load_state_dict(strict=True) on the common encoder: every effective parameter / buffer present with equal shape, no extra key, no random fill (the official loaders' fallback of replacing missing / mismatched entries with the model's own initial state is not used). Missing key, architecture or shape mismatch: engineering stop with evidence, no other checkpoint / key / model. Stored encoders: FP32 state dicts checkpoints/a41_jepa/encoder_{E,G}.pt with sha256; source dtype recorded. After the sha256 / manifest is recorded the regenerable full downloaded checkpoints may be deleted; no older asset is touched"
    pretraining_overlap: "the exact pretraining sample lists are unknown; overlap with EV9V is unknown and is never claimed absent. This does not block the training-source screen; Unity stays evaluation-only and the expert record stays 0, neither used for training"
  data:
    pools: "A31 fold pools runs/video_session_correction_v1/pool_{0,1}.npy (sha256 96d1fb683e1a261d5be9a3cc7ec393637577bbf83b56140cec41f544c4f3b486 / 08255192dae3a90644ea062880bf6b2b298181ed12e9890d56ca04630f5adef4); split.json e03100941d77e1fe64a825e4f2a4f7ef038a5725bcf943a55db15a983ef29d6d (sessions / recordings / window identities shared 0); inherited through A40's configuration and re-verified, no re-split or new streams"
    requests: "A31's pool_W order: stride-5 centres c of the complete sequences, S = window_frames(c, N, 16, 16) (16 samples, 10 Hz, about 1.5 s), marker slot m = marker_slot(S, c), A08 frame rule (numerically ordered JPEG, RGB, gamma LUT rounded to 6 decimals, short side 256 then centre crop 224, uint8), nearest-centre output map; identical for E / G, training and readout (no time support, density, field of view or predicted-run change)"
    jepa_input: "clean uint8 [B, 16, 224, 224, 3] / 255, (x - (0.485, 0.456, 0.406)) / (0.229, 0.224, 0.225) per channel in FP32, then [B, 3, 16, 224, 224]. The marker slot is used only by the readout; no marker stem, true label or interval boundary enters the encoder"
    base_outputs: "A31 outputs_s{s}_f{f}.npz (q, e224): s0 5884435770e8b65959b22ff77f74b0c2053cadf7fd2a5a28c842104df2f1a512 / 0a99be35b0cd78d650f5014c8ddc783173e6fb849ee556d6fa2a52c73f33d360; s2 5e8042a75e7c38d2f8345c3c3bbf357039efeed530f8758a1a7c7838fe5507fb / 2b1f1e13dce2a769f4091745e531bb998bc122b58cd5f3c09d2c364d904f4a33"
    base_runs: "A31 data/runs_s{s}_f{f}.npz (P runs, base_labels): s0 7b28ac6c224f594ef7bf49d6307186807d91bd8577dbc192e8cece07bea7452c / 98ce5c572aa29576a098685c1d28220684e755cbea537b6739020c0387ddc026; s2 91d04d4f255b7e892343b102c736f1b69c8126a69f2e0df1f5c23f1c60d8860f / ef76e587a0db2c7b18dcbdaee5631497963ad8eb9988a929e4526d5949259ef9. The frozen A08 (all_s0 9b144925..., all_s2 f95fed7b... only if the rule triggers) + B3 keeps supplying Base and its runs; no A08 feature or probability is an input or teacher of the new branch"
    fit_only: "fit fold f trains only on pool f; the opposite fold's pixels / labels are used by no update, check or selection; held-out pool 1 - f is read once, by the frozen models' readout"
    not_read: "development / check / test / EchoNet-Pediatric; the A26 runner; S1 / harm sets for any training exposure"
  model:
    encoder: "pinned src.models.vision_transformer.vit_large(img_size=(224, 224), num_frames=16, patch_size=16, tubelet_size=2, use_rope=True, uniform_power=True, use_sdpa=True, use_activation_checkpointing=True, use_silu=False, wide_silu=True): 24 blocks, 1024-d, 16 heads, MLP ratio 4, LayerNorm eps 1e-6, no extra dropout / stochastic depth / augmentation. Under use_rope the pinned code sets pos_embed None, so uniform_power (sincos init only) has no effect. Output: final-norm non-CLS tokens [B, 1568, 1024] (8 x 14 x 14). E and G differ only in the loaded pretrained state"
    lora: "each of the 24 fused attn.qkv Linear(1024, 3072) wrapped as W x + b + (alpha / r) B (A x), r 8, alpha 16 (scale 2), no LoRA bias or dropout; A [8, 1024] N(0, 0.02^2), B [3072, 8] zeros; W, b frozen. Attention math, RoPE, proj, MLP and norms untouched. 24 x 32,768 = 786,432 LoRA parameters"
    readout: "tokens [B, 1568, 1024] reshaped time-major [B, 8, 196, 1024]; e_target = tokens[:, floor(m / 2)].mean(spatial); e_global = tokens.mean(time, spatial); Linear(2048, 5) on concat(e_target, e_global) (10,245 parameters; weight N(0, 0.02^2), bias 0). A time-aligned summary of the target, not a claim of anatomical localisation"
    trainable: "exactly the 24 LoRA pairs + the head = 796,677 parameters, counted independently after construction; every base parameter requires_grad False and its digest constant; the base is frozen but the forward is never wrapped in no_grad"
    init: "one local torch.Generator seeded 2026102741 + 10 s + f draws, in order, blocks 0..23 A then the head weight; B and head bias 0. Bit-identical for E and G; does not consume or disturb the model RNG. Init is not A08 and need not equal Base; zero-LoRA encoders must match their own official forward"
  batch:
    windows: "8 per update: 4 adjacent request centres of one native sequence, then 4 adjacent request centres of one constructed stream whose 4 centre labels contain a change (A07's group_indices / eligible_starts; a short native repeats its last centre); fit pool only, pool_W centres. Exposure denominators (labels, sequences, streams) recorded"
    draw: "rng = numpy default_rng([20261027, 41, s, f, update, 1]); in order: native sequence uniformly, its start uniformly, eligible constructed stream uniformly, its eligible start uniformly. Uniform: no S1 / error list / class emphasis. No eligible group: engineering stop"
    loss: "per update, windows in draw order, microbatch 1: CE(window) / 8 backward each (accumulated), then one global clip 1.0 over the 796,677 trainable parameters and one optimiser step. No KL, HOG, contrastive / relation term or pseudo label"
  optimisation:
    updates: 900
    optimizer: "AdamW betas (0.9, 0.999), eps 1e-8, weight decay 1e-4; groups: LoRA lr 1e-4, head lr 1e-3"
    schedule: "linear warm-up over 90 updates, then cosine to update 900 (echo_routing.temporal.dev_train.lr_factor); final weights after update 900, no epoch selection"
    numerics: "base stored FP32; encoder (incl. LoRA) under torch.autocast(cuda, bfloat16); head, logits and CE in FP32; TF32 off; official SDPA path unchanged (no result-driven numeric or attention substitution); activation checkpointing as in the pinned code (use_reentrant=False); cudnn deterministic, benchmark False; use_deterministic_algorithms(True, warn_only=False), so the same official SDPA flash / memory-efficient kernels run their deterministic backward. Amended before any training after check attempt 1: under warn_only=True two identical BF16 backward passes differed (LoRA B up to 6.5% of its group maximum) and the 6-update repeat / 3 + 3 resume / forced E = G exceeded the fixed limits; with warn_only=False they were bitwise equal (runs/.../diagnose_numerics.json). Limits unchanged"
    model_rng: "torch.manual_seed(2026102741 + 10 s + f) (CPU and CUDA) immediately before update 0 in both arms; no stochastic layer is active"
    order: "per fit fold G then E; source 0's four models before anything else"
    repeat_resume_limits: "fixed before the checks: 6-update repeat, 3 + 3 resume against 6, and forced E = G (same base state through both arm paths) within loss max abs <= 1e-3 and trainable-parameter max abs <= 1e-4; a failure is investigated, never relaxed"
    resume: "at most one active resume file per running model (LoRA / head, optimiser, CPU / CUDA RNG, update), written every 100 updates, deleted after the final is verified. Progress / loss logged every 100 updates"
    saved: "final LoRA + head state only (plus metadata); loading binds the arm's base encoder sha256"
  models: "per source seed: G_f0, E_f0, G_f1, E_f1; their adapter / head sha256, base sha256, code and input identities committed and the git objects verified before that seed's single opposite-fold readout (fit f -> read 1 - f)"
  deployment: "the original Base P runs (frozen A08 + B3 cuts); each run takes the argmax of the multiplicity-weighted mean of the new model's softmax over its windows; equal neighbours merge (RLE); complete sequences scored with the A31 / A39 / A40 evaluator, no B3 / temperature / threshold / routing retune. The new branch is a second (ViT-L) forward per window besides Base's; its cost is measured. Per-window held-out logits and per-run labels of E / G may be kept as a private server cache (no pixels / tokens) with sha256"
  checks:
    source: "upstream clone at the pinned commit and clean; loaded src.* modules are clone files equal to the pinned blobs and no other `src`; download bytes / sha256; strict encoder key / shape coverage with the dropped-key list; both encoders 24 blocks / 1024 / 16 heads / 1568 tokens"
    parity: "zero-LoRA wrapped encoder against the separately built unwrapped official encoder on the same state and fit windows: BF16 autocast token max abs <= 1e-3 and identical head argmax; FP32 small fit sample token max abs <= 1e-4"
    formula: "with a check-only nonzero A / B, the wrapped qkv equals an independent W x + b + 2 B (A x) in FP32 (max abs <= 1e-5 x max(1, |out|max)); identical A / B / head initialisations across arms"
    tokens: "patch-embed output equals conv3d.flatten(2).transpose(1, 2) (time-major T, H, W); [B, 8, 196, 1024] grid and e_target index floor(m / 2) equal an explicit loop; readout never sees labels"
    gradients: "check-only nonzero B: batch coupling is tested in FP64 (math SDPA) on 2 fit windows, microbatch-1 accumulation of CE / 2 against the batch CE gradient (max abs <= 1e-8 x grad max); the FP32 and BF16 8-window comparisons are recorded with cosine similarity. Amended before any training after check attempt 1: the FP32 8-window gate (<= 1e-4 x grad max) failed at 9.3e-3 x (cosine 0.99998) with the forward itself batch-size dependent under math / efficient / default SDPA alike; an FP64 diagnostic gave batch vs single 2.7e-10 x grad max (no coupling) while FP32 single-window tokens differ from FP64 by up to 0.13 (round-off amplified through the encoder). Activation checkpointing on / off gradients equal in FP32 (<= 1e-5 x grad max), BF16 recorded. From the real zero-B start the first A gradient may be 0 and B's is nonzero; after 6 real updates A and B moved"
    training: "optimiser binds exactly the 796,677 intended parameters; base digest unchanged after updates; real step count; forced E = G, 6-update repeat and 3 + 3 resume (LoRA / head, optimiser, all RNG) within the fixed limits; fold isolation; Base reproduction from A31's cache on every P run, sequence and A32 Base row; loaded modules equal the committed code and the pinned upstream blobs; throughput / peak memory of real 8-window updates and of the online forward on fit-fold training data before launch. Checks never read a held-out output; tolerances are not changed after any held-out output"
  readouts: "per held-out fold and OOF for Base / G / E: fixed / broken / net runs and both A4C / A5C directions; recall and confusion of all true-A5C / A4C runs; A32 S1 recovered; Base-correct A5C and A4C kept; S1-fixed A5C-coded source recordings, sessions and reuse with the S1 denominators (a run counts only its A5C-coded sources); complete multi segment F1@50, native macro-F1, boundary P / R, FP / short FP, FN / missed short true, deleted Base boundaries; E - G, E - Base, G - Base; fit-only training monitors (CE, gradients, LoRA movement); measured cost. Session intervals are descriptive, not patient- or stream-independent"
  seed2_rule:
    target: "S1 recovered (E) - S1 recovered (G) >= +1 in each held-out fold and >= +5 over both folds"
    signal: "E recovers >= ceil(0.10 x S1 runs over both folds) (source 0: 11 of 103), from >= 3 distinct A5C-coded source recordings over both folds and >= 1 in each held-out fold"
    retain: "E keeps >= ceil(0.98 x Base-correct A5C runs) correct A5C (source 0: 1,127 of 1,150) and >= G's kept - 3; E keeps >= ceil(0.98 x Base-correct A4C runs) correct A4C (source 0: 1,385 of 1,413) and >= G's kept - 3 (over both folds)"
    net: "in each fold: E - Base net fixed >= 0 and E - G net fixed >= 0"
    system: "in each fold: segment F1 (E - Base) >= 0, segment F1 (E - G) >= 0, native macro-F1 (E - Base) >= -0.003, boundary recall (E - Base) >= -0.005; missed short true over both folds <= Base + 3"
    action: "all met at source 0: source 2 with the same recipe and budget (new LoRA / head init and batch seeds via s = 2, the same E / G bases, Base from A08 all_s2 with its own q / runs / S1 denominators), four models, freeze and one readout, reported for whether the rule repeats; otherwise only these two initialisations + this LoRA / target-global readout / schedule configuration close at source 0. Even if met: no full fit, development / check / test / Pediatric evaluation or third seed; no rank / lr / head / pooling / input / model variant. A31's folds are not an independent holdout for the whole system and pretraining overlap is unknown; A08 + B3 stays the working reference"
  scope: "a result covers only these two pretrained states under this LoRA r8 QKV / target-global head / 900-update recipe; no consistent difference is not equivalence, and neither outcome speaks for JEPA in general, other foundations or full fine-tuning"
  budget:
    gpu_hours_max: 8.0
    cpu_hours_max: 4.0
    new_disk_gb_max: 20.0
    min_free_disk_gb: 15
    launch_gate: "before formal training: spent + all pending source-0 work (4 x 900 updates at the measured real 8-window rate, the readout at the measured online forward rate) + 0.75 GPU h reserve <= 8.0; re-projected before source 2. An overrun is an engineering stop; 900 updates, the batch and the scientific conditions are never cut to fit"
    accounting: "GPU = GPU job wall time; CPU = active agent / external CPU worker wall time (waiting excluded, GPU loader time not counted again); download network time booked separately (kind network), never as GPU; Codex's two read-only helpers are disclosed as outside this ledger; every failure booked; older ledgers read only; the closing active span appended"
    storage: "downloads and extracted encoders under checkpoints/a41_jepa/; no pixel / token / feature cache; final LoRA / head and small logs; one active resume per running model; only this round's regenerable files may be deleted"
    ledger: runs/video_echojepa_recognition_v1/ledger.jsonl
  outputs:
    root: runs/video_echojepa_recognition_v1
    results_dir: docs/results/2026-10-27_echojepa_recognition
    coordination: runs/video_echojepa_recognition_v1/coordination.json
    sources_dir: checkpoints/a41_jepa
