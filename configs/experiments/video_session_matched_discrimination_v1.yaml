# A42 (video_session_matched_discrimination_v1), 2026-10-27 UTC: same-session opposite-class A4C / A5C margin ranking in a
# full A08 continuation, against cyclic cross-session rewiring of exactly the same endpoint windows. One matched comparison.
# Committed before any pool, pair-bank, pixel, loss or model computation (only an 8 s random-tensor engineering probe ran,
# see numerics). Task sheet: claude_prompts/2026-10-27-session-matched-a5c-training.md
# (sha256 5aca348980428c78c9974b1801f939d73a250da0d0635dbdb3be2150584a5960).
# Question: does comparing A4C and A5C from the same recording session during training give more transferable A5C
# corrections than identical training windows whose A4C / A5C pairs are rewired across sessions? Hypothesis, not a
# finding: a same-session pair may focus the supervision on differences between similar acquisitions. A session is not a
# verified patient or acquisition-geometry match; clip codes are weak reference labels, not LVOT visibility or expert truth.
# No development / check / test / Pediatric reading; source seed 2 only by the rule below.
experiment: video_session_matched_discrimination_v1

session_matched:
  id: A42
  type: matched_training_comparison
  predecessors: "A31 (docs/results/2026-10-24_session_correction: A08 last-block / head correction with error emphasis mostly moves the A4C / A5C boundary; no held-out net gain; source of the two session folds), A09 / A09-R1 (docs/results/2026-10-18_video_discriminative, _r1: cross-session same-class supervised contrast on V01 Ordered global embeddings; closed), R08 (docs/results/2026-10-04_training_library: fitted E1 clip embeddings cluster by view, not session, in sample; C0 / C1 not trained; no session shortcut shown), A34 (docs/results/2026-10-25_native_bag_evidence: whole-native bag heads; S1 recovered 0; closed), A39 (docs/results/2026-10-26_local_token_a5c_evidence: frozen final-token residual heads, S1 0 / 103; closed), A40 (docs/results/2026-10-27_masked_feature_recognition: full A08 continuation, 900 updates of A07's 8-window batch, CE + masked HOG; H - R 0 in every aggregate, S1 1 / 103; closed; this round reuses its batch rules, optimiser and readout), A41 (docs/results/2026-10-27_echojepa_recognition: EchoJEPA / V-JEPA 2 LoRA branches; E fixed 12 / 103 S1 but broke 220 correct runs incl. 168 A5C; closed)"
  changed_condition: "only the association of the 4 A4C / A5C endpoint windows inside a pairwise margin-ranking term: S pairs each A5C window with the A4C window of the same recording session, C pairs it cyclically with the A4C window of another chosen session. Images, labels, CE, exposure and computation are identical. Not A09's SupCon (cross-session same-class positives on global embeddings), not a frozen local readout, not A41 LoRA, not error-priority sampling, not a new anatomical label"
  data:
    pools: "A31 fold pools runs/video_session_correction_v1/pool_{0,1}.npy (sha256 96d1fb683e1a261d5be9a3cc7ec393637577bbf83b56140cec41f544c4f3b486 / 08255192dae3a90644ea062880bf6b2b298181ed12e9890d56ca04630f5adef4); split.json e03100941d77e1fe64a825e4f2a4f7ef038a5725bcf943a55db15a983ef29d6d (sessions / recordings / window identities shared 0); all re-verified. No resplit and no new stream generation"
    requests: "A31's pool_W order: stride-5 centres c of the complete sequences, S = window_frames(c, N, 16, 16) (A08's 16 samples, 10 Hz, about 1.5 s), marker = marker_slot(S, c), A08 pixels / 224 crop / gamma / normalisation, nearest-centre output map; unchanged for training and readout"
    base_outputs: "A31 outputs_s{s}_f{f}.npz (q): s0 5884435770e8b65959b22ff77f74b0c2053cadf7fd2a5a28c842104df2f1a512 / 0a99be35b0cd78d650f5014c8ddc783173e6fb849ee556d6fa2a52c73f33d360; s2 5e8042a75e7c38d2f8345c3c3bbf357039efeed530f8758a1a7c7838fe5507fb / 2b1f1e13dce2a769f4091745e531bb998bc122b58cd5f3c09d2c364d904f4a33"
    base_runs: "A31 data/runs_s{s}_f{f}.npz (P runs, base_labels): s0 7b28ac6c224f594ef7bf49d6307186807d91bd8577dbc192e8cece07bea7452c / 98ce5c572aa29576a098685c1d28220684e755cbea537b6739020c0387ddc026; s2 91d04d4f255b7e892343b102c736f1b69c8126a69f2e0df1f5c23f1c60d8860f / ef76e587a0db2c7b18dcbdaee5631497963ad8eb9988a929e4526d5949259ef9"
    a08: "models_frozen/video_within_view_v1/all_s0/final.pt 9b144925f32fac7d725d13231a132abeb6635fa44b6fe0dbcec7f5b59d035bbc; all_s2 f95fed7ba78cc0b5e2474c71a156356507b4588a4b324957fd5b53fe66ee8472 only if the rule triggers. The frozen A08 + B3 keeps producing Base and its runs"
    pair_bank: "native-only, per fit pool: the pool's native sequences (kind native) whose clip code is A4C (2) or A5C (3); a session (session_of(recording)) is eligible if it holds >= 1 native A4C and >= 1 native A5C recording in that pool. Sources that appear only inside constructed streams are not candidates. Sessions in sorted session-id order; recordings of a session and class in pool order. Asserted before any pixel: fold 0 = 740 native recordings, 35 eligible sessions, 55 A4C and 48 A5C recordings in them, 77 distinct A4C-A5C recording pairs (sum over sessions of n4 x n5); fold 1 = 747, 44, 72, 54, 89 (Codex metadata feasibility). A mismatch is an engineering stop. Built from kinds, recording ids and clip codes only: no Base mistake, S1 / harm membership, held-out result or threshold"
    fit_only: "fit fold f reads only pool f for training, checks and fit monitoring; held-out pool 1 - f is read once, by the frozen models' readout"
    not_read: "development / check / test / EchoNet-Pediatric; the A26 runner; outside training media; Unity training; expert or pseudo labels; S1 / harm sets for any training exposure"
  arms:
    S: "same session: the rank term pairs A5C window i with A4C window partner(i) = i (both from chosen session i)"
    C: "cyclically rewired: partner(i) = (i + 1) mod 4; the four chosen sessions are distinct, so every C edge is cross-session"
    identical: "per source seed s and fit fold f both arms copy A08 all_s{s} bit-identically; the same 16 windows per update in the same order, pixels, labels, CE, coefficient, model RNG start, optimiser, schedule and eval mode; the only difference is the partner map inside the rank term"
    trained: "every A08 parameter, explicitly requires_grad from update 0 (no warm-up freeze): encoder (MViTv2-S trunk and its 768 -> 512 projection encoder.head.1), marker_stem, classifier. Structurally zero-gradient tensors are disclosed by the checks, and actual head / marker / encoder movement is measured; requires_grad alone is not called movement"
  batch:
    windows: "16 per update, from the fit pool's pool_W rows, in this order. Slots 0-7 (original 8): A40's batch rules (A07 group_indices / native_starts / eligible_starts: 4 adjacent request centres of one native sequence, short natives repeat their last centre; then 4 adjacent request centres of one constructed stream whose 4 centre labels contain a change). Slots 8-11: the A4C windows of chosen sessions 0..3; slots 12-15: their A5C partners in the same session order"
    original8_draw: "rng = numpy default_rng([20261027, 42, s, f, update, 1]); A40's order: native sequence uniformly, its start uniformly, eligible constructed stream uniformly, its eligible start uniformly. No eligible group: engineering stop"
    extra8_draw: "rng = numpy default_rng([20261027, 42, s, f, update, 2]); sessions = rng.choice(n_bank_sessions, 4, replace=False) over the sorted bank (draw order kept); then for i = 0..3 in that order: a4 = rng.integers(n_A4C(session_i)), a5 = rng.integers(n_A5C(session_i)), c4 = rng.integers(centres of A4C recording a4), c5 = rng.integers(centres of A5C recording a5); each centre is one of the recording's original stride-5 pool_W rows. Duplicates with the original 8 are kept; exposure and duplicate denominators are recorded"
    labels: "the clip code of each centre (extra windows: the native recording's A4C / A5C code); all 5 classes stay in the common CE through the original 8"
    excluded: "no KL, teacher, HOG, decoder, router, ensemble, augmentation, class balancing, hard / error mining, pseudo labels or external data"
  loss:
    margin: "d(x) = logit_A5C(x) - logit_A4C(x) (classes 3 and 2) from the same 5-class head; d4_i = d(slot 8 + i), d5_i = d(slot 12 + i)"
    total: "L = mean over the 16 windows of CE(logits, centre clip code) + 0.5 x mean_{i=0..3} softplus(-(d5_i - d4_partner(i))); torch softplus (beta 1, threshold 20), temperature 1; coefficient 0.5 fixed, no coefficient / rank / normalisation search. The rank term is training only and uses no deployment reference image"
    monitoring: "fit only: every 50th update and the last, the trunk and all-parameter gradient norms of 0.5 x rank (torch.autograd.grad, retain_graph) and of CE (total minus rank) are recorded before the single total backward; same updates in both arms; disclosed, never used to retune"
  optimisation:
    updates: 900
    order: "source seed first: C_f0, S_f0, C_f1, S_f1. Final weights after update 900; no epoch selection"
    optimizer: "AdamW betas (0.9, 0.999), eps 1e-8, weight decay 1e-4 in both groups. Groups, enumerated: 'encoder' = every parameter of m.encoder (conv_proj, pos_encoding, all 16 blocks, norm and the 768 -> 512 projection encoder.head.1) lr 1e-5; 'new' = marker_stem.weight, classifier.weight, classifier.bias lr 1e-4. The 512 projection belongs to the encoder group (A20 / A21 wording error not repeated)"
    schedule: "linear warm-up over 90 updates, then cosine to update 900 (echo_routing.temporal.dev_train.lr_factor via A31 sched)"
    clip: "global gradient norm 1.0 over all parameters, once per update"
    mode: "eval mode in both arms throughout (A08's dropout 0.5 in encoder.head and stochastic depth off; LayerNorm only, no running statistics); gradients on (eval is not no_grad)"
    microbatch: "fixed microbatch 1: each of the 16 windows is a separate forward of the unchanged recogniser; the 16 differentiable logits (no detach, no cached feature head) form the CE and the arm's rank loss; one backward, one clip, one step. Activation checkpointing is not used: the random-tensor probe measured 24.7 GB for 16 retained single-window graphs on the 46 GB L40S. If the check-stage peak exceeded 40 GB, non-reentrant checkpointing of every window in both arms with a fit-only parity check would be added before training as a recorded amendment; no batch / precision / schedule fallback"
    model_rng: "torch.manual_seed(2026102742 + 10 s + f) (CPU and CUDA) immediately before update 0 in both arms (eval disables stochastic layers)"
    numerics: "FP32; TF32 off; cudnn deterministic, benchmark False; torch.use_deterministic_algorithms(True, warn_only=False); torchvision's original matmul / softmax attention (no SDPA swap). Engineering repair fixed before any data computation: torchvision MViT's residual pool_skip nn.MaxPool3d (blocks 1, 3, 14; kernel (1, 3, 3), stride (1, 2, 2), padding (0, 1, 1)) has no deterministic CUDA backward and raises under warn_only=False (probe logs/probe_maxpool.log, random tensors, 0.0021 GPU h). In training models each is replaced by a gather max pool: indices from F.max_pool3d(return_indices=True) under no_grad, output x.flatten(2).gather(2, idx). Identical output values; the gradient goes to the same argmax entries via the deterministic gather backward; no parameters or buffers, state_dict unchanged. The readout uses the original nn.MaxPool3d modules (no backward). Checked: patched = original logits bitwise on fit windows; patched gradient vs the original MaxPool3d backward (warn_only=True only inside that check) relative max <= 1e-5; this is a kernel choice, not a scientific condition"
    limits: "fixed before the checks: microbatch-1 vs batched and patched vs original-pool gradient parity, max abs difference / max abs reference gradient <= 1e-5; 6-update repeat, forced C partner = identity vs S, and 3 + 3 resume vs 6: loss max abs <= 1e-4 and parameter max abs <= 1e-5. A failure is preserved and investigated, never relaxed or removed"
    amendment_after_check_attempt_1: "2026-10-27, before any training. Check attempt 1 (checks_attempt1.json, kept) failed only the microbatch gate in FP32: microbatch 1 vs batch 8 + 8 relative 2.52e-5 (2.70e-6 of 0.107). The check-only diagnosis (scripts/diagnose_session_matched_numerics.py, diagnose_numerics.json, same batch) gives FP64 microbatch 1 vs batch 8 + 8 relative 1.5e-15 (no window coupling), while each FP32 grouping is 7.8e-5 from the FP64 gradient (FP32 round-off through 16 blocks, larger than the FP32 groupings' mutual difference). As in A41 (e74d7b2), the batch-coupling gate is therefore evaluated in FP64 (logit-gradient form z -> dL/dz -> sum of J^T v per microbatch, one graph at a time) at the unchanged 1e-5 relative limit; the FP32 differences are recorded and reported, not gated. The limit value, the patched vs original max-pool gate (FP32, attempt 1 2.1e-7) and every repeat / forced-identity / resume limit are unchanged; the training path (FP32, microbatch 1, 16 retained graphs) is unchanged"
    resume: "at most one active resume file per running model (model, optimiser, CPU / CUDA RNG, update, log), overwritten every 150 updates and deleted after the final weights are verified; the final model stays bound to its A08 source sha256 and code / input / plan hashes"
  models: "per source seed: C_f0, S_f0, C_f1, S_f1; four full-state sha256, the plan / code / input hashes and the per-update manifests committed, and the git objects verified, before that seed's single opposite-fold readout (fit f -> read 1 - f)"
  deployment: "the original A08 + B3 path: Base's P runs (frozen A08 + B3 cuts) with their original nearest-centre multiplicities; each run takes the argmax of the multiplicity-weighted mean of the new model's softmax over its windows; equal neighbours merge (RLE); complete sequences scored with the original evaluator. No decoder, temperature or acceptance threshold change. The new recognition copy is a second A08-size forward per window besides Base's; its cost is measured. Readout code never feeds a reference label into a forward, branch selection, pooling or cut"
  checks: "(1) native pair bank equals the asserted counts; all 900 draws per fold: sessions / recordings / windows inside the fit fold, extra labels A4C in slots 8-11 and A5C in 12-15 from native recordings, four distinct sessions, S edges same-session and C edges cross-session, identical endpoint / window / CE multisets between arms, no S1 / harm membership used, exposure and duplicate counts. (2) original A31 request / pixel / marker path; Base P runs / sequences / A32 rows reconstructed exactly from the validated cached q; Init state equals the pinned A08 bitwise and its online fit-window logits (microbatch 1) equal A31's cached q within 1e-4 (fit-only online parity, distinct from the cached Base reproduction; no held-out pixel is read for Init). (3) independent float64 scalar and gradient of the rank term (C permutation, CE denominator 16, coefficient 0.5, antisymmetric score differences, finite at margins +/-1e3) against the torch loss; rank-only gradient reaches marker_stem, conv_proj, blocks 0 / 15, encoder.head and the A4C / A5C classifier rows. (4) forced C partner = identity reproduces S (losses, updates, weights) through check-only paths, the formal C map untouched; microbatch-1 vs batched and patched vs original max-pool gradient parity; 6-update repeat and 3 + 3 resume (optimiser, RNG). (5) explicit unfreeze, exact optimiser binding and groups, real step counts, zero-gradient tensors listed, head / marker / encoder movement measured; the frozen A08 / Base untouched; the split-monitor path leaves the update unchanged; readout pooling independent of reference labels. (6) a real 16-window fit update and online forward timed, peak memory and disk recorded, conservative launch projection. Checks never read a held-out model output"
  readouts: "per held-out fold and OOF for Base / C / S over all P runs: fixed / broken / net runs and both A4C / A5C directions; A32 S1 (true A5C read as A4C) fixed; Base-correct A5C and A4C kept; S1-fixed true-class source recordings / sessions with denominators (a run counts only its sources inside that run whose clip code is A5C); complete multi segment F1@50, native macro-F1, boundary P / R, FP / short FP, FN / missed short true; S - C, S - Base, C - Base; fit-only monitors (CE, rank under both pairings, pair accuracy, gradient magnitudes, drift); exposure and source / session coverage; measured cost. Private per-window logits and per-run labels saved on the server with sha256 for Codex cache verification. Window accuracy or fewer cuts alone is not success; sessions are not patients"
  seed2_rule:
    target: "S1 fixed (S) - S1 fixed (C) >= +1 in each held-out fold and >= +5 over both folds"
    signal: "S fixes >= ceil(0.10 x S1 runs over both folds) (source 0: 11 of 103), from >= 3 distinct true-A5C source recordings over both folds and >= 1 in each held-out fold"
    retain: "S keeps >= ceil(0.98 x Base-correct A5C runs) correct A5C (source 0: 1,127 of 1,150) and >= C's kept - 3; S keeps >= ceil(0.98 x Base-correct A4C runs) correct A4C (source 0: 1,385 of 1,413) and >= C's kept - 3 (over both folds)"
    net: "in each fold: S - Base net fixed >= 0 and S - C net fixed >= 0"
    system: "in each fold: segment F1 (S - Base) >= 0, segment F1 (S - C) >= 0, native macro-F1 (S - Base) >= -0.003, boundary recall (S - Base) >= -0.005; missed short true over both folds <= Base + 3"
    action: "all met at source 0 and the remaining shared budget allows the same full repetition: source 2 with the same recipe, its own A08 / q / P runs / S1 denominators (not 103 / 1,150 / 1,413), new RNG (s = 2 in every key), four models, freeze and one readout; otherwise this same-session margin-ranking configuration closes at source 0. No automatic alternative rank / CE weight, pair bank, crop, hard mining, encoder or schedule; no full fit, development / check / test / Pediatric evaluation or A43 even if met"
  scope: "a result covers only this same-session vs cyclically rewired logistic margin ranking (coefficient 0.5) added to CE in a 900-update full A08 continuation with this 16-window batch; not passing is not equivalence, does not show a session shortcut or its absence, and does not show that pairing learned LVOT or removed acquisition effects"
  reuse: "A40 Groups / Batches / loader / build-style copy / readout layout and init_base / full_q / heldout_logits (scripts/train_masked_feature.py), A31 loaders / pool_W / outputs / opt_of / sched (scripts/train_session_correction.py), A32 fold data / masks / id guard (scripts/diagnose_a5c_evidence.py), A36 tables / staged / publish, A37 chunk_frames / coverage, A38 loaded_code / boundaries, A39 a5c_extras, A07 group rules; read only"
  budget:
    gpu_hours_max: 4.0
    cpu_hours_max: 3.0
    new_disk_gb_max: 3.0
    min_free_disk_gb: 15
    launch_gate: "before formal training: spent + 4 x 900 updates at the measured rate + the full readout at the measured forward rate + 0.5 GPU h reserve <= 4.0; re-projected before source 2 (whole-round shared cap including source 2). An overrun is an engineering stop; 900 updates, the batch and the scientific conditions are never cut to fit"
    accounting: "GPU = job wall time including failures; CPU = active agent wall clock (idle waits excluded) plus server CPU jobs; GPU loader time is not counted again; actual closing timestamps only, never future reserved spans; Codex's read-only feasibility / audits are disclosed outside this ledger; older ledgers are read only"
    storage: "no pixel / prefix / token / target cache; final weights, small logs and the private readout cache only; at most one active optimiser resume; only this round's regenerable intermediates may be deleted, after the finals are verified"
    ledger: runs/video_session_matched_discrimination_v1/ledger.jsonl
