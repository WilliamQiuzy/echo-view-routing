# Single source of truth for tunables. Experiment files `extends: ../base.yaml` and override keys.
task: family5                 # family5 (primary) | raw9 (sensitivity)
seed: 0
sampling:
  target_hz: 10.0             # routing sample rate (proposal §6.1)
  fps_playback: 30.0
  train_frames_per_video: 16
  eval_frames_per_video: 16
preprocess:
  image_size: 224
  pad: aspect_preserving
encoder:
  backbone: resnet18
  pretrained: true
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 64
  epochs: 30
  patience: 6
  num_workers: 6
  amp: true
  videos_per_epoch: null      # null -> one draw per training cine
features:
  variants: [orig, gamma090, gamma110]
  batch_size: 128
  num_workers: 4
recipes:
  n_per_cell: 60              # per split bank; validation bank selects policy, test bank is frozen
  min_len: 10                 # samples at target_hz (1.0 s)
  max_len: 40                 # samples (4.0 s)
  edit_variant: gamma090
  seed: 1234
decode:
  b1: {window: 5, min_run: 5, mode: prob}
  b2: {stay: 0.98}
  b3: {half_window: 5, threshold: 0.15, nms_radius: 5}
policy:
  score: p10_agree
  min_len: 5                  # samples (0.5 s)
  target_risk: 0.05
  extra_targets: [0.01, 0.10]
  boundary_tolerances_s: [0.25, 0.5, 1.0]
multi:                        # class-balanced multi-fragment banks (proposal §5.3)
  n_train: 1500
  n_eval: 120
  n_fragments: [4, 8]
  edit_prob: 0.5
  p_same_next: 0.35
