# Test-split evaluation config: identical to ev9v_stage1.yaml except VAL_FILE points at test.txt (use with --only_test --resume).
# EchoViewCLIP stage-1 (standard view classification) on EV9V.
# Copy of configs/ultracls/echoviewclip_stage1.yaml with only dataset fields changed; model/optimizer untouched.
# The authors train on 2 GPUs (batch 4 x accumulation 16 each); on our single L40S we double ACCUMULATION_STEPS to keep
# the effective batch size (128) unchanged.
DATA:
    ROOT: '/home/william/echo-view-routing/data/echoviewclip/videos'
    TRAIN_FILE: '/home/william/echo-view-routing/data/echoviewclip/train.txt'
    VAL_FILE: '/home/william/echo-view-routing/data/echoviewclip/test.txt'
    DATASET: ev9v
    NUM_FRAMES: 16
    NUM_CLASSES: 9
    LABEL_LIST: '/home/william/echo-view-routing/data/echoviewclip/labels_ev9v.csv'
MODEL:
    ARCH: ViT-B/16
TRAIN:
    BATCH_SIZE: 4
    ACCUMULATION_STEPS: 32
    LR: 2.2e-05
TEST:
    MULTI_VIEW_INFERENCE: False
TRAINER:
  ViFi_CLIP:
    ZS_EVAL: False
    USE: "both"
